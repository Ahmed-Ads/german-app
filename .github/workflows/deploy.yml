name: Deploy to GitHub Pages

'on':
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Quality Gates & Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: 1. Strict Vocabulary Integrity Verification (SHA-256)
        run: python verify_vocab.py

      - name: 2. Controlled Mutation Tests
        run: python tests/mutation_verifier_test.py

      - name: 3. Vitest Test Suite (Unit, Integrity, Fuzz, Precache)
        run: npx vitest run

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build site distribution
        run: node scripts/build_site.js

      - name: Start background HTTP server
        run: |
          python -m http.server 8000 &
          sleep 2

      - name: 4. Playwright Browser Tests (Offline SW, Upgrade, 360px Viewport)
        run: |
          npx playwright test tests/offline_sw.spec.js tests/sw_upgrade.spec.js tests/viewport_overflow.spec.js

  deploy:
    name: Build & Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site distribution (site/)
        run: node scripts/build_site.js

      - name: Verify site distribution integrity
        run: npx vitest run tests/site_contents.test.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
