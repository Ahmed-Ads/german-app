name: CI Quality & Verification Suite

on:
  push:
    branches: [ main, master, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Quality Gates & Verification (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 20 = minimum supported (package.json engines); Node 22 exposes a global `navigator`
        # without `onLine`, which previously hid a real sync bug on newer runtimes.
        node: ['20', '22']
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: 1. Strict Vocabulary Verification (Rule R1 / SHA-256)
        run: python verify_vocab.py

      - name: 2. Mutation & Regression Testing
        run: python tests/mutation_verifier_test.py

      - name: 3. Vitest Test Suite (Unit, Integrity, Fuzz, Voice, Precache, Emulator)
        run: npx vitest run

      - name: 4. Build site distribution (site/)
        run: node scripts/build_site.js

      - name: 5. Verify site distribution integrity
        run: npx vitest run tests/site_contents.test.js

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start Cloudflare Pages emulator server serving site/
        run: |
          node scripts/serve_pages_emulator.js &
          sleep 2

      - name: 6. Playwright Browser Tests (Offline SW, Upgrade, 360px Viewport, Cloudflare Routing)
        # Note: Playwright on Ubuntu is the only automated browser check executed on GitHub Actions CI.
        # Hardware-specific Windows checks (speechSynthesis male voices, local audio, PowerShell suite)
        # remain strictly local.
        run: |
          npx playwright test tests/offline_sw.spec.js tests/sw_upgrade.spec.js tests/viewport_overflow.spec.js tests/cf_routing.spec.js

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts-node${{ matrix.node }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  firestore-rules:
    name: Firestore Security Rules (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules tests against the emulator
        # emulators:exec sets FIRESTORE_EMULATOR_HOST, which makes the test suite strict:
        # a missing emulator FAILS instead of skipping.
        run: npm run test:rules
