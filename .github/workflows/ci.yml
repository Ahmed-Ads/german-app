name: CI Quality & Verification Suite

on:
  push:
    branches: [ main, master, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Quality Gates & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: 1. Strict Vocabulary Verification (Rule R1 / SHA-256)
        run: python verify_vocab.py

      - name: 2. Controlled Mutation Testing
        run: python tests/mutation_verifier_test.py

      - name: 3. Vitest Test Suite (Unit, Integrity, Fuzz, Voice, Precache)
        run: npx vitest run

      - name: 4. Build site distribution (site/)
        run: node scripts/build_site.js

      - name: 5. Verify site distribution integrity
        run: npx vitest run tests/site_contents.test.js

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start background HTTP server serving built site/
        run: |
          python -m http.server 8000 --directory site &
          sleep 2

      - name: 6. Playwright Browser Tests (Offline SW, Upgrade, 360px Viewport)
        # Note: Playwright on Ubuntu is the only automated browser check executed on GitHub Actions CI.
        # Hardware-specific Windows checks (speechSynthesis male voices, local audio, PowerShell suite)
        # remain strictly local.
        run: |
          npx playwright test tests/offline_sw.spec.js tests/sw_upgrade.spec.js tests/viewport_overflow.spec.js

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
