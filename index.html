  (function(){
    if('serviceWorker' in navigator){
      let hasController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if(hasController){
          if(typeof showUpdateBar === 'function') {
            showUpdateBar();
          } else {
            window.addEventListener('DOMContentLoaded', () => {
              if(typeof showUpdateBar === 'function') showUpdateBar();
            });
          }
        }
        hasController = true;
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const newW = reg.installing;
            if(newW){
              newW.addEventListener('statechange', () => {
                if(newW.state === 'installed' && navigator.serviceWorker.controller){
                  if(typeof showUpdateBar === 'function') showUpdateBar();
                }
              });
            }
          });
        }).catch(err => console.log('SW reg error:', err));
      });
    }
  })();
</script>

  if (window.FirebaseSync) {

    const script = document.createElement('script');
    script.src = 'vendor/firebase-sync.bundle.js';
    script.async = true;
    script.onload = () => {
      if (window.FirebaseSync) {

// "core" = the most essential/common words a learner should master first;
// the rest are "extra" bonus vocabulary. Categories can set an explicit
// `core` count; otherwise the first 20 words (already ordered by importance)
// are treated as core, or all of them if the category has fewer than 20.
function coreCountFor(cat){ return cat.core || Math.min(20, cat.words.length); }

/* ======================= UNIFIED ROBUST STORAGE LAYER ======================= */
const STORAGE_KEYS = {
  PROGRESS: 'german-arabic-progress-v1',
  STATS: 'german-arabic-stats-v1',
  STARRED: 'deutsch_starred_v1',
  SRS: 'deutsch_srs_v1',
  DAILY_GOAL: 'deutsch_daily_goal_v1',
  SCHEMA: 'deutsch_schema_version'
};

let isStorageFallback = false;
const memoryStore = new Map();

/* --- Persistent Storage & Backup Reminder State --- */
let isStoragePersisted = false;
let storagePersistAttempted = false;

function requestPersistentStorageOnce() {
  if (storagePersistAttempted) return;
  const hasProgress = (typeof stats !== 'undefined' && stats && stats.totalAnswered > 0) ||
                      (typeof progress !== 'undefined' && progress && Object.keys(progress).length > 0);
  if (!hasProgress) return;
  storagePersistAttempted = true;

  try {
    if (typeof navigator !== 'undefined' && navigator.storage && typeof navigator.storage.persist === 'function') {
      navigator.storage.persist().then(granted => {
        isStoragePersisted = !!granted;
      }).catch(() => {});
    }
  } catch (_) {}
}

const BACKUP_DATE_KEY = 'deutsch_last_backup_v1';
const BACKUP_REMINDER_DISMISSED_KEY = 'deutsch_backup_reminder_dismissed_v1';

function getLastBackupDate() {
  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      return localStorage.getItem(BACKUP_DATE_KEY);
    }
  } catch (_) {}
  return null;
}

function shouldShowBackupReminder() {
  if (typeof stats === 'undefined' || !stats || !stats.totalAnswered || stats.totalAnswered <= 0) {
    return false;
  }
  let dismissedAt = 0;
  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      const d = localStorage.getItem(BACKUP_REMINDER_DISMISSED_KEY);
      if (d) dismissedAt = parseInt(d, 10) || 0;
    }
  } catch (_) {}

  const now = Date.now();
  if (dismissedAt && (now - dismissedAt) < 7 * 24 * 60 * 60 * 1000) {
    return false;
  }

  const lastBackupStr = getLastBackupDate();
  if (!lastBackupStr) {
    return true; // Never exported
  }

  const lastBackupTime = new Date(lastBackupStr).getTime();
  if (isNaN(lastBackupTime)) {
    return true;
  }

  const fourteenDaysMs = 14 * 24 * 60 * 60 * 1000;
  return (now - lastBackupTime) > fourteenDaysMs;
}

if (typeof window !== 'undefined') {
  window.requestPersistentStorageOnce = requestPersistentStorageOnce;
  window.getLastBackupDate = getLastBackupDate;
  window.shouldShowBackupReminder = shouldShowBackupReminder;
}

function getStorageBackend() {
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      window.localStorage.setItem('__test_storage__', '1');
      window.localStorage.removeItem('__test_storage__');
      return window.localStorage;
    }
  } catch (e) {
    isStorageFallback = true;
  }
  return null;
}

const backend = getStorageBackend();

const appStorage = {
  isFallback: isStorageFallback || !backend,
  get(key) {
    if (this.isFallback) return memoryStore.has(key) ? memoryStore.get(key) : null;
    try {
      return backend.getItem(key);
    } catch (e) {
      this.isFallback = true;
      return memoryStore.has(key) ? memoryStore.get(key) : null;
    }
  },
  set(key, val) {
    const s = String(val);
    if (this.isFallback) {
      memoryStore.set(key, s);
      return;
    }
    try {
      backend.setItem(key, s);
    } catch (e) {
      this.isFallback = true;
      memoryStore.set(key, s);
      showStorageWarningOnce();
    }
  },
  remove(key) {
    if (this.isFallback) {
      memoryStore.delete(key);
      return;
    }
    try {
      backend.removeItem(key);
    } catch (e) {
      memoryStore.delete(key);
    }
  },
  clear() {
    memoryStore.clear();
    if (!this.isFallback && backend) {
      try { backend.clear(); } catch(e) {}
    }
  }
};

let storageWarningShown = false;
function showStorageWarningOnce() {
  if (storageWarningShown) return;
  storageWarningShown = true;
  if(typeof showToast === 'function') {
    showToast('⚠️ وضع التصفح الخاص أو التخزين معطل. سيبقى تقدمك محفوظاً خلال هذه الجلسة فقط.');
  }
}
if (appStorage.isFallback) {
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(showStorageWarningOnce, 1500);
  });
}

// Automatic legacy migration
try {
  if (!appStorage.get(STORAGE_KEYS.PROGRESS) && appStorage.get('deutsch_lern_v1')) {
    appStorage.set(STORAGE_KEYS.PROGRESS, appStorage.get('deutsch_lern_v1'));
  }
  if (!appStorage.get(STORAGE_KEYS.STATS) && appStorage.get('deutsch_stats_v1')) {
    appStorage.set(STORAGE_KEYS.STATS, appStorage.get('deutsch_stats_v1'));
  }
} catch(e) {}

// Bridge for window.storage
window.storage = {
  get: async (key) => {
    const v = appStorage.get(key);
    return v !== null ? { value: v } : null;
  },
  set: async (key, val) => {
    appStorage.set(key, val);
  }
};

// progress[catId][mode] = { unlocked:Number, counts:{ wordIndex:Number } }
const PROGRESS_KEY = 'german-arabic-progress-v1';
let progress = {};
let progressReady = false;
let saveTimer = null;

async function loadProgress(){
  try{
    const res = await window.storage.get(PROGRESS_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)){
        const cleaned = {};
        const knownCatIds = new Set(CATEGORIES.map(c => c.id));
        const catMap = new Map(CATEGORIES.map(c => [c.id, c]));
        const allActiveWordIds = new Set();
        CATEGORIES.forEach(c => {
          if(Array.isArray(c.words)){
            c.words.forEach(w => { if(w && w.id) allActiveWordIds.add(w.id); });
          }
        });
        for(const [catId, val] of Object.entries(parsed)){
          if(knownCatIds.has(catId) && typeof val === 'object' && val !== null && !Array.isArray(val)){
            const cat = catMap.get(catId);
            const maxWords = cat && Array.isArray(cat.words) ? cat.words.length : 0;
            const catProg = {};
            for(const [m, mVal] of Object.entries(val)){
              if(PROGRESS_MODES.includes(m) || m === 'coreAcked'){
                if(m === 'coreAcked'){
                  catProg[m] = mVal;
                } else if(typeof mVal === 'object' && mVal !== null && !Array.isArray(mVal)){
                  let unlocked = Number.isInteger(mVal.unlocked) ? Math.max(0, mVal.unlocked) : 0;
                  unlocked = Math.min(unlocked, maxWords);
                  const modeObj = {
                    unlocked,
                    counts: {}
                  };
                  if(mVal.coreAcked !== undefined) modeObj.coreAcked = mVal.coreAcked;
                  if(typeof mVal.counts === 'object' && mVal.counts !== null && !Array.isArray(mVal.counts)){
                    for(const [wKey, cnt] of Object.entries(mVal.counts)){
                      if(!Number.isInteger(cnt) || cnt < 0) continue;
                      if(/^\d+$/.test(wKey) || allActiveWordIds.has(wKey)){
                        modeObj.counts[wKey] = cnt;
                      }
                    }
                  }
                  catProg[m] = modeObj;
                }
              }
            }
            cleaned[catId] = catProg;
          }
        }
        progress = cleaned;
      } else {
        progress = {};
      }
    } else {
      progress = {};
    }
  }catch(e){
    progress = {};
  }
  progressReady = true;
}

// stats = { lastDate:'YYYY-MM-DD', current:N, longest:N, totalAnswered:N, totalCorrect:N, todayCount:N }
const STATS_KEY = 'german-arabic-stats-v1';
let stats = { lastDate:null, current:0, longest:0, totalAnswered:0, totalCorrect:0, todayCount:0 };
let statsSaveTimer = null;

async function loadStats(){
  const defaultStats = { lastDate:null, current:0, longest:0, totalAnswered:0, totalCorrect:0, todayCount:0 };
  try{
    const res = await window.storage.get(STATS_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)){
        stats = {
          lastDate: (typeof parsed.lastDate === 'string') ? parsed.lastDate : null,
          current: Number.isInteger(parsed.current) && parsed.current >= 0 ? parsed.current : 0,
          longest: Number.isInteger(parsed.longest) && parsed.longest >= 0 ? parsed.longest : 0,
          totalAnswered: Number.isInteger(parsed.totalAnswered) && parsed.totalAnswered >= 0 ? parsed.totalAnswered : 0,
          totalCorrect: Number.isInteger(parsed.totalCorrect) && parsed.totalCorrect >= 0 ? parsed.totalCorrect : 0,
          todayCount: Number.isInteger(parsed.todayCount) && parsed.todayCount >= 0 ? parsed.todayCount : 0
        };
        if(stats.totalCorrect > stats.totalAnswered){
          stats.totalCorrect = stats.totalAnswered;
        }
      } else {
        stats = { ...defaultStats };
      }
    } else {
      stats = { ...defaultStats };
    }
  }catch(e){
    stats = { ...defaultStats };
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function daysBetween(d1, d2){
  if(!d1 || !d2) return 0;
  const [y1, m1, day1] = d1.split('-').map(Number);
  const [y2, m2, day2] = d2.split('-').map(Number);
  const utc1 = Date.UTC(y1, m1 - 1, day1);
  const utc2 = Date.UTC(y2, m2 - 1, day2);
  return Math.round((utc2 - utc1) / 86400000);
}

// The streak the learner should actually SEE right now — if it's been more
// than a day since their last recorded activity, the streak is broken even
// though we don't overwrite the stored number until they act again.
function displayStreak(){
  if(!stats.lastDate) return 0;
  const diff = daysBetween(stats.lastDate, todayStr());
  return diff <= 1 ? stats.current : 0;
}

// Call this on every answered question, anywhere in the app (normal
// practice modes, global review, difficult bank, quiz, section review).
function recordActivity(ok){
  stats.totalAnswered = (stats.totalAnswered || 0) + 1;
  requestPersistentStorageOnce();
  if(ok) stats.totalCorrect = (stats.totalCorrect || 0) + 1;
  const today = todayStr();
  if(stats.lastDate !== today){
    if(stats.lastDate){
      const diff = daysBetween(stats.lastDate, today);
      stats.current = (diff === 1) ? (stats.current || 0) + 1 : 1;
    } else {
      stats.current = 1;
    }
    stats.lastDate = today;
    stats.todayCount = 0;
    if(stats.current > (stats.longest || 0)) stats.longest = stats.current;
  }
  saveStatsSoon();
  if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
}

// A word counts as fully "mastered" only once every mode it can be tested
// in (mcq/written, plus article for noun categories) has reached threshold.
function computeMasteredCount(){
  let count = 0;
  CATEGORIES.forEach(cat=>{
    const catProg = progress[cat.id];
    if(!catProg) return;
    const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
    for(let i=0;i<cat.words.length;i++){
      const w = cat.words[i];
      const allMastered = modes.every(m => catProg[m] && ((w && w.id && catProg[m].counts && catProg[m].counts[w.id]) || 0) >= threshFor(m));
      if(allMastered) count++;
    }
  });
  return count;
}

function ensureProgress(catId, mode){
  if(!PROGRESS_MODES.includes(mode)){
    throw new Error(`Unknown progress mode: ${mode}`);
  }
  progress[catId] = progress[catId] || {};
  if(!progress[catId][mode]){
    const cat = CATEGORIES.find(c => c.id === catId);
    const maxWords = cat && Array.isArray(cat.words) ? cat.words.length : UNLOCK_STEP;
    progress[catId][mode] = { unlocked: Math.min(UNLOCK_STEP, maxWords), counts:{}, coreAcked:false };
  }
  return progress[catId][mode];
}
function threshFor(mode){ return THRESH[mode] || 8; }

// true once the learner has mastered every "core" word for this mode
function coreDone(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const core = coreCountFor(cat);
  const th = threshFor(mode);
  for(let i=0;i<core;i++){
    if(mode === 'plural' && !cat.words[i].pl) continue; // no plural to test for this word
    if(getWordCount(catId,mode,i) < th) return false;
  }
  return true;
}

function resolveWordId(catId, target){
  if(!target && target !== 0) return null;
  const actualCatId = catId || (typeof target === 'string' && target.includes('.') ? target.split('.')[0] : null);
  const cat = CATEGORIES.find(c => c.id === actualCatId);
  if(!cat || !Array.isArray(cat.words)) return null;

  if(typeof target === 'object' && target !== null && target.id){
    return cat.words.some(w => w.id === target.id) ? target.id : null;
  }
  if(typeof target === 'number' && Number.isInteger(target)){
    if(target >= 0 && target < cat.words.length){
      return cat.words[target].id;
    }
    return null;
  }
  if(typeof target === 'string'){
    if(/^\d+$/.test(target)){
      const idx = parseInt(target, 10);
      if(idx >= 0 && idx < cat.words.length){
        return cat.words[idx].id;
      }
      return null;
    }
    if(cat.words.some(w => w.id === target)){
      return target;
    }
    return null;
  }
  return null;
}

function getWordCount(catId, mode, target){
  const p = ensureProgress(catId, mode);
  const wid = resolveWordId(catId, target);
  if(wid && p.counts && p.counts[wid] !== undefined) return p.counts[wid];
  return 0;
}
function setWordCount(catId, mode, target, val){
  const wid = resolveWordId(catId, target);
  if(!wid) return;
  const p = ensureProgress(catId, mode);
  const countVal = Math.max(0, val);
  p.counts[wid] = countVal;
  saveProgressSoon();
  if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
}

// Used by the section quiz: force a word back into active practice
// across all of its normal modes when the learner gets it wrong.
function reinforceWord(catId, idx){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(!cat || !cat.words) return;
  const wid = resolveWordId(catId, idx);
  if(!wid) return;
  const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
  modes.forEach(m=>{
    const p = ensureProgress(catId, m);
    p.unlocked = Math.max(p.unlocked, idx+1);
    const th = threshFor(m);
    const cur = (p.counts && p.counts[wid] !== undefined) ? p.counts[wid] : 0;
    const nextVal = Math.max(0, Math.min(cur, th - 3));
    p.counts[wid] = nextVal;
  });
  saveProgressSoon();
}

// Used by review mode: degrade only the 'plural' mode progress for one word
// (word+article progress is handled separately by reinforceWord).
function reinforcePlural(catId, idx){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(!cat || !cat.words) return;
  const wid = resolveWordId(catId, idx);
  if(!wid) return;
  const p = ensureProgress(catId, 'plural');
  p.unlocked = Math.max(p.unlocked, idx+1);
  const th = threshFor('plural');
  const cur = (p.counts && p.counts[wid] !== undefined) ? p.counts[wid] : 0;
  const nextVal = Math.max(0, Math.min(cur, th - 3));
  p.counts[wid] = nextVal;
  saveProgressSoon();
}

function categoryWords(catId){
  return CATEGORIES.find(c=>c.id===catId).words;
}

// Pool of {catId, idx} for every word the learner has already been
// introduced to (unlocked) in any category they've started practicing.
// Used by the global "review all" screen.
function learnedPool(){
  // A word only counts as "learned" if the learner has actually answered it
  // correctly at least once in some mode (counts[idx] > 0) — NOT just because
  // it fell inside the default "unlocked" window, which gets seeded (and can
  // get bumped) as a side effect of simply rendering progress bars on the
  // home/modes screens, even for modes the learner never actually opened.
  const pool = [];
  CATEGORIES.forEach(cat=>{
    const catProg = progress[cat.id];
    if(!catProg) return; // never opened this category at all
    const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
    for(let i=0;i<cat.words.length;i++){
      const w = cat.words[i];
      const sources = modes.filter(m => catProg[m] && (((w && w.id && catProg[m].counts && catProg[m].counts[w.id]) || 0) > 0));
      if(sources.length) pool.push({ catId: cat.id, idx: i, sources });
    }
  });
  return pool;
}

// Pool of {catId, idx, count, th} for words the learner has attempted in a
// given mode but hasn't mastered yet (count < threshold) — including words
// that got knocked all the way down to 0 by repeated wrong answers, which
// are exactly the words worth surfacing. Sorted hardest (lowest count/th
// ratio) first. Used by the "بنك الكلمات الصعبة" difficult-words bank.
function difficultPool(mode){
  const th = threshFor(mode);
  const pool = [];
  CATEGORIES.forEach(cat=>{
    if(mode === 'article' && !cat.hasArticles) return;
    const catProg = progress[cat.id];
    if(!catProg || !catProg[mode]) return;
    const counts = catProg[mode].counts || {};
    const wordMap = new Map();
    cat.words.forEach((w, i) => { wordMap.set(w.id, i); });
    Object.keys(counts).forEach(k=>{
      const idx = wordMap.get(k);
      if(idx === undefined) return; // tolerate and silently drop deleted/unknown ids
      const c = counts[k] || 0;
      if(c < th) pool.push({ catId: cat.id, idx, count: c, th });
    });
  });
  pool.sort((a,b) => (a.count/a.th) - (b.count/b.th));
  return pool;
}

function unlockedIndices(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const p = ensureProgress(catId, mode);
  const n = Math.min(p.unlocked, cat.words.length);
  return Array.from({length:n}, (_,i)=>i);
}

function activeIndices(catId, mode){
  // words currently unlocked but not yet mastered
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  let idxs = unlockedIndices(catId, mode);
  if(mode === 'plural') idxs = idxs.filter(i => cat.words[i].pl); // skip words with no plural (pl: null)
  return idxs.filter(i => getWordCount(catId,mode,i) < th);
}
function masteredUnlockedIndices(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  let idxs = unlockedIndices(catId, mode);
  if(mode === 'plural') idxs = idxs.filter(i => cat.words[i].pl);
  return idxs.filter(i => getWordCount(catId,mode,i) >= th);
}

function maybeUnlockMore(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const p = ensureProgress(catId, mode);
  while(activeIndices(catId, mode).length === 0 && p.unlocked < cat.words.length){
    p.unlocked = Math.min(p.unlocked + UNLOCK_STEP, cat.words.length);
  }
}

function categoryProgressPct(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  const words = mode === 'plural' ? cat.words.filter(w=>w.pl) : cat.words;
  if(words.length === 0) return 0;
  let sum = 0;
  cat.words.forEach((w,i)=>{ if(mode!=='plural' || w.pl) sum += Math.min(getWordCount(catId,mode,i), th); });
  return Math.round((sum / (words.length*th)) * 100);
}


function normalizeAr(s){
  if(!s) return '';
  return s.trim().toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[\s\-_]+/g, ' ');
}

function streakUnit(n){
  if(n === 1) return 'يوم';
  if(n === 2) return 'يومان';
  if(n >= 3 && n <= 10) return 'أيام';
  return 'يوم';
}

}

/* ======================= HTML ESCAPING & EVALUATION HELPERS ======================= */
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escapeAttr(s){
  return escapeHtml(s);
}

function verbSynonyms(wordId){
  const cat = typeof CATEGORIES !== 'undefined' ? CATEGORIES.find(c => c.id === 'verben') : null;
  if(!cat || !Array.isArray(cat.words)) return [];
  const target = cat.words.find(w => w.id === wordId || w.n === wordId || (wordId && typeof wordId === 'object' && wordId.id === w.id));
  if(!target || !target.ar) return [];
  const targetParts = target.ar.split('/').map(s => s.trim()).filter(Boolean);
  if(targetParts.length === 0) return [];
  const targetSet = new Set(targetParts);

  return cat.words.filter(w => {
    if(w.id === target.id) return false;
    if(!w.ar) return false;
    const parts = w.ar.split('/').map(s => s.trim()).filter(Boolean);
    return parts.some(p => targetSet.has(p));
  });
}

function evaluateWrittenAnswer(inputVal, targetWord, category){
  const val = (inputVal || '').trim();
  if(!val) return { ok: false, empty: true };

  const given = normalizeDe(val).replace(/\s+/g, ' ');
  const wantArticle = category && category.hasArticles && Boolean(targetWord.a);
  const correctWithArt = wantArticle ? `${targetWord.a} ${targetWord.n}` : targetWord.n;
  const normCorrectWithArt = normalizeDe(correctWithArt);
  const normWordOnly = normalizeDe(targetWord.n);

  let ok = false;
  let casingNotice = false;
  let isSynonym = false;
  let matchedSynonym = null;

  const articleRegex = /^(der|die|das)\s+/i;
  const matchArt = val.match(articleRegex);

  if(category && category.id === 'verben'){
    if(given === normWordOnly){
      ok = true;
    } else {
      const syns = typeof verbSynonyms === 'function' ? verbSynonyms(targetWord.id) : [];
      for(const syn of syns){
        if(given === normalizeDe(syn.n)){
          ok = true;
          isSynonym = true;
          matchedSynonym = syn;
          break;
        }
      }
    }
  } else {
    // Non-verb categories: existing logic completely unchanged
    const matchingWords = (category && category.words) ? category.words.filter(w => w.ar.trim() === targetWord.ar.trim()) : [targetWord];

    for(const mw of matchingWords){
      const mwWantArticle = category && category.hasArticles && Boolean(mw.a);
      if(mwWantArticle){
        // الأداة إلزامية: الإجابة لازم تكون "der Apfel" (مع تجاهل حالة الحروف)
        if(matchArt && matchArt[1].toLowerCase() === mw.a.toLowerCase() &&
          given === normalizeDe(`${mw.a} ${mw.n}`)){
          ok = true;
          break;
        }
      } else if(given === normalizeDe(mw.n)){
        ok = true;
        break;
      }
    }
  }

  // الكلمة صحيحة لكن بدون أداة التعريف: تُحسب خطأ مع تنبيه
  let missingArticle = false;
  if(!ok && !matchArt && category && category.hasArticles){
    const matchingWords = category.words ? category.words.filter(w => w.ar.trim() === targetWord.ar.trim()) : [targetWord];
    missingArticle = matchingWords.some(mw => mw.a && given === normalizeDe(mw.n));
  }

  // Educational hint for lowercase German nouns
  if(ok && targetWord.n && /^[A-ZÄÖÜ]/.test(targetWord.n)){
    const nounPart = matchArt ? val.slice(matchArt[0].length).trim() : val.trim();
    if(nounPart.length > 0 && /^[a-zäöü]/.test(nounPart)){
      casingNotice = true;
    }
  }

  const out = { ok, casingNotice, missingArticle };
  if(isSynonym){
    out.isSynonym = true;
    out.matchedSynonym = matchedSynonym;
  }
  return out;
}

  'helga',     // Apple / SAPI
  'zira',      // Microsoft Desktop
  ' female',   // Generic female indicators
  '(female)',
  '_female',
  'weiblich'
];

function isGermanVoice(v){
  if(!v || !v.lang) return false;
  const l = String(v.lang).toLowerCase().replace('_', '-');
  return l === 'de' || l.startsWith('de-');
}

function isFemaleVoice(v){
  if(!v || !v.name) return false;
  const n = String(v.name).toLowerCase();
  return KNOWN_FEMALE_GERMAN_VOICES.some(f => n.includes(f));
}

function isMaleVoice(v){
  if(!v || !v.name) return false;
  if(isFemaleVoice(v)) return false; // female exclusion takes priority
  const n = String(v.name).toLowerCase();
  return KNOWN_MALE_GERMAN_VOICES.some(m => n.includes(m));
}

function selectVoice(allVoices, savedChoice = null, isOnline = true){
  const candidates = (allVoices || []).filter(isGermanVoice);
  if(candidates.length === 0){
    return { voice: null, reason: 'default', isMale: false, isLocal: false, needsNetwork: false, candidates: [] };
  }

  const maleLocal = candidates.find(v => isMaleVoice(v) && v.localService === true);
  const maleOnline = candidates.find(v => isMaleVoice(v) && !v.localService);
  const anyLocal = candidates.find(v => v.localService === true);
  const anyOnline = candidates.find(v => !v.localService);

  // 1. User's saved choice: must exist AND its lang must start with "de"
  if(savedChoice){
    const saved = candidates.find(v => isGermanVoice(v) && ((v.voiceURI && v.voiceURI === savedChoice) || v.name === savedChoice));
    if(saved){
      // When offline and saved voice is not local, prefer a local German voice if available
      if(!isOnline && !saved.localService){
        if(maleLocal){
          return { voice: maleLocal, reason: 'male_local_offline', isMale: true, isLocal: true, needsNetwork: false, candidates };
        }
        if(anyLocal){
          return { voice: anyLocal, reason: 'any_local_offline', isMale: isMaleVoice(anyLocal), isLocal: true, needsNetwork: false, candidates };
        }
        // No local German voice exists: use saved voice but warn about network
        return { voice: saved, reason: 'saved_needs_net', isMale: isMaleVoice(saved), isLocal: false, needsNetwork: true, candidates };
      }
      const isLocal = Boolean(saved.localService);
      return { voice: saved, reason: 'saved', isMale: isMaleVoice(saved), isLocal, needsNetwork: !isOnline && !isLocal, candidates };
    }
  }

  // 2. Offline-first ranking when offline:
  // male local > any local > male online > any online > default
  if(!isOnline){
    if(maleLocal) return { voice: maleLocal, reason: 'male_local', isMale: true, isLocal: true, needsNetwork: false, candidates };
    if(anyLocal) return { voice: anyLocal, reason: 'any_local', isMale: isMaleVoice(anyLocal), isLocal: true, needsNetwork: false, candidates };
    if(maleOnline) return { voice: maleOnline, reason: 'male_online', isMale: true, isLocal: false, needsNetwork: true, candidates };
    if(anyOnline) return { voice: anyOnline, reason: 'any_online', isMale: isMaleVoice(anyOnline), isLocal: false, needsNetwork: true, candidates };
    return { voice: candidates[0], reason: 'fallback', isMale: isMaleVoice(candidates[0]), isLocal: Boolean(candidates[0].localService), needsNetwork: !candidates[0].localService, candidates };
  }

  // 3. Online ranking:
  // male local > male online > any local > any online > default
  if(maleLocal) return { voice: maleLocal, reason: 'male_local', isMale: true, isLocal: true, needsNetwork: false, candidates };
  if(maleOnline) return { voice: maleOnline, reason: 'male_online', isMale: true, isLocal: false, needsNetwork: false, candidates };
  if(anyLocal) return { voice: anyLocal, reason: 'any_local', isMale: isMaleVoice(anyLocal), isLocal: true, needsNetwork: false, candidates };
  if(anyOnline) return { voice: anyOnline, reason: 'any_online', isMale: isMaleVoice(anyOnline), isLocal: false, needsNetwork: false, candidates };

  return { voice: candidates[0], reason: 'fallback', isMale: isMaleVoice(candidates[0]), isLocal: Boolean(candidates[0].localService), needsNetwork: false, candidates };
}

function createVoiceManager(synth = (typeof window !== 'undefined' ? window.speechSynthesis : null), storage = (typeof appStorage !== 'undefined' ? appStorage : null)){
  let selectedVoice = null;
  let selectionReason = 'default';
  let isMale = false;
  let isLocal = false;
  let needsNet = false;
  let candidates = [];
  let isLoaded = false;
  let retryTimer = null;
  let warnedNoMale = false;
  let warnedOffline = false;

  function getSavedChoice(){
    try {
      if(storage && typeof storage.get === 'function') return storage.get('deutsch_voice_v1');
      if(typeof window !== 'undefined' && window.localStorage) return window.localStorage.getItem('deutsch_voice_v1');
    } catch(e){}
    return null;
  }

  function setSavedChoice(val){
    try {
      if(storage && typeof storage.set === 'function') storage.set('deutsch_voice_v1', val);
      else if(typeof window !== 'undefined' && window.localStorage) window.localStorage.setItem('deutsch_voice_v1', val);
    } catch(e){}
  }

  function removeSavedChoice(){
    try {
      if(storage && typeof storage.remove === 'function') storage.remove('deutsch_voice_v1');
      if(typeof window !== 'undefined' && window.localStorage) window.localStorage.removeItem('deutsch_voice_v1');
    } catch(e){}
  }

  function update(){
    if(!synth || typeof synth.getVoices !== 'function') return false;
    const all = synth.getVoices() || [];
    candidates = all.filter(isGermanVoice);
    const saved = getSavedChoice();
    const isOnline = (typeof navigator !== 'undefined') ? (navigator.onLine !== false) : true;
    const res = selectVoice(all, saved, isOnline);
    selectedVoice = res.voice;
    selectionReason = res.reason;
    isMale = res.isMale;
    isLocal = res.isLocal;
    needsNet = res.needsNetwork;
    if(all.length > 0) isLoaded = true;
    return isLoaded;
  }

  function init(timeoutMs = 3000){
    if(!synth) return Promise.resolve(null);
    update();
    if(isLoaded && candidates.length > 0){
      return Promise.resolve(selectedVoice);
    }

    return new Promise(resolve => {
      let done = false;
      const start = Date.now();

      function onVoices(){
        if(done) return;
        update();
        if(candidates.length > 0 || (Date.now() - start >= timeoutMs)){
          done = true;
          cleanup();
          resolve(selectedVoice);
        }
      }

      function cleanup(){
        if(retryTimer){ clearInterval(retryTimer); retryTimer = null; }
        if(synth && synth.removeEventListener){ synth.removeEventListener('voiceschanged', onVoices); }
      }

      if(synth.addEventListener){
        synth.addEventListener('voiceschanged', onVoices);
      } else {
        synth.onvoiceschanged = onVoices;
      }

      retryTimer = setInterval(()=>{
        const vList = (synth && synth.getVoices) ? synth.getVoices() : [];
        if(vList.length > 0 || (Date.now() - start >= timeoutMs)){
          onVoices();
        }
      }, 100);
    });
  }

  return {
    init,
    update,
    getVoice: () => selectedVoice,
    getReason: () => selectionReason,
    isMale: () => isMale,
    isLocal: () => isLocal,
    needsNetwork: () => needsNet,
    hasMaleCandidate: () => candidates.some(isMaleVoice),
    getCandidates: () => candidates,
    getSavedChoice,
    setSavedChoice: (val) => { setSavedChoice(val); update(); },
    resetSavedVoice: () => { removeSavedChoice(); update(); },
    hasWarnedNoMale: () => {
      try {
        if(warnedNoMale) return true;
        if(storage && typeof storage.get === 'function') return storage.get('deutsch_no_male_warned_v1') === '1';
        if(typeof window !== 'undefined' && window.localStorage) return window.localStorage.getItem('deutsch_no_male_warned_v1') === '1';
      } catch(e){}
      return warnedNoMale;
    },
    markWarnedNoMale: () => {
      warnedNoMale = true;
      try {
        if(storage && typeof storage.set === 'function') storage.set('deutsch_no_male_warned_v1', '1');
        else if(typeof window !== 'undefined' && window.localStorage) window.localStorage.setItem('deutsch_no_male_warned_v1', '1');
      } catch(e){}
    },
    hasWarnedOffline: () => {
      try {
        if(warnedOffline) return true;
        if(storage && typeof storage.get === 'function') return storage.get('deutsch_offline_voice_warned_v1') === '1';
        if(typeof window !== 'undefined' && window.localStorage) return window.localStorage.getItem('deutsch_offline_voice_warned_v1') === '1';
      } catch(e){}
      return warnedOffline;
    },
    markWarnedOffline: () => {
      warnedOffline = true;
      try {
        if(storage && typeof storage.set === 'function') storage.set('deutsch_offline_voice_warned_v1', '1');
        else if(typeof window !== 'undefined' && window.localStorage) window.localStorage.setItem('deutsch_offline_voice_warned_v1', '1');
      } catch(e){}
    }
  };
}

const VoiceSelection = {
  KNOWN_MALE_GERMAN_VOICES,
  KNOWN_FEMALE_GERMAN_VOICES,
  isGermanVoice,
  isFemaleVoice,
  isMaleVoice,
  selectVoice,

let deVoice = null;
function speak(text){
  try{
    if(!text || !('speechSynthesis' in window)) return;
    text = String(text);
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';

    if(window.voiceManager){
      const v = window.voiceManager.getVoice();
      if(v) u.voice = v;
      if(!window.voiceManager.hasMaleCandidate() && !window.voiceManager.hasWarnedNoMale()){
        showNoMaleVoiceWarningOnce();
      }
      if(window.voiceManager.needsNetwork() && !window.voiceManager.hasWarnedOffline()){
        showOfflineVoiceWarningOnce();
      }
    } else if(deVoice){
      u.voice = deVoice;
    }

    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  }catch(e){ /* audio not critical */ }
}

function showToast(msg){
  let t = document.getElementById('appToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'appToast';
    t.className = 'app-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;

  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2500);
}

// Minimal action toast: shows a message with a labelled action button for ~6 s.
// actionLabel: Arabic button text; onAction: callback when button is clicked.
// Returns a cancel function to dismiss early.
function showToastWithAction(msg, actionLabel, onAction){
  if(typeof document === 'undefined') return ()=>{};
  let el = document.getElementById('appActionToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'appActionToast';
    el.className = 'app-action-toast';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  clearTimeout(el._timer);
  el.innerHTML = '';
  const msgSpan = document.createElement('span');
  msgSpan.textContent = msg;
  el.appendChild(msgSpan);
  const btn = document.createElement('button');
  btn.className = 'app-action-toast__btn';
  btn.textContent = actionLabel;
  btn.type = 'button';
  el.appendChild(btn);
  el.classList.add('show');
  function dismiss(){
    clearTimeout(el._timer);
    el.classList.remove('show');
    btn.onclick = null;
    if(typeof el.remove === 'function') el.remove();
    else if(el.parentNode) el.parentNode.removeChild(el);
  }
  el._dismiss = dismiss;
  btn.onclick = ()=>{ dismiss(); onAction(); };
  // Allow keyboard access
  btn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); btn.onclick(); } });
  el._timer = setTimeout(dismiss, 6000);
  return dismiss;
}

// Dismiss any active action toast immediately (e.g. on screen/view transition)
function dismissActionToast(){
  if(typeof document === 'undefined') return;
  const el = document.getElementById('appActionToast');
  if(!el) return;
  clearTimeout(el._timer);
  el.classList.remove('show');
  const btn = el.querySelector('.app-action-toast__btn');
  if(btn) btn.onclick = null;
  if(typeof el.remove === 'function') el.remove();
  else if(el.parentNode) el.parentNode.removeChild(el);
}

/* ---------- Starred Words ---------- */
let starredSet = new Set();
async function loadStarred(){
  starredSet = new Set();
  try {
    const raw = (window.localStorage && window.localStorage.getItem('deutsch_starred_v1')) || '[]';
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed)){
      const knownCatIds = new Set(CATEGORIES.map(c => c.id));
      const catWordCounts = new Map(CATEGORIES.map(c => [c.id, c.words.length]));
      const allActiveWordIds = new Set();
      CATEGORIES.forEach(c => {
        if(Array.isArray(c.words)) c.words.forEach(w => { if(w && w.id) allActiveWordIds.add(w.id); });
      });
      parsed.forEach(item => {
        if(typeof item === 'string'){
          if(item.includes('.')){
            if(allActiveWordIds.has(item)){
              starredSet.add(item);
            }
          } else {
            const parts = item.split('_');
            if(parts.length === 2 && knownCatIds.has(parts[0])){
              const idx = parseInt(parts[1], 10);
              if(Number.isInteger(idx) && idx >= 0 && idx < catWordCounts.get(parts[0])){
                const cat = CATEGORIES.find(c => c.id === parts[0]);
                if(cat && cat.words[idx] && cat.words[idx].id && allActiveWordIds.has(cat.words[idx].id)){
                  starredSet.add(cat.words[idx].id);
                }
              }
            }
          }
        }
      });
    }
  } catch(e){
    starredSet = new Set();
  }
}
function saveStarredSoon(){
  try {
    if(window.localStorage){
      window.localStorage.setItem('deutsch_starred_v1', JSON.stringify(Array.from(starredSet)));
    }
  } catch(e){}
}
function isStarred(catId, target){
  const wid = resolveWordId(catId, target);
  if(wid && starredSet.has(wid)) return true;
  return false;
}
function toggleStar(catId, target){
  const wid = resolveWordId(catId, target);
  if(!wid) return false;

  if(starredSet.has(wid)){
    starredSet.delete(wid);
    saveStarredSoon();
    if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
    showToast('تمت إزالة الكلمة من المميزة ⭐');
    return false;
  } else {
    starredSet.add(wid);
    saveStarredSoon();
    if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
    showToast('تمت إضافة الكلمة إلى المفضلة ⭐');
    return true;
  }
}
function toggleStarFeedback(catId, idx, btn){
  const active = toggleStar(catId, idx);
  if(btn){
    if(active){ btn.classList.add('starred'); }
    else { btn.classList.remove('starred'); }
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    btn.setAttribute('title', active ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة');
    btn.setAttribute('aria-label', active ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة');
  }
}
function starredPool(){
  const pool = [];
  CATEGORIES.forEach(c => {
    c.words.forEach((w, idx) => {
      if(w.id && starredSet.has(w.id)){
        pool.push({ catId: c.id, cat: c, idx, word: w });
      }
    });
  });
  return pool;
}

/* ---------- Leitner Spaced Repetition System (SRS) ---------- */
const SRS_INTERVALS = [1, 3, 7, 14, 30]; // days per box (0, 1, 2, 3, 4)
let srsStore = {};
async function loadSrs(){
  srsStore = {};
  try {
    const raw = (window.localStorage && window.localStorage.getItem('deutsch_srs_v1')) || '{}';
    const parsed = JSON.parse(raw);
    if(typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)){
      const knownCatIds = new Set(CATEGORIES.map(c => c.id));
      const catWordCounts = new Map(CATEGORIES.map(c => [c.id, c.words.length]));
      const allActiveWordIds = new Set();
      CATEGORIES.forEach(c => {
        if(Array.isArray(c.words)) c.words.forEach(w => { if(w && w.id) allActiveWordIds.add(w.id); });
      });
      for(const [k, rec] of Object.entries(parsed)){
        if(typeof rec === 'object' && rec !== null && !Array.isArray(rec)){
          const entry = {
            box: Number.isInteger(rec.box) && rec.box >= 0 && rec.box <= 4 ? rec.box : 0,
            lastDate: typeof rec.lastDate === 'string' ? rec.lastDate : todayStr(),
            nextDate: typeof rec.nextDate === 'string' ? rec.nextDate : todayStr()
          };
          if(k.includes('.')){
            if(allActiveWordIds.has(k)){
              srsStore[k] = entry;
            }
          } else {
            const parts = k.split('_');
            if(parts.length === 2 && knownCatIds.has(parts[0])){
              const idx = parseInt(parts[1], 10);
              if(Number.isInteger(idx) && idx >= 0 && idx < catWordCounts.get(parts[0])){
                const cat = CATEGORIES.find(c => c.id === parts[0]);
                if(cat && cat.words[idx] && cat.words[idx].id && allActiveWordIds.has(cat.words[idx].id)){
                  srsStore[cat.words[idx].id] = entry;
                }
              }
            }
          }
        }
      }
    }
  } catch(e){
    srsStore = {};
  }
}
function saveSrsSoon(){
  try {
    if(window.localStorage){
      window.localStorage.setItem('deutsch_srs_v1', JSON.stringify(srsStore));
    }
  } catch(e){}
}
function addDaysToStr(dateStr, numDays){
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + numDays);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function updateSrs(catId, target, ok, mode){
  // Recognition-only successes (multiple choice, or the self-rated flashcard "I know it") can
  // bring a new or lapsed word into box 1 but never push it further: only typed recall,
  // listening, article/plural/conjugation practice can advance a word to the longer intervals.
  // (kept inside the function so the function stays self-contained)
  const recognitionModes = ['mcq', 'flashcard'];
  const wid = resolveWordId(catId, target);
  if(!wid) return;
  const now = todayStr();
  const rec = srsStore[wid] || { box: 0, lastDate: now, nextDate: now };
  if(ok){
    if(recognitionModes.includes(mode)){
      if((rec.box || 0) >= 1) return;
      rec.box = 1;
    } else {
      rec.box = Math.min((rec.box || 0) + 1, SRS_INTERVALS.length - 1);
    }
  } else {
    // a miss moves the word back one box (not all the way to the start)
    rec.box = Math.max((rec.box || 0) - 1, 0);
  }
  const interval = SRS_INTERVALS[rec.box];
  rec.lastDate = now;
  rec.nextDate = addDaysToStr(now, interval);
  srsStore[wid] = rec;
  saveSrsSoon();
  if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
}
function srsDuePool(){
  const now = todayStr();
  const pool = [];
  CATEGORIES.forEach(c => {
    c.words.forEach((w, idx) => {
      const rec = w.id && srsStore[w.id];
      if(rec && rec.nextDate && rec.nextDate <= now){
        pool.push({ catId: c.id, cat: c, idx, word: w, box: rec.box + 1 });
      }
    });
  });
  return pool;
}
function getSrsDueWords(){ return srsDuePool(); }

/* ---------- Daily Goal ---------- */
function getDailyGoalUpdatedAt(){
  try {
    return (window.localStorage && window.localStorage.getItem('deutsch_daily_goal_updated_at_v1')) || '';
  } catch(e){ return ''; }
}
function setDailyGoalUpdatedAt(ts){
  try {
    if(window.localStorage) window.localStorage.setItem('deutsch_daily_goal_updated_at_v1', ts || '');
    if(appStorage) appStorage.set('deutsch_daily_goal_updated_at_v1', ts || '');
  } catch(e){}
}
function getDailyGoalRecord(){
  return {
    target: getDailyGoal(),
    updatedAt: getDailyGoalUpdatedAt()
  };
}
function getDailyGoal(){
  try {
    const v = window.localStorage && window.localStorage.getItem('deutsch_daily_goal_v1');
    if(v !== null){
      const parsed = parseInt(v, 10);
      if(Number.isInteger(parsed) && parsed >= 5 && parsed <= 200){
        return parsed;
      }
    }
    return 20;
  } catch(e){ return 20; }
}
function setDailyGoal(g, preserveTimestamp = false, customTimestamp = null){
  try {
    const clamped = Math.max(5, Math.min(200, Math.round(Number(g) || 20)));
    if(window.localStorage) window.localStorage.setItem('deutsch_daily_goal_v1', String(clamped));
    if(appStorage) appStorage.set(STORAGE_KEYS.DAILY_GOAL, String(clamped));
    if(customTimestamp !== null){
      setDailyGoalUpdatedAt(customTimestamp);
    } else if(!preserveTimestamp){
      setDailyGoalUpdatedAt(new Date().toISOString());
    }
    if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
    showToast(`تم تعيين الهدف اليومي إلى ${clamped} كلمة 🎯`);
    render();
  } catch(e){}
}
function getTodayCount(){

}

/* ---------- Backup & Restore Validation ---------- */
function validateBackupData(data, categoriesList = (typeof CATEGORIES !== 'undefined' ? CATEGORIES : [])){
  if(!data || typeof data !== 'object' || Array.isArray(data)){
    return { valid: false, error: 'الملف غير صالح: لا يحتوي على كائن بيانات صالح (JSON Object).' };
  }

  const knownCatIds = new Set(categoriesList.map(c => c.id));
  const catWordCounts = new Map(categoriesList.map(c => [c.id, c.words ? c.words.length : 0]));
  const validModes = new Set(typeof PROGRESS_MODES !== 'undefined' ? PROGRESS_MODES : ['mcq', 'written', 'article', 'plural', 'listen', 'conj']);
  const legacyMap = (typeof SyncMergePolicy !== 'undefined' && SyncMergePolicy && SyncMergePolicy.LEGACY_INDEX_IDS) || null;
  const maxLegacyWords = (catId) => Math.max(catWordCounts.get(catId) || 0, (legacyMap && legacyMap[catId] ? legacyMap[catId].length : 0));

  const hasProgress = data.progress !== undefined;
  const hasStats = data.stats !== undefined;
  const hasStarred = data.starred !== undefined;
  const hasSrs = data.srs !== undefined;
  const hasGoal = data.dailyGoal !== undefined;

  if(!hasProgress && !hasStats && !hasStarred && !hasSrs && !hasGoal){
    return { valid: false, error: 'الملف غير صالح أو فارغ: لا يحتوي على أي حقول تقدم صالحة (progress, stats, starred, srs, dailyGoal).' };
  }

  // 1. Progress validation
  if(hasProgress){
    if(typeof data.progress !== 'object' || data.progress === null || Array.isArray(data.progress)){
      return { valid: false, error: 'حقل التقدم (progress) غير صالح أو فارغ.' };
    }
    for(const [catId, catVal] of Object.entries(data.progress)){
      if(!knownCatIds.has(catId)){
        return { valid: false, error: `القسم «${catId}» في بيانات التقدم غير معروف في التطبيق.` };
      }
      if(typeof catVal !== 'object' || catVal === null || Array.isArray(catVal)){
        return { valid: false, error: `بيانات القسم «${catId}» غير صالحة.` };
      }
      const maxWords = catWordCounts.get(catId) || 0;
      for(const [mKey, mVal] of Object.entries(catVal)){
        if(mKey === 'coreAcked'){
          if(typeof mVal !== 'boolean') return { valid: false, error: `حقل coreAcked في القسم «${catId}» غير صالح.` };
          continue;
        }
        if(!validModes.has(mKey)){
          return { valid: false, error: `الوضع «${mKey}» في القسم «${catId}» غير معروف.` };
        }
        if(typeof mVal !== 'object' || mVal === null || Array.isArray(mVal)){
          return { valid: false, error: `بيانات الوضع «${mKey}» في القسم «${catId}» غير صالحة.` };
        }
        if(mVal.unlocked !== undefined && (!Number.isInteger(mVal.unlocked) || mVal.unlocked < 0 || mVal.unlocked > maxWords + 50)){
          return { valid: false, error: `عدد الكلمات المفتوحة في «${catId}/${mKey}» غير صالح.` };
        }
        if(mVal.counts !== undefined){
          if(typeof mVal.counts !== 'object' || mVal.counts === null || Array.isArray(mVal.counts)){
            return { valid: false, error: `عدادات الكلمات في «${catId}/${mKey}» غير صالحة.` };
          }
          for(const [keyStr, cnt] of Object.entries(mVal.counts)){
            if(/^\d+$/.test(keyStr)){
              const wIdx = parseInt(keyStr, 10);
              if(!Number.isInteger(wIdx) || wIdx < 0 || wIdx >= maxLegacyWords(catId)){
                return { valid: false, error: `فهرس الكلمة (${keyStr}) في القسم «${catId}» خارج نطاق القسم.` };
              }
            } else if(keyStr.startsWith(catId + '.') && keyStr.slice(catId.length + 1).length > 0 && /^[a-z0-9_.-]+$/.test(keyStr.slice(catId.length + 1))){
              // Valid word ID
            } else {
              return { valid: false, error: `معرف الكلمة (${keyStr}) في «${catId}» ليس معرفاً مستقراً صالحاً.` };
            }
            if(!Number.isInteger(cnt) || cnt < 0 || cnt > 10000){
              return { valid: false, error: `قيمة العداد للكلمة (${keyStr}) في «${catId}/${mKey}» غير صالحة.` };
            }
          }
        }
      }
    }
  }

  // 2. Stats validation
  if(hasStats){
    if(typeof data.stats !== 'object' || data.stats === null || Array.isArray(data.stats)){
      return { valid: false, error: 'حقل الإحصائيات (stats) غير صالح أو فارغ.' };
    }
    const numFields = ['current', 'longest', 'totalAnswered', 'totalCorrect'];
    for(const f of numFields){
      if(data.stats[f] !== undefined && (!Number.isInteger(data.stats[f]) || data.stats[f] < 0)){
        return { valid: false, error: `حقل الإحصائيات «${f}» يجب أن يكون عدداً صحيحاً غير سالب.` };
      }
    }
    if(data.stats.todayCount !== undefined && (!Number.isInteger(data.stats.todayCount) || data.stats.todayCount < 0)){
      return { valid: false, error: 'قيمة إنجاز اليوم في الإحصائيات غير صالحة.' };
    }
    if(data.stats.totalCorrect !== undefined && data.stats.totalAnswered !== undefined && data.stats.totalCorrect > data.stats.totalAnswered){
      return { valid: false, error: 'عدد الإجابات الصحيحة لا يمكن أن يتجاوز إجمالي الإجابات.' };
    }
    if(data.stats.lastDate !== undefined && data.stats.lastDate !== null && typeof data.stats.lastDate !== 'string'){
      return { valid: false, error: 'تاريخ آخر تدريب في الإحصائيات غير صالح.' };
    }
  }

  // 3. Starred validation
  if(hasStarred){
    if(!Array.isArray(data.starred)){
      return { valid: false, error: 'حقل المفضلة (starred) يجب أن يكون مصفوفة.' };
    }
    for(const item of data.starred){
      if(typeof item !== 'string'){
        return { valid: false, error: 'عنصر في المفضلة بصيغة غير صالحة.' };
      }
      if(/^[a-z0-9-]+_\d+$/.test(item)){
        const lastIdx = item.lastIndexOf('_');
        const catId = item.slice(0, lastIdx);
        const idxStr = item.slice(lastIdx + 1);
        if(!knownCatIds.has(catId)){
          return { valid: false, error: `القسم «${catId}» في المفضلة غير معروف في التطبيق.` };
        }
        const idx = parseInt(idxStr, 10);
        if(!Number.isInteger(idx) || idx < 0 || idx >= maxLegacyWords(catId)){
          return { valid: false, error: `فهرس الكلمة «${item}» في المفضلة خارج نطاق القسم.` };
        }
      } else if(item.includes('.')){
        const dotIdx = item.indexOf('.');
        const catId = item.slice(0, dotIdx);
        const slug = item.slice(dotIdx + 1);
        if(!knownCatIds.has(catId)){
          return { valid: false, error: `القسم «${catId}» في المفضلة غير معروف في التطبيق.` };
        }
        if(!slug || !/^[a-z0-9_.-]+$/.test(slug)){
          return { valid: false, error: `معرّف الكلمة المميزة «${item}» ليس معرفاً مستقراً صالحاً.` };
        }
      } else {
        return { valid: false, error: `معرّف الكلمة المميزة «${item}» ليس معرفاً مستقراً صالحاً.` };
      }
    }
  }

  // 4. Srs validation
  if(hasSrs){
    if(typeof data.srs !== 'object' || data.srs === null || Array.isArray(data.srs)){
      return { valid: false, error: 'حقل التكرار المتباعد (srs) غير صالح.' };
    }
    for(const [k, rec] of Object.entries(data.srs)){
      if(/^[a-z0-9-]+_\d+$/.test(k)){
        const lastIdx = k.lastIndexOf('_');
        const catId = k.slice(0, lastIdx);
        const idxStr = k.slice(lastIdx + 1);
        if(!knownCatIds.has(catId)) return { valid: false, error: `قسم SRS «${catId}» غير معروف.` };
        const idx = parseInt(idxStr, 10);
        if(!Number.isInteger(idx) || idx < 0 || idx >= maxLegacyWords(catId)){
          return { valid: false, error: `فهرس الكلمة «${k}» في SRS خارج نطاق القسم.` };
        }
      } else if(k.includes('.')){
        const dotIdx = k.indexOf('.');
        const catId = k.slice(0, dotIdx);
        const slug = k.slice(dotIdx + 1);
        if(!knownCatIds.has(catId)) return { valid: false, error: `قسم SRS «${catId}» غير معروف.` };
        if(!slug || !/^[a-z0-9_.-]+$/.test(slug)){
          return { valid: false, error: `مفتاح SRS «${k}» ليس معرفاً مستقراً صالحاً.` };
        }
      } else {
        return { valid: false, error: `مفتاح SRS «${k}» ليس معرفاً مستقراً صالحاً.` };
      }
      if(typeof rec !== 'object' || rec === null || Array.isArray(rec)){
        return { valid: false, error: `سجل SRS للكلمة «${k}» غير صالح.` };
      }
      if(rec.box !== undefined && (!Number.isInteger(rec.box) || rec.box < 0 || rec.box > 4)){
        return { valid: false, error: `رقم صندوق SRS للكلمة «${k}» يجب أن يكون بين 0 و 4.` };
      }
      if(rec.lastDate !== undefined && typeof rec.lastDate !== 'string'){
        return { valid: false, error: `تاريخ المراجعة السابق للكلمة «${k}» غير صالح.` };
      }
      if(rec.nextDate !== undefined && typeof rec.nextDate !== 'string'){
        return { valid: false, error: `تاريخ المراجعة القادم للكلمة «${k}» غير صالح.` };
      }
    }
  }

  // 5. DailyGoal validation
  if(hasGoal){
    const g = typeof data.dailyGoal === 'object' && data.dailyGoal !== null ? data.dailyGoal.target : data.dailyGoal;
    const numG = Number(g);
    if(isNaN(numG) || !Number.isInteger(numG) || numG < 5 || numG > 200){
      return { valid: false, error: 'الهدف اليومي (dailyGoal) يجب أن يكون عدداً صحيحاً بين 5 و 200 كلمة.' };
    }
  }

  return { valid: true };
}

/* ---------- Backup & Restore ---------- */
// NOTE: Voice preference (deutsch_voice_v1) is intentionally NOT exported or imported
// in backups because speech synthesis voices are hardware/OS/browser-specific.
// NOTE ON BROWSER DOWNLOADS: Standard browser security APIs cannot detect whether a user
// or browser popup blocker silently blocks a download after an anchor click (a.click()).
// exportBackup returns the JSON string whenever no synchronous exception is thrown.
// Thrown exceptions indicate blocked/failed operations; the caller (sync_manager) shows
// a confirmation dialog only when an exception is thrown.
function exportBackup(isAutoBeforeRestore = false){
  try {
    const backupData = {
      version: 2,
      dataFormat: 2,
      exportDate: new Date().toISOString(),
      progress: progress || {},
      stats: stats || {},
      starred: Array.from(starredSet),
      srs: srsStore || {},
      dailyGoal: getDailyGoal()
    };
    const jsonStr = JSON.stringify(backupData, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (isAutoBeforeRestore === 'sync')
      ? `deutsch_lernen_backup_pre_sync_${todayStr()}.json`
      : ((isAutoBeforeRestore === true || isAutoBeforeRestore === 'restore')
        ? `deutsch_lernen_backup_pre_restore_${todayStr()}.json`
        : `deutsch_lernen_backup_${todayStr()}.json`);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if(!isAutoBeforeRestore){
      try {
        if(typeof localStorage !== 'undefined' && localStorage){
          localStorage.setItem(BACKUP_DATE_KEY, new Date().toISOString());
        }
      } catch(_) {}
      showToast('تم تصدير النسخة الاحتياطية بنجاح 📥');
    }
    return jsonStr;
  } catch(e){
    if(!isAutoBeforeRestore){
      alert('حدث خطأ أثناء تصدير النسخة الاحتياطية: ' + e.message);
    }
    throw e;
  }
}

function importBackup(jsonStr){
  let data;
  try {
    data = JSON.parse(jsonStr);
  } catch(e){
    alert('فشل استيراد النسخة الاحتياطية:\nالملف ليس بتنسيق JSON صالح.');
    return;
  }

  const valRes = validateBackupData(data);
  if(!valRes.valid){
    alert('فشل استيراد النسخة الاحتياطية:\n' + valRes.error);
    return;
  }

  if(typeof SyncMergePolicy !== 'undefined' && typeof SyncMergePolicy.migrateLegacyUserData === 'function'){
    data = SyncMergePolicy.migrateLegacyUserData(data, CATEGORIES);
  }

  const allActiveWordIds = new Set();
  CATEGORIES.forEach(c => {
    if(Array.isArray(c.words)) c.words.forEach(w => { if(w && w.id) allActiveWordIds.add(w.id); });
  });

  const catProgressCount = data.progress ? Object.keys(data.progress).length : 0;
  const starredCount = data.starred ? data.starred.length : 0;
  const srsCount = data.srs ? Object.keys(data.srs).length : 0;

  const confirmMsg =
    `تنبيه: استعادة النسخة الاحتياطية ستستبدل تقدّمك الحالي في التطبيق!\n\n` +
    `ملخص البيانات المراد استيرادها:\n` +
    `• أقسام تحتوي على تقدّم: ${catProgressCount}\n` +
    `• كلمات محفوظة في المفضلة: ${starredCount}\n` +
    `• كلمات في نظام التكرار الذكي (SRS): ${srsCount}\n\n` +
    `ملاحظة: سيحاول المتصفح تنزيل نسخة احتياطية وقائية لبياناتك الحالية قبل البدء (إذا كانت التنزيلات التلقائية مسموحة).\n` +
    `هل ترغب في المتابعة والاستبدال الآن؟`;

  if(!confirm(confirmMsg)) return;

  // Auto-backup download before overwrite
  try {
    exportBackup(true);
  } catch(e){
    console.error('فشل إنشاء النسخة الاحتياطية التلقائية قبل الاستبدال:', e);
    const proceedWithoutBackup = confirm(
      'تعذر تنزيل نسخة احتياطية وقائية من بياناتك الحالية تلقائياً (قد تكون التنزيلات التلقائية محظورة في متصفحك).\n\n' +
      'هل ترغب في متابعة الاستبدال وحذف بياناتك الحالية على أي حال دون حفظ نسخة وقائية؟'
    );
    if(!proceedWithoutBackup) return;
  }

  // Overwrite state safely
  if(data.progress !== undefined && typeof data.progress === 'object' && data.progress !== null){
    const cleanProg = {};
    const catMap = new Map(CATEGORIES.map(c => [c.id, c]));
    for(const [catId, catVal] of Object.entries(data.progress)){
      if(!catMap.has(catId) || typeof catVal !== 'object' || catVal === null) continue;
      const cat = catMap.get(catId);
      const maxWords = cat && Array.isArray(cat.words) ? cat.words.length : 0;
      const cleanCat = {};
      for(const [m, mVal] of Object.entries(catVal)){
        if(m === 'coreAcked'){
          cleanCat[m] = mVal;
        } else if(typeof mVal === 'object' && mVal !== null){
          let unlocked = Number.isInteger(mVal.unlocked) ? Math.max(0, mVal.unlocked) : 0;
          unlocked = Math.min(unlocked, maxWords);
          const cleanM = { unlocked, counts: {} };
          if(mVal.coreAcked !== undefined) cleanM.coreAcked = mVal.coreAcked;
          if(typeof mVal.counts === 'object' && mVal.counts !== null){
            for(const [k, cnt] of Object.entries(mVal.counts)){
              if(!Number.isInteger(cnt) || cnt < 0) continue;
              if(allActiveWordIds.has(k)) cleanM.counts[k] = cnt;
            }
          }
          cleanCat[m] = cleanM;
        }
      }
      cleanProg[catId] = cleanCat;
    }
    progress = cleanProg;
    appStorage.set(STORAGE_KEYS.PROGRESS, JSON.stringify(progress));
    if(window.localStorage) window.localStorage.setItem('deutsch_lern_v1', JSON.stringify(progress));
  }
  if(data.stats !== undefined){
    stats = data.stats;
    appStorage.set(STORAGE_KEYS.STATS, JSON.stringify(stats));
    if(window.localStorage) window.localStorage.setItem('deutsch_stats_v1', JSON.stringify(stats));
  }
  if(data.starred !== undefined){
    starredSet = new Set((data.starred || []).filter(item => allActiveWordIds.has(item)));
    saveStarredSoon();
  }
  if(data.srs !== undefined && typeof data.srs === 'object' && data.srs !== null){
    const cleanSrs = {};
    for(const [k, v] of Object.entries(data.srs)){
      if(allActiveWordIds.has(k)) cleanSrs[k] = v;
    }
    srsStore = cleanSrs;
    saveSrsSoon();
  }
  if(typeof appStorage !== 'undefined' && appStorage){
    appStorage.set('deutsch_data_format_v1', '2');
  }
  if(typeof window !== 'undefined' && window.localStorage){
    try { window.localStorage.setItem('deutsch_data_format_v1', '2'); } catch(e){}
  }
  if(data.dailyGoal !== undefined){
    if(typeof data.dailyGoal === 'object' && data.dailyGoal !== null){
      setDailyGoal(Number(data.dailyGoal.target) || 20, true, data.dailyGoal.updatedAt || '');
    } else {
      setDailyGoal(Number(data.dailyGoal), true);
    }
  }

  showToast('تمت استعادة النسخة الاحتياطية بنجاح 🎉');
  render();
}

function triggerImportBackup(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => importBackup(ev.target.result);
    reader.readAsText(file);
  };
  input.click();
}

/* ---------- Enhanced Feedback Builder (Always includes Plural on Right & Wrong) ---------- */
function buildFeedbackHtml(w, cat, ok, correctText, isPluralMode, context){
  const safeCorrect = escapeHtml(correctText);
  let statusText = '';
  if(context === 'quiz'){
    statusText = ok
      ? `إجابة صحيحة! الكلمة: ${safeCorrect}`
      : `إجابة غير صحيحة، الصحيحة هي: ${safeCorrect} — هذه الكلمة هترجع لتدريب القسم العادي.`;
  } else {
    statusText = ok ? `إجابة صحيحة! ${safeCorrect}` : `إجابة غير صحيحة، الصحيحة هي: ${safeCorrect}`;
  }

  let pluralLine = '';
  if(!isPluralMode && w && cat && cat.hasArticles){
    if(w.pl){
      pluralLine = `
        <div class="fb-plural-badge">
          <span class="pl-label">صيغة الجمع:</span>
          <span class="pl-text de" lang="de" dir="ltr">${escapeHtml(w.pl)}</span>
          ${miniSpeak(w.pl)}
        </div>`;
    } else {
      pluralLine = `
        <div class="fb-plural-badge fb-plural-uncountable">
          <span class="pl-label">صيغة الجمع:</span>
          <span class="pl-text" style="color:#42403b;font-size:13px;">(لا جمع له — اسم غير معدود)</span>
        </div>`;
    }
  }

  let starHtml = '';
  if(cat && w){
    const wIdx = cat.words.indexOf(w);
    if(wIdx !== -1){
      const active = isStarred(cat.id, wIdx);
      starHtml = `<button class="star-btn ${active ? 'starred' : ''}" data-action="toggle-star-feedback" data-cat="${escapeAttr(cat.id)}" data-idx="${wIdx}" title="${active ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة'}" aria-pressed="${active ? 'true' : 'false'}" aria-label="${active ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة'}">${starGlyph()}</button>`;
    }
  }

  const isVerb = cat && cat.id === 'verben' && w && w.id && typeof renderVerbPanel === 'function';
  const verbPanelHtml = isVerb ? renderVerbPanel(w.id) : '';

  return `
    <div class="fb-box">
      <div class="fb-status-line ${ok ? 'ok' : 'bad'}">
        <span>${statusText}</span>
        ${starHtml}
      </div>
      ${pluralLine}
      ${verbPanelHtml || (noteLine(w) + sentenceLine(w))}
    </div>
  `;
}

const ALL_PRONOUNS = new Set(['ich', 'du', 'er', 'sie', 'es', 'wir', 'ihr']);

function checkConjAnswer(inputVal, wordId, stage, pronounIndex){
  const cat = typeof CATEGORIES !== 'undefined' ? CATEGORIES.find(c => c.id === 'verben') : null;
  const word = cat && Array.isArray(cat.words) ? cat.words.find(w => w.id === wordId) : null;
  const vf = (typeof VERB_FORMS !== 'undefined' && VERB_FORMS) ? VERB_FORMS[wordId] : null;

  if(!vf || !word){
    return { ok: false, expected: '', altExpected: null, missingPrefix: false, hint: null, isSynonym: false };
  }

  let expected = '';
  let altExpected = null;

  if(stage === 1){
    // Stage 1: Infinitive
    expected = word.n;
  } else if(stage === 2){
    // Stage 2: Praesens for given pronoun
    const pIdx = (Number.isInteger(pronounIndex) && pronounIndex >= 0 && pronounIndex < 6) ? pronounIndex : 0;
    expected = (vf.pres && vf.pres[pIdx]) ? vf.pres[pIdx] : '';
  } else if(stage === 3){
    // Stage 3: Praeteritum for given pronoun
    const pIdx = (Number.isInteger(pronounIndex) && pronounIndex >= 0 && pronounIndex < 6) ? pronounIndex : 0;
    expected = (vf.pret && vf.pret[pIdx]) ? vf.pret[pIdx] : '';
    if(pIdx === 1 && vf.pretDuAlt){
      altExpected = vf.pretDuAlt;
    }
  } else if(stage === 4){
    // Stage 4: Perfekt for er/sie/es
    expected = vf.perfekt || '';
  }

  const cleanInput = normalizeDe(inputVal || '').replace(/\s+/g, ' ').trim();
  const cleanExpected = normalizeDe(expected).replace(/\s+/g, ' ').trim();
  const cleanAlt = altExpected ? normalizeDe(altExpected).replace(/\s+/g, ' ').trim() : null;

  if(!cleanInput){
    return { ok: false, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
  }

  // --- STAGE 1: Infinitive (never accepts a leading pronoun; accepts synonyms) ---
  if(stage === 1){
    if(cleanInput === cleanExpected){
      return { ok: true, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
    }
    const syns = typeof verbSynonyms === 'function' ? verbSynonyms(wordId) : [];
    for(const syn of syns){
      if(cleanInput === normalizeDe(syn.n).replace(/\s+/g, ' ').trim()){
        return { ok: true, expected, altExpected, missingPrefix: false, hint: null, isSynonym: true, matchedSynonym: syn };
      }
    }
    if(vf.sep && expected.startsWith(vf.sep)){
      const stem = expected.slice(vf.sep.length).trim();
      if(cleanInput === normalizeDe(stem).replace(/\s+/g, ' ').trim()){
        return {
          ok: false,
          expected,
          altExpected,
          missingPrefix: true,
          hint: `تنبيه: هذا فعل منفصل (trennbares Verb)، نسيت كتابة السابقة «${vf.sep}» في بداية المصدر (${expected}).`,
          isSynonym: false
        };
      }
    }
    return { ok: false, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
  }

  // --- STAGES 2-4: Optional leading pronoun ---
  let verbInput = cleanInput;
  let pronounValid = true;

  let allowedPronouns = null;
  if(stage === 2 || stage === 3){
    const pIdx = (Number.isInteger(pronounIndex) && pronounIndex >= 0 && pronounIndex < 6) ? pronounIndex : 0;
    if(pIdx === 0) allowedPronouns = new Set(['ich']);
    else if(pIdx === 1) allowedPronouns = new Set(['du']);
    else if(pIdx === 2) allowedPronouns = new Set(['er', 'sie', 'es']);
    else if(pIdx === 3) allowedPronouns = new Set(['wir']);
    else if(pIdx === 4) allowedPronouns = new Set(['ihr']);
    else if(pIdx === 5) allowedPronouns = new Set(['sie']); // lowercase normalized
  } else if(stage === 4){
    allowedPronouns = new Set(['er', 'sie', 'es']);
  }

  const pronounMatch = cleanInput.match(/^([a-zäöüß]+)\s+(.+)$/i);
  if(pronounMatch){
    const leadingWord = pronounMatch[1].toLowerCase();
    if(ALL_PRONOUNS.has(leadingWord)){
      if(allowedPronouns && allowedPronouns.has(leadingWord)){
        verbInput = pronounMatch[2].trim();
      } else {
        pronounValid = false;
      }
    }
  }

  if(!pronounValid){
    return { ok: false, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
  }

  if(verbInput === cleanExpected || (cleanAlt && verbInput === cleanAlt)){
    return { ok: true, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
  }

  // Check for missing separable prefix in stages 2 & 3:
  let missingPrefix = false;
  let hint = null;

  if(vf.sep && (stage === 2 || stage === 3)){
    if(expected.endsWith(' ' + vf.sep)){
      const stem = expected.slice(0, -(vf.sep.length + 1)).trim();
      if(verbInput === normalizeDe(stem).replace(/\s+/g, ' ').trim()){
        missingPrefix = true;
        hint = `تنبيه: هذا فعل منفصل (trennbares Verb)، يجب كتابة السابقة «${vf.sep}» في النهاية (مثال: ${expected}).`;
      }
    }
    if(!missingPrefix && altExpected && altExpected.endsWith(' ' + vf.sep)){
      const stem = altExpected.slice(0, -(vf.sep.length + 1)).trim();
      if(verbInput === normalizeDe(stem).replace(/\s+/g, ' ').trim()){
        missingPrefix = true;
        hint = `تنبيه: هذا فعل منفصل (trennbares Verb)، يجب كتابة السابقة «${vf.sep}» في النهاية (مثال: ${altExpected}).`;
      }
    }
  }

  return { ok: false, expected, altExpected, missingPrefix, hint, isSynonym: false };
}

function getVerbConjPool(){
  const cat = typeof CATEGORIES !== 'undefined' ? CATEGORIES.find(c => c.id === 'verben') : null;
  if(!cat || !Array.isArray(cat.words)) return [];
  if(typeof progress === 'undefined' || !progress || !progress['verben']) return [];
  const catProg = progress['verben'];
  const modes = ['mcq', 'written', 'listen'];
  const pool = [];
  for(let i=0; i<cat.words.length; i++){
    const w = cat.words[i];
    if(!w || !w.id) continue;
    const isUnlocked = modes.some(m => catProg[m] && catProg[m].counts && ((catProg[m].counts[w.id] || 0) > 0));
    if(isUnlocked){
      pool.push(i);
    }
  }
  return pool;
}

function selectConjSession(pool, getCountFn, maxCount = 10){
  if(!Array.isArray(pool) || pool.length < 3) return [];
  const fn = typeof getCountFn === 'function' ? getCountFn : (idx => getWordCount('verben', 'conj', idx));

  const items = pool.map(idx => ({
    idx,
    count: fn(idx),
    rnd: Math.random()
  }));

  items.sort((a, b) => (a.count - b.count) || (a.rnd - b.rnd));

  const countToTake = Math.min(maxCount, items.length);
  return items.slice(0, countToTake).map(item => item.idx);
}

function computeConjMasteredCount(){
  const cat = typeof CATEGORIES !== 'undefined' ? CATEGORIES.find(c => c.id === 'verben') : null;
  if(!cat || !Array.isArray(cat.words)) return 0;
  const th = threshFor('conj');
  let mastered = 0;
  for(let i=0; i<cat.words.length; i++){
    if(getWordCount('verben', 'conj', i) >= th) mastered++;
  }
  return mastered;
}

let conjState = null;

function newConjState(sessionIndices){
  return {
    sessionIndices,
    currentIndex: 0,
    currentStage: 1,
    presPronounIdx: Math.floor(Math.random() * 6),
    pretPronounIdx: Math.floor(Math.random() * 6),
    stageResults: [],
    score: 0,
    answered: false,
    runRecorded: false,
    lastResult: null,
    done: false,
    missed: []
  };
}

        <div class="qsub" style="margin-top:8px;">تدرّب على بعض الأفعال في الاختيار من متعدد أو الكتابة أو الاستماع، ثم عد إلى هنا!</div>
        <div style="margin-top:20px;">

        </div>
      </div>
    `;
    document.getElementById('backBtn').addEventListener('click', () => goBack({ screen: 'modes', catId: 'verben' }));
    document.getElementById('conjGoOtherQuizzes').addEventListener('click', () => go({ screen: 'modes', catId: 'verben' }));
    return;
  }

  if(!conjState || !conjState.sessionIndices || conjState.sessionIndices.length === 0){
    const sessionIndices = selectConjSession(pool, i => getWordCount('verben', 'conj', i), 10);
    conjState = newConjState(sessionIndices);
  }

  if(conjState.done){
    const totalVerbs = conjState.sessionIndices.length;
    const score = conjState.score;
    const pct = totalVerbs > 0 ? Math.round((score / totalVerbs) * 100) : 0;
    const mastered = computeConjMasteredCount();
    const missedList = Array.isArray(conjState.missed) ? conjState.missed : [];
    const STAGE_NAMES = ['المصدر', 'المضارع', 'الماضي البسيط', 'الماضي التام'];
    const missedHtml = missedList.length ? `
        <div style="margin-top:22px;text-align:right;">
          <h3 style="font-size:16px;margin-bottom:10px;">أفعال تحتاج مراجعة (${missedList.length})</h3>
          ${missedList.map(m => {
            const mw = cat.words[m.verbIdx];
            const wrong = m.stages.map((ok, i) => ok ? null : STAGE_NAMES[i]).filter(Boolean);
            return `<details style="margin-bottom:8px;border:1px solid #e5e1d8;border-radius:10px;padding:8px 12px;">
              <summary style="cursor:pointer;font-weight:700;"><span class="de" lang="de" dir="ltr">${escapeHtml(mw.n)}</span> · ${escapeHtml(mw.ar)}</summary>
              <div class="fbnote">أخطأتَ في: ${wrong.join('، ')}</div>
              ${renderVerbPanel(mw.id)}
            </details>`;
          }).join('')}
        </div>` : '';
    app.innerHTML = `
      ${headerHtml(true, 'رجوع لأوضاع القسم')}
      <div class="done-card">
        <div class="done-icon">${score === totalVerbs ? '🌟' : score > 0 ? '🎉' : '💪'}</div>
        <h2>اكتملت الجولة!</h2>
        <div class="done-sub">${score} / ${totalVerbs} أفعال تم تصريفها بشكل مثالي (${pct}%)</div>
        <div class="done-meta" style="margin-top:14px;font-size:14.5px;color:#42403b;line-height:1.5;">
          <b>${mastered}</b> / <b>${cat.words.length}</b> فعلاً أتقنتَ تصريفه حتى الآن
        </div>
        ${missedHtml}
        <div class="done-actions" style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          ${missedList.length ? '<button class="primary-btn" id="conjRetryMissedBtn" style="padding:12px 24px;font-size:15px;font-weight:700;">تدرّب على الأفعال الخاطئة</button>' : ''}
          <button class="primary-btn" id="conjNewRoundBtn" style="padding:12px 24px;font-size:15px;font-weight:700;">جولة جديدة</button>
          <button class="backbtn" id="conjBackModesBtn" style="padding:12px 20px;font-size:15px;">رجوع لأوضاع القسم</button>
        </div>
      </div>

    document.getElementById('conjBackModesBtn').addEventListener('click', () => { conjState = null; goBack({ screen: 'modes', catId: 'verben' }); });

        renderConjExercise();
      });
    }
    document.getElementById('conjNewRoundBtn').addEventListener('click', () => {
      conjState = null;
      renderConjExercise();
    });

  }

  const verbIdx = conjState.sessionIndices[conjState.currentIndex];
  const w = cat.words[verbIdx];
  const stage = conjState.currentStage;
  const totalVerbs = conjState.sessionIndices.length;

  let qLabel = '';
  let qMain = '';
  let qSub = '';

  } else if(stage === 2){

    qLabel = `المرحلة 3 من 4 · صرّف في الماضي البسيط (Präteritum)`;
    qMain = `<div class="qmain de" lang="de" dir="ltr">${escapeHtml(w.n)}</div>`;

    qMain = `<div class="qmain de" lang="de" dir="ltr">${escapeHtml(w.n)}</div>`;
    qSub = `<div class="qsub">المعنى: ${escapeHtml(w.ar)} · مع الضمير: <b class="de" lang="de" dir="ltr" style="font-size:16px;color:var(--brand);">er/sie/es</b> (مع فعل المساعدة · كتابة الضمير اختيارية)</div>`;
  }

  const stepOverall = conjState.currentIndex * 4 + stage;
  const totalOverall = totalVerbs * 4;
  const pctOverall = Math.round((stepOverall / totalOverall) * 100);

  const nextLabel = stage < 4 ? 'المرحلة التالية ←' : (conjState.currentIndex + 1 < totalVerbs ? 'الفعل التالي ←' : 'عرض النتيجة ←');

  app.innerHTML = `
    ${headerHtml(true, 'رجوع لأوضاع القسم')}
    <div class="cat-title">
      <h2>اختبار التصريفات</h2>
      <span class="cat-sub">الفعل ${conjState.currentIndex + 1} من ${totalVerbs} · المرحلة ${stage} من 4</span>
    </div>
    <div class="prog-bar" style="margin-bottom:14px;">
      <div class="prog-fill" style="width:${pctOverall}%;"></div>
    </div>
    <div class="qcard">
      <div class="qlabel">${qLabel}</div>
      ${qMain}
      ${qSub}
    </div>
    <div class="write-row">

    </div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="next-row"><button class="next-btn" id="nextBtn">${nextLabel} <span class="kbd-key">↵</span></button></div>
  `;

  document.getElementById('backBtn').addEventListener('click', () => {

  const submitBtn = document.getElementById('conjSub');
  const fb = document.getElementById('fb');
  const nextBtn = document.getElementById('nextBtn');

  if(input) input.focus();
  renderUmlautBar(input);

  function submit(){
    if(conjState.answered) return;
    const val = input.value.trim();
    if(!val) return;
    conjState.answered = true;

    const pIdx = stage === 2 ? conjState.presPronounIdx : (stage === 3 ? conjState.pretPronounIdx : 2);

    conjState.stageResults.push(res.ok);
    conjState.lastResult = res;

    // FIX 3: Run applyResult immediately upon stage-4 answer submission so run is not lost on back navigation
    if(stage === 4 && !conjState.runRecorded){
      conjState.runRecorded = true;
      const allOk = conjState.stageResults.length === 4 && conjState.stageResults.every(Boolean);
      if(allOk) conjState.score++;
      else conjState.missed.push({ verbIdx, stages: conjState.stageResults.slice() });
      applyResult('verben', 'conj', verbIdx, allOk);
    }

    speak(res.expected);

    const safeExpected = escapeHtml(res.expected);
    let fbHtml = `
      <div class="fb-box">
        <div class="fb-status-line ${res.ok ? 'ok' : 'bad'}">
          <span>${res.ok ? `إجابة صحيحة! <span class="de" lang="de" dir="ltr">${safeExpected}</span>` : `إجابة غير صحيحة، الصحيحة هي: <span class="de" lang="de" dir="ltr">${safeExpected}</span>`}</span>
        </div>
        ${(res.ok && res.isSynonym) ? `<div class="fbnote" style="margin-top:6px;">مقبول أيضاً. الكلمة المطلوبة: ${safeExpected}</div>` : ''}
        ${(!res.ok && res.missingPrefix && res.hint) ? `<div class="fbnote" style="margin-top:6px;">${escapeHtml(res.hint)}</div>` : ''}
        ${renderVerbPanel(w.id)}
      </div>
    `;
    fb.innerHTML = fbHtml;
    if(typeof input.blur === 'function') input.blur();
    input.disabled = true;
    submitBtn.disabled = true;
    app.querySelectorAll('.umlaut-btn').forEach(b => { b.disabled = true; });
    nextBtn.classList.add('show');
  }

  let advancing = false;
  function advance(){
    if(!conjState || !conjState.answered || advancing) return;
    advancing = true;
    if(conjState.currentStage < 4){
      conjState.currentStage++;
      conjState.answered = false;
      conjState.lastResult = null;
      renderConjExercise();
    } else {
      // FIX 3: applyResult already ran on stage 4 submit; advance only navigates
      if(conjState.currentIndex + 1 < conjState.sessionIndices.length){
        conjState.currentIndex++;
        conjState.currentStage = 1;
        conjState.presPronounIdx = Math.floor(Math.random() * 6);
        conjState.pretPronounIdx = Math.floor(Math.random() * 6);
        conjState.stageResults = [];
        conjState.answered = false;
        conjState.runRecorded = false;
        conjState.lastResult = null;
        renderConjExercise();
      } else {
        conjState.done = true;
        renderConjExercise();
      }
    }
  }

  submitBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => {
    if(e.repeat) return;
    if(e.key === 'Enter'){
      e.preventDefault();
      submit();
    }
  });
  nextBtn.addEventListener('click', advance);
  nextBtn.addEventListener('keydown', e => {
    if(e.repeat) e.preventDefault();
  });
}
