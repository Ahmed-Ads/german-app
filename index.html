<script>
  (function(){
    if('serviceWorker' in navigator){
      let hasController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if(hasController){
          if(typeof showUpdateBar === 'function') {
            showUpdateBar();
          } else {
            window.addEventListener('DOMContentLoaded', () => {
              if(typeof showUpdateBar === 'function') showUpdateBar();
            });
          }
        }
        hasController = true;
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const newW = reg.installing;
            if(newW){
              newW.addEventListener('statechange', () => {
                if(newW.state === 'installed' && navigator.serviceWorker.controller){
                  if(typeof showUpdateBar === 'function') showUpdateBar();
                }
              });
            }
          });
        }).catch(err => console.log('SW reg error:', err));
      });
    }
  })();
</script>
<title>تعلّم الألمانية · Deutsch lernen</title>
<style>
  :focus-visible { outline: 3px solid #1E4FA3 !important; outline-offset: 2px !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121110;
      --ink: #F5F3EC;
      --card: #1E1C18;
      --line: rgba(255,255,255,0.14);
    }
    .cat-card, .qcard, .done-card, .opt, .wl-row, .stat-card, .backup-box, .goal-selector-box, .voice-box, .sync-box, .umlaut-btn {
      background: var(--card) !important;
      color: var(--ink) !important;
      border-color: var(--line) !important;
    }
    .umlaut-hint {
      color: #b0aaa0 !important;
    }
    .opt:hover:not(.disabled) {
      background: rgba(255,255,255,0.08) !important;
    }
  }

  :root{
    --paper:#F7F4EC;
    --ink:#171512;
    --blue:#1E4FA3;
    --red:#C8342A;
    --yellow:#EBB111;
    --green:#2C6E49;
    --line: rgba(23,21,18,0.14);
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .de{ font-family:'Space Grotesk', sans-serif; direction:ltr; unicode-bidi: isolate; }
  .wrap{ width:100%; max-width:760px; min-width:0; }

  /* ---------- Header ---------- */
  header.app-head{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    margin-bottom:26px; width:100%; min-width:0;
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark{ width:34px; height:34px; position:relative; flex-shrink:0; }
  .brand-mark span{ position:absolute; border-radius:50%; }
  .brand-mark .c1{ width:20px;height:20px; background:var(--red); top:0; right:0; border-radius:50%; }
  .brand-mark .c2{ width:16px;height:16px; background:var(--yellow); bottom:0; left:2px; border-radius:2px; transform:rotate(20deg); }
  .brand-mark .c3{ width:12px;height:12px; background:var(--blue); bottom:2px; right:8px; border-radius:50%; }
  .brand h1{ font-size:19px; margin:0; font-weight:800; }
  .brand p{ margin:2px 0 0; font-size:12.5px; color:#42403b; }
  .backbtn{
    border:1.5px solid var(--ink); background:transparent; color:var(--ink);
    font-family:'Cairo',sans-serif; font-weight:700; font-size:14px;
    padding:8px 16px; border-radius:999px; cursor:pointer;
    min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box;
  }
  .backbtn:hover{ background:var(--ink); color:var(--paper); }

  /* ---------- Home grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%, 210px),1fr));
    gap:14px; width:100%; min-width:0;
  }
  .cat-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:16px; cursor:pointer; text-align:right; position:relative; overflow:hidden;
    min-width:0; overflow-wrap:anywhere; word-break:break-word;
    transition:transform .12s ease, border-color .12s ease;
  }
  .cat-card:hover{ transform:translateY(-2px); border-color:var(--ink); }
  .cat-shape{ width:26px; height:26px; margin-bottom:14px; border-radius:50%; }
  .cat-card h3{ margin:0 0 2px; font-size:16px; font-weight:700; overflow-wrap:anywhere; word-break:break-word; }
  .cat-card .de{ display:block; font-size:13px; color:#42403b; margin-bottom:12px; overflow-wrap:anywhere; word-break:break-word; }
  .bar-bg{ height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; }
  .cat-meta{ font-size:12px; color:#42403b; margin-top:6px; }

  /* ---------- Mode picker ---------- */
  .cat-title{ text-align:center; margin-bottom:26px; }
  .cat-title h2{ margin:0; font-size:24px; font-weight:800; }
  .cat-title .de, .cat-title .cat-sub{ display:block; font-size:16px; color:#42403b; margin-top:4px; }
  .wordcount-row{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:12px 16px; margin-bottom:16px; font-size:13.5px; width:100%; min-width:0;
  }
  .wordcount-row .backbtn{ padding:6px 14px; font-size:12.5px; }
  .modes{ display:flex; flex-direction:column; gap:12px; width:100%; min-width:0; }

  /* ---------- Word list ---------- */
  .wl-list{ display:flex; flex-direction:column; gap:8px; width:100%; min-width:0; }
  .wl-row{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:10px 14px; width:100%; min-width:0;
  }
  .wl-speak{
    width:36px; height:36px; border-radius:50%; border:1.5px solid var(--ink);
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; color:var(--ink);
  }
  .wl-speak:hover{ background:var(--ink); color:var(--paper); }
  .wl-speak svg{ width:16px; height:16px; fill:currentColor; }
  .wl-text{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .wl-de{ font-size:16px; font-weight:600; overflow-wrap:anywhere; word-break:break-word; }
  .wl-ar{ font-size:13px; color:#42403b; margin-top:1px; overflow-wrap:anywhere; word-break:break-word; }
  .wl-note{ font-size:12px; color:#42403b; margin-top:3px; overflow-wrap:anywhere; word-break:break-word; }
  .wl-num{ font-size:12px; color:#b3b1a8; font-family:'Space Grotesk',sans-serif; flex-shrink:0; }
  .wl-divider{
    text-align:center; font-size:12.5px; color:#42403b; background:rgba(23,21,18,0.05);
    border-radius:8px; padding:8px 12px; margin:6px 0 2px;
  }
  .mode-btn{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:18px 20px; cursor:pointer; text-align:right; width:100%; min-width:0;
  }
  .mode-btn:hover{ border-color:var(--ink); }
  .mode-btn > div:first-child{ min-width:0; overflow-wrap:anywhere; word-break:break-word; }
  .mode-btn .mt{ font-size:17px; font-weight:700; }
  .mode-btn .ms{ font-size:12.5px; color:#42403b; margin-top:2px; }
  .mode-icon{ width:30px; height:30px; flex-shrink:0; border-radius:8px; }

  /* ---------- Exercise ---------- */
  .progress-dots{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
  .dot{ width:34px; height:6px; border-radius:3px; background:var(--line); position:relative; overflow:hidden; }
  .dot i{ position:absolute; inset:0; border-radius:3px; }
  .qcard{
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    padding:34px 26px; text-align:center; margin-bottom:20px;
    min-width:0; overflow-wrap:anywhere; word-break:break-word;
  }
  .qlabel{ font-size:12.5px; color:#42403b; margin-bottom:10px; letter-spacing:.02em;}
  .qmain{ font-size:26px; font-weight:800; margin-bottom:6px; overflow-wrap:anywhere; word-break:break-word; }
  .qsub{ font-size:14px; color:#42403b; overflow-wrap:anywhere; word-break:break-word; }
  .speak-row{ display:flex; justify-content:center; margin-top:16px; }
  .speak-btn{
    width:46px; height:46px; border-radius:50%; border:1.5px solid var(--ink);
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .speak-btn:hover{ background:var(--ink); }
  .speak-btn:hover svg{ fill:var(--paper); }
  .speak-btn svg{ width:20px; height:20px; fill:var(--ink); }

  .mini-speak{
    width:22px; height:22px; border-radius:50%; border:1.3px solid var(--ink);
    background:transparent; display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; vertical-align:middle; margin-inline-start:6px; padding:0;
  }
  .mini-speak svg{ width:10px; height:10px; fill:var(--ink); }
  .mini-speak:hover{ background:var(--ink); }
  .mini-speak:hover svg{ fill:var(--paper); }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; min-width:0; }
  .opt{
    font-family:'Space Grotesk',sans-serif; direction:ltr; text-align:center;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:16px 10px; font-size:16px; font-weight:600; cursor:pointer;
    min-width:0; overflow-wrap:anywhere; word-break:break-word;
  }
  .opt:hover{ border-color:var(--blue); }
  .opt.correct{ background:var(--green); border-color:var(--green); color:#fff; }
  .opt.wrong{ background:var(--red); border-color:var(--red); color:#fff; }
  .opt.disabled{ pointer-events:none; }

  .article-options{ display:flex; gap:10px; justify-content:center; width:100%; min-width:0; }
  .article-options .opt{ flex:1; max-width:140px; min-width:0; }

  .write-row{ display:flex; gap:10px; width:100%; min-width:0; }
  .write-row input{
    flex:1; font-family:'Space Grotesk',sans-serif; direction:ltr; text-align:center;
    font-size:18px; padding:14px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink); min-width:0;
  }
  .write-row input:focus{ outline:none; border-color:var(--blue); }
  .submit-btn{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:15px;
    background:var(--ink); color:var(--paper); border:none; border-radius:10px;
    padding:0 22px; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:.4; cursor:default; }

  /* ---------- Umlaut Buttons Bar ---------- */
  .umlaut-bar{
    margin-top:10px; width:100%; max-width:100%;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    box-sizing:border-box;
  }
  .umlaut-btn-row{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
    width:100%; max-width:100%; box-sizing:border-box;
  }
  .umlaut-btn{
    font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600;
    min-width:40px; min-height:40px; padding:0 8px;
    background:var(--card); color:var(--ink);
    border:1.5px solid var(--line); border-radius:8px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    transition:background .15s, border-color .15s;
    box-sizing:border-box;
  }
  .umlaut-btn:hover:not(:disabled){ border-color:var(--blue); }
  .umlaut-btn:active:not(:disabled){ background:rgba(30,79,163,.1); }
  .umlaut-btn:disabled{ opacity:.4; cursor:default; }
  .umlaut-hint{
    font-size:12.5px; color:#42403b; text-align:center; line-height:1.4;
  }

  .feedback{ margin-top:16px; text-align:center; font-size:14.5px; min-height:20px; font-weight:700; }
  .feedback.ok{ color:var(--green); }
  .feedback.bad{ color:var(--red); }
  .fbnote{ margin-top:8px; font-weight:400; font-size:13px; color:#42403b; }

  .next-row{ display:flex; justify-content:center; margin-top:14px; }
  .next-btn{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:14px;
    background:transparent; border:1.5px solid var(--ink); border-radius:999px;
    padding:9px 22px; cursor:pointer; display:none;
  }
  .next-btn.show{ display:inline-block; }

  .done-card{ text-align:center; padding:50px 20px; }
  .done-card h2{ font-size:22px; margin-bottom:8px; }
  .done-card p{ color:#42403b; font-size:14.5px; }

  .footnote{ text-align:center; font-size:12px; color:#42403b; margin-top:36px; line-height:1.9; }

  /* ---------- Streak & Header Actions ---------- */
  .head-actions{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; min-width:0; }
  .streak-badge{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 14px; font-weight:700; font-size:13.5px; cursor:pointer;
    min-height:44px; min-width:44px; box-sizing:border-box;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    user-select:none;
  }
  .streak-badge:hover{ transform:translateY(-1px); border-color:var(--red); box-shadow:0 2px 8px rgba(200,52,42,0.15); }
  .streak-badge .streak-flame{ font-size:16px; line-height:1; }
  .streak-badge .streak-num{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--red); }
  .streak-badge .streak-lbl{ font-size:12px; color:#42403b; }
  .stats-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 14px; font-family:'Cairo',sans-serif; font-weight:700; font-size:13px;
    cursor:pointer; color:var(--ink);
    min-height:44px; min-width:44px; box-sizing:border-box;
    transition:transform .12s ease, border-color .12s ease;
  }
  .stats-btn:hover{ transform:translateY(-1px); border-color:var(--blue); color:var(--blue); }
  .stats-btn svg{ fill:currentColor; width:15px; height:15px; }

  /* ---------- Search Across All Sections ---------- */
  .search-box-wrap{ margin-bottom:20px; position:relative; width:100%; min-width:0; }
  .search-input-box{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:2px solid var(--ink); border-radius:12px;
    padding:10px 16px; box-shadow:0 3px 0 var(--ink); width:100%; min-width:0;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-input-box:focus-within{ border-color:var(--blue); box-shadow:0 3px 0 var(--blue); }
  .search-icon{ width:20px; height:20px; fill:#8a8983; flex-shrink:0; }
  .search-input-box input{
    flex:1; border:none; background:transparent; font-family:'Cairo',sans-serif;
    font-size:15px; font-weight:600; color:var(--ink); outline:none; direction:rtl; min-width:0;
  }
  .search-input-box input::placeholder{ color:#42403b; font-weight:400; }
  .search-clear-btn{
    background:rgba(23,21,18,0.08); border:none; border-radius:50%; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px;
    color:var(--ink); padding:0; flex-shrink:0; font-weight:bold;
  }
  .search-clear-btn:hover{ background:var(--ink); color:#fff; }
  .search-results-panel{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    margin-top:10px; max-height:450px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }
  .search-res-header{
    padding:10px 16px; font-size:12.5px; color:#42403b; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; background:rgba(23,21,18,0.02);
  }
  .search-res-list{ display:flex; flex-direction:column; }
  .search-res-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer;
    transition:background .12s ease;
  }
  .search-res-item:last-child{ border-bottom:none; }
  .search-res-item:hover{ background:rgba(30,79,163,0.05); }
  .search-res-main{ flex:1; text-align:right; }
  .search-res-word{ display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .search-res-de{ font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; direction:ltr; }
  .search-res-ar{ font-size:14.5px; font-weight:600; color:var(--ink); }
  .search-res-sentence{ font-size:12.5px; color:#42403b; margin-top:2px; }
  .search-res-sentence .de{ color:var(--blue); font-weight:500; }
  .search-res-cat{
    font-size:11.5px; padding:4px 10px; border-radius:999px; background:rgba(23,21,18,0.06);
    color:#4a4944; white-space:nowrap; flex-shrink:0; font-weight:600;
  }
  .search-no-results{ padding:30px 20px; text-align:center; color:#42403b; font-size:14px; }

  /* ---------- Word List Highlight Pulse ---------- */
  @keyframes wlPulse {
    0% { background:rgba(235,177,17,0.45); transform:scale(1.02); box-shadow:0 0 12px rgba(235,177,17,0.5); }
    50% { background:rgba(235,177,17,0.22); }
    100% { background:var(--card); transform:scale(1); box-shadow:none; }
  }
  .wl-highlight-pulse{
    animation: wlPulse 2.5s ease forwards;
    border-color: var(--yellow) !important;
  }
  .wl-sentence{
    margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
    font-size:12.5px; color:#42403b; line-height:1.4;
  }
  .wl-sentence-de{ color:var(--blue); font-weight:600; display:flex; align-items:center; gap:4px; }
  .wl-sentence-ar{ color:#7a7974; margin-top:2px; }

  /* ---------- Contextual Sentence Feedback ---------- */
  .fb-sentence{
    margin-top:12px;
    background:rgba(23,21,18,0.04);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    text-align:center;
    width:100%; min-width:0;
    overflow-wrap:anywhere; word-break:break-word;
  }
  .fb-sentence-de{
    font-family:'Space Grotesk',sans-serif;
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    direction:ltr;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    overflow-wrap:anywhere; word-break:break-word;
  }
  .fb-sentence-ar{
    font-family:'Cairo',sans-serif;
    font-size:13.5px;
    color:#5a5954;
    margin-top:4px;
    direction:rtl;
    overflow-wrap:anywhere; word-break:break-word;
  }

  /* ---------- Statistics Screen ---------- */
  .stats-header{ text-align:center; margin-bottom:24px; }
  .stats-header h2{ margin:0 0 4px; font-size:24px; font-weight:800; }
  .stats-header p{ margin:0; font-size:14px; color:#42403b; }
  .stats-hero-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%, 200px),1fr));
    gap:14px; margin-bottom:24px; width:100%; min-width:0;
  }
  .stat-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:18px; text-align:right; position:relative; overflow:hidden;
    min-width:0; overflow-wrap:anywhere; word-break:break-word;
  }
  .stat-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .stat-card-icon{ font-size:22px; }
  .stat-card-tag{ font-size:12px; padding:2px 8px; border-radius:999px; background:rgba(23,21,18,0.06); color:#42403b; font-weight:600; }
  .stat-val{ font-size:28px; font-weight:800; line-height:1.1; margin-bottom:4px; font-family:'Space Grotesk',sans-serif; }
  .stat-lbl{ font-size:14px; font-weight:700; color:var(--ink); }
  .stat-sub{ font-size:12px; color:#42403b; margin-top:4px; line-height:1.4; }
  .stat-streak-msg{
    background:rgba(235,177,17,0.12); border:1.5px solid var(--yellow);
    border-radius:10px; padding:12px 16px; margin-bottom:20px; text-align:center;
    font-weight:700; font-size:14px; color:var(--ink);
  }
  .stats-section-title{ font-size:17px; font-weight:800; margin:24px 0 14px; }
  .stats-breakdown-list{ display:flex; flex-direction:column; gap:8px; width:100%; min-width:0; }
  .stat-cat-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:10px 14px; cursor:pointer; min-width:0;
    transition:transform .1s ease, border-color .12s ease;
  }
  .stat-cat-row:hover{ border-color:var(--ink); transform:translateY(-1px); }
  .stat-cat-info{ flex:1; text-align:right; min-width:0; }
  .stat-cat-name{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap; overflow-wrap:anywhere; word-break:break-word; min-width:0; }
  .stat-cat-sub{ font-size:12px; color:#42403b; margin-top:2px; }
  .stat-cat-bar-wrap{ width:120px; display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
  .stat-cat-bar{ width:100%; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .stat-cat-bar-fill{ height:100%; border-radius:3px; }
  .stat-cat-pct{ font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:#42403b; }

  /* ---------- Gender Color-Coding & Badges ---------- */
  :root {
    --gender-der: #1E4FA3;
    --gender-die: #C8342A;
    --gender-das: #2C6E49;
    --gender-pl: #B45309;
  }
  .gender-tag{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700;
    padding:2px 7px; border-radius:4px; margin-inline-end:6px;
    line-height:1.2; vertical-align:middle; text-transform:lowercase;
  }
  .gender-tag.der, .article-der{ background:rgba(30,79,163,0.12); color:var(--gender-der); border:1px solid rgba(30,79,163,0.3); }
  .gender-tag.die, .article-die{ background:rgba(200,52,42,0.12); color:var(--gender-die); border:1px solid rgba(200,52,42,0.3); }
  .gender-tag.das, .article-das{ background:rgba(44,110,73,0.12); color:var(--gender-das); border:1px solid rgba(44,110,73,0.3); }
  .gender-tag.pl, .article-pl{ background:rgba(235,177,17,0.18); color:var(--gender-pl); border:1px solid rgba(235,177,17,0.4); }

  /* ---------- Starred Vocabulary ---------- */
  .star-btn{
    background:transparent; border:none; cursor:pointer; padding:4px 6px; line-height:1;
    transition:transform .12s; vertical-align:middle; display:inline-flex; align-items:center;
  }
  .star-btn:hover{ transform:scale(1.2); }
  .star-btn svg{ width:20px; height:20px; overflow:visible; }
  .star-btn .st-outline{ display:block; stroke:#706d67; fill:none; }
  .star-btn .st-solid{ display:none; fill:#b47800; }
  .star-btn.starred .st-outline{ display:none; }
  .star-btn.starred .st-solid{ display:block; }
  .star-btn:hover .st-outline{ stroke:#b47800; }
  @media (prefers-color-scheme: dark){
    .star-btn .st-outline{ stroke:#9e9b94; }
    .star-btn .st-solid{ fill:#EBB111; }
    .star-btn:hover .st-outline{ stroke:#EBB111; }
  }

  .cat-card.card-srs-review, #starredBankCard, #globalReviewCard, #difficultBankCard{
    flex-wrap:wrap; min-width:0;
  }
  .cat-card.card-srs-review > div, #starredBankCard > div, #globalReviewCard > div, #difficultBankCard > div{
    min-width:0; flex:1 1 180px;
  }

  /* ---------- Plural & Answer Feedback Box ---------- */
  .fb-box{
    margin-top:14px; background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; padding:16px; text-align:center; width:100%; min-width:0;
    box-shadow:0 4px 14px rgba(0,0,0,0.04);
  }
  .fb-status-line{
    font-size:16px; font-weight:700; margin-bottom:8px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .fb-status-line.ok{ color:var(--green); }
  .fb-status-line.bad{ color:var(--red); }
  .fb-plural-badge{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(235,177,17,0.12); border:1px solid rgba(235,177,17,0.35);
    border-radius:8px; padding:6px 14px; font-size:14px; margin-bottom:8px;
  }
  .fb-plural-badge .pl-label{ font-weight:700; color:#42403b; font-size:12.5px; }
  .fb-plural-badge .pl-text{ font-weight:700; font-size:15px; color:var(--ink); }
  .fb-plural-uncountable{ background:rgba(0,0,0,0.04); border-color:var(--line); }

  /* ---------- Keyboard Shortcuts Badges ---------- */
  .kbd-key{
    font-family:'Space Grotesk',sans-serif; font-size:10.5px; font-weight:700;
    padding:2px 5px; border-radius:4px; background:rgba(23,21,18,0.08);
    color:#7a7974; border:1px solid rgba(23,21,18,0.14); margin-inline-start:6px;
    vertical-align:middle; display:inline-block; line-height:1;
  }

  /* ---------- Daily Goal Badge in Header ---------- */
  .goal-badge{
    display:flex; align-items:center; justify-content:center; gap:5px;
    background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 12px; font-weight:700; font-size:13px; cursor:pointer;
    min-height:44px; min-width:44px; box-sizing:border-box;
    transition:transform .12s, border-color .12s;
  }
  .goal-badge:hover{ transform:translateY(-1px); border-color:var(--yellow); }
  .goal-badge .goal-num{ font-family:'Space Grotesk',sans-serif; color:#b45309; }

  /* ---------- Interactive 3D Flashcards ---------- */
  .fc-wrap{
    width:100%; max-width:480px; margin:0 auto 20px; perspective:1000px;
    cursor:pointer; user-select:none; min-width:0;
  }
  .fc-card{
    width:100%; min-height:260px; position:relative; transform-style:preserve-3d;
    transition:transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius:14px; border:2px solid var(--ink); box-shadow:0 6px 0 var(--ink);
    background:var(--card); min-width:0;
  }
  .fc-card.flipped{ transform:rotateY(180deg); }
  .fc-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px; text-align:center; border-radius:12px;
  }
  .fc-back{ transform:rotateY(180deg); background:#FAF7F0; }
  .fc-hint{ font-size:12px; color:#42403b; margin-top:14px; }
  .fc-controls{ display:flex; justify-content:center; gap:12px; margin-top:18px; flex-wrap:wrap; }
  .fc-btn{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:14px;
    padding:10px 22px; border-radius:999px; cursor:pointer; border:1.5px solid var(--ink);
    background:var(--card); color:var(--ink); transition:transform .12s, background .12s;
  }
  .fc-btn:hover{ transform:translateY(-1px); }
  .fc-btn.know{ background:var(--green); color:#fff; border-color:var(--green); }
  .fc-btn.repeat{ background:var(--red); color:#fff; border-color:var(--red); }

  /* ---------- Listening Mode UI ---------- */
  .listen-hero-btn{
    width:84px; height:84px; border-radius:50%; background:var(--blue);
    color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px; box-shadow:0 6px 18px rgba(30,79,163,0.35);
    transition:transform .15s ease, background .15s ease;
  }
  .listen-hero-btn:hover{ transform:scale(1.08); background:#163d80; }
  .listen-hero-btn svg{ width:40px; height:40px; fill:currentColor; }

  /* ---------- Backup & Restore UI ---------- */
  .backup-box{
    margin-top:20px; padding:18px; background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; text-align:center;
  }
  .backup-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .backup-btn{
    display:inline-flex; align-items:center; gap:6px; font-family:'Cairo',sans-serif;
    font-weight:700; font-size:13px; padding:8px 16px; border-radius:999px;
    border:1.5px solid var(--ink); background:transparent; cursor:pointer; color:var(--ink);
    transition:background .12s, color .12s;
  }
  .backup-btn:hover{ background:var(--ink); color:var(--paper); }

  /* ---------- Goal Selector in Stats ---------- */
  .goal-selector-box{
    margin-top:16px; padding:16px; background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; text-align:center;
  }
  .goal-btns{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .goal-sel-btn{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    padding:6px 16px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--card); cursor:pointer; transition:all .12s ease;
  }
  .goal-sel-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  /* ---------- Voice Picker in Stats ---------- */
  .voice-box{
    margin-top:16px; padding:16px; background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; text-align:right; direction:rtl; box-sizing:border-box; width:100%;
  }
  .voice-controls{
    display:flex; gap:10px; align-items:center; justify-content:space-between;
    flex-wrap:wrap; margin-top:10px; width:100%; box-sizing:border-box;
  }
  .voice-select{
    flex:1 1 180px; min-width:0; min-height:44px; padding:8px 12px;
    font-family:'Cairo',sans-serif; font-size:13px; border-radius:8px;
    border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
    box-sizing:border-box; outline:none; cursor:pointer;
  }
  .voice-select:focus{ border-color:var(--blue); }
  .voice-test-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:13px;
    min-height:44px; padding:8px 16px; border-radius:8px; border:1.5px solid var(--blue);
    background:var(--blue); color:#FFFFFF; cursor:pointer; flex-shrink:0;
    transition:background .12s, opacity .12s; box-sizing:border-box;
  }
  .voice-test-btn:hover{ opacity:0.92; }
  .voice-test-btn:focus{ outline:2px solid var(--ink); outline-offset:2px; }
  .no-male-voice-notice{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(235,177,17,0.18); border:1.5px solid var(--yellow);
    border-radius:10px; padding:10px 14px; margin-bottom:16px; text-align:right;
    direction:rtl; font-size:12.5px; color:var(--ink); box-sizing:border-box; width:100%;
  }
  .notice-dismiss-btn{
    min-width:44px; min-height:44px; display:inline-flex; align-items:center;
    justify-content:center; background:transparent; border:none; color:var(--ink);
    font-size:18px; cursor:pointer; border-radius:6px; flex-shrink:0;
  }
  .notice-dismiss-btn:hover{ background:rgba(0,0,0,0.06); }
  .notice-dismiss-btn:focus{ outline:2px solid var(--ink); outline-offset:2px; }

  /* ---------- Toast Notification ---------- */
  .app-toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 22px; border-radius:999px;
    font-size:14px; font-weight:700; z-index:9999; box-shadow:0 6px 20px rgba(0,0,0,0.25);
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .app-toast.show{ opacity:1; }

  /* ---------- Action Toast (skip undo) ---------- */
  .app-action-toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:12px;
    font-size:14px; font-weight:600; z-index:9999; box-shadow:0 6px 20px rgba(0,0,0,0.25);
    opacity:0; transition:opacity .25s ease; pointer-events:none;
    display:flex; align-items:center; gap:10px; white-space:nowrap; max-width:calc(100vw - 32px);
  }
  .app-action-toast.show{ opacity:1; pointer-events:auto; }
  .app-action-toast__btn{
    background:var(--yellow); color:var(--ink); border:none; border-radius:6px;
    padding:4px 10px; font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  .app-action-toast__btn:hover{ opacity:0.85; }

  /* ---------- Skip Button (category written exercise) ---------- */
  .skip-word-btn{
    display:block; width:100%; margin-top:8px;
    background:transparent; border:1.5px solid var(--line);
    color:#6b6966; font-size:13px; font-weight:600;
    padding:9px 12px; border-radius:8px; cursor:pointer;
    text-align:center; min-height:40px; transition:background .12s, border-color .12s;
  }
  .skip-word-btn:hover{ background:rgba(23,21,18,0.06); border-color:#9e9b94; }
  @media (prefers-color-scheme: dark){
    .skip-word-btn{ color:#a8a5a0; }
    .skip-word-btn:hover{ background:rgba(255,255,255,0.08); border-color:#6e6b64; }
  }

  @media (max-width: 400px) {
    body { padding: 20px 12px 48px; }
    header.app-head { margin-bottom: 18px; gap: 8px; }
    .brand { gap: 8px; }
    .brand h1 { font-size: 17.5px; }
    .head-actions { gap: 6px; }
    .streak-badge .streak-lbl,
    .stats-btn span { display: none; }
    .streak-badge, .stats-btn, .goal-badge { padding: 6px 10px; }
    .backbtn { padding: 8px 12px; font-size: 13px; }
    .grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .stats-hero-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .stat-cat-bar-wrap { width: 90px; }
    .qcard { padding: 24px 16px; }
    .qmain { font-size: 22px; }
    .options { gap: 8px; }
    .opt { padding: 12px 6px; font-size: 15px; }
    .done-card { padding: 32px 14px; }
  }

  @media (max-width: 340px) {
    body { padding: 16px 8px 40px; }
    .brand-mark { width: 28px; height: 28px; }
    .brand-mark .c1 { width: 16px; height: 16px; }
    .brand-mark .c2 { width: 13px; height: 13px; }
    .brand-mark .c3 { width: 10px; height: 10px; }
    .brand h1 { font-size: 16px; }
    .head-actions { gap: 4px; }
    .streak-badge, .stats-btn, .goal-badge { padding: 6px 8px; font-size: 12px; }
    .backbtn { padding: 6px 10px; font-size: 12px; }
    .stat-cat-bar-wrap { width: 75px; }
    .stat-cat-name { font-size: 13.5px; }
  }

  /* ---------- Cloud Sync Box ---------- */
  .sync-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .sync-status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .sync-status-ok { background: rgba(44, 110, 73, 0.12); color: var(--green); }
  .sync-status-working { background: rgba(30, 79, 163, 0.12); color: var(--blue); }
  .sync-status-offline { background: rgba(235, 177, 17, 0.15); color: #8a6800; }
  .sync-status-error { background: rgba(200, 52, 42, 0.12); color: var(--red); }
  .sync-status-inactive { background: rgba(23, 21, 18, 0.08); color: #555; }
  .sync-desc { font-size: 13px; line-height: 1.5; color: #42403b; margin: 4px 0 12px; }
  .sync-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .sync-btn {
    min-height: 44px;
    min-width: 44px;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .sync-btn:hover { background: rgba(0,0,0,0.06); }
  .sync-btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .sync-btn-primary:hover { background: #173d7f; }
  .sync-btn-danger { color: var(--red); border-color: rgba(200,52,42,0.3); }
  .sync-btn-danger:hover { background: rgba(200,52,42,0.08); }
  .sync-btn-subtle { font-size: 12px; color: #666; }
  .sync-user-row { margin-bottom: 8px; }
  .sync-user-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .sync-meta { font-size: 12px; color: #555; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .sync-error-banner {
    background: rgba(200, 52, 42, 0.08);
    border: 1px solid rgba(200, 52, 42, 0.2);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
    color: var(--red);
    margin: 8px 0;
  }
  .sync-privacy-note {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    line-height: 1.5;
    color: #555;
  }
  @media (prefers-color-scheme: dark) {
    .sync-desc, .sync-meta, .sync-privacy-note { color: #ccc !important; }
    .sync-btn { background: #2a2722 !important; color: var(--ink) !important; border-color: var(--line) !important; }
    .sync-btn:hover { background: #38342e !important; }
    .sync-btn-primary { background: var(--blue) !important; color: #fff !important; }
  }

  /* Persistent Service Worker Update Notice */
  .sw-update-bar {
    position: sticky;
    top: 0;
    z-index: 9999;
    background: var(--yellow);
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    font-weight: 600;
  }
  .sw-update-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .sw-update-btn:hover {
    opacity: 0.9;
  }
  .sw-update-close {
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    color: var(--ink);
  }

  /* ---------- Verb Conjugation Panel UI ---------- */
  .verb-conjugation-panel {
    margin-top: 10px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align: right;
    width: 100%;
    box-sizing: border-box;
    font-family: 'Cairo', sans-serif;
  }
  .verb-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .verb-level-chip {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .verb-panel-title {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .verb-infinitive {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }
  .verb-gloss {
    font-size: 13px;
    color: #42403b;
  }
  .verb-tables-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
    margin-bottom: 10px;
  }
  .verb-table-col {
    flex: 1 1 calc(50% - 4px);
    min-width: 125px;
    box-sizing: border-box;
  }
  .verb-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .verb-table caption {
    font-weight: 700;
    font-size: 11.5px;
    color: #42403b;
    padding: 4px 6px;
    text-align: start;
    caption-side: top;
  }
  .verb-table th, .verb-table td {
    padding: 4px 6px;
    border-bottom: 1px solid var(--line);
    line-height: 1.3;
  }
  .verb-table th[scope="col"] {
    background: rgba(23, 21, 18, 0.04);
    font-weight: 700;
    font-size: 11px;
    color: #555;
    text-align: start;
  }
  .verb-table th[scope="row"] {
    color: #555;
    font-size: 11px;
    white-space: nowrap;
    width: 36%;
    text-align: start;
    font-weight: 600;
  }
  .verb-table td {
    font-weight: 600;
    color: var(--ink);
    text-align: start;
  }
  .verb-du-alt {
    font-size: 10px;
    color: #666;
    font-style: italic;
    font-family: 'Cairo', sans-serif;

// "core" = the most essential/common words a learner should master first;
// the rest are "extra" bonus vocabulary. Categories can set an explicit
// `core` count; otherwise the first 20 words (already ordered by importance)
// are treated as core, or all of them if the category has fewer than 20.
function coreCountFor(cat){ return cat.core || Math.min(20, cat.words.length); }

const ORDERED_CATEGORIES = CATEGORIES.slice().sort((a,b) => (a.order||999) - (b.order||999));

/* ======================= UNIFIED ROBUST STORAGE LAYER ======================= */
const STORAGE_KEYS = {
  PROGRESS: 'german-arabic-progress-v1',
  STATS: 'german-arabic-stats-v1',
  STARRED: 'deutsch_starred_v1',
  SRS: 'deutsch_srs_v1',
  DAILY_GOAL: 'deutsch_daily_goal_v1',
  SCHEMA: 'deutsch_schema_version'
};

let isStorageFallback = false;
const memoryStore = new Map();

/* --- Persistent Storage & Backup Reminder State --- */
let isStoragePersisted = false;
let storagePersistAttempted = false;

function requestPersistentStorageOnce() {
  if (storagePersistAttempted) return;
  const hasProgress = (typeof stats !== 'undefined' && stats && stats.totalAnswered > 0) ||
                      (typeof progress !== 'undefined' && progress && Object.keys(progress).length > 0);
  if (!hasProgress) return;
  storagePersistAttempted = true;

  try {
    if (typeof navigator !== 'undefined' && navigator.storage && typeof navigator.storage.persist === 'function') {
      navigator.storage.persist().then(granted => {
        isStoragePersisted = !!granted;
      }).catch(() => {});
    }
  } catch (_) {}
}

const BACKUP_DATE_KEY = 'deutsch_last_backup_v1';
const BACKUP_REMINDER_DISMISSED_KEY = 'deutsch_backup_reminder_dismissed_v1';

function getLastBackupDate() {
  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      return localStorage.getItem(BACKUP_DATE_KEY);
    }
  } catch (_) {}
  return null;
}

function shouldShowBackupReminder() {
  if (typeof stats === 'undefined' || !stats || !stats.totalAnswered || stats.totalAnswered <= 0) {
    return false;
  }
  let dismissedAt = 0;
  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      const d = localStorage.getItem(BACKUP_REMINDER_DISMISSED_KEY);
      if (d) dismissedAt = parseInt(d, 10) || 0;
    }
  } catch (_) {}

  const now = Date.now();
  if (dismissedAt && (now - dismissedAt) < 7 * 24 * 60 * 60 * 1000) {
    return false;
  }

  const lastBackupStr = getLastBackupDate();
  if (!lastBackupStr) {
    return true; // Never exported
  }

  const lastBackupTime = new Date(lastBackupStr).getTime();
  if (isNaN(lastBackupTime)) {
    return true;
  }

  const fourteenDaysMs = 14 * 24 * 60 * 60 * 1000;
  return (now - lastBackupTime) > fourteenDaysMs;
}

if (typeof window !== 'undefined') {
  window.requestPersistentStorageOnce = requestPersistentStorageOnce;
  window.getLastBackupDate = getLastBackupDate;
  window.shouldShowBackupReminder = shouldShowBackupReminder;
}

function getStorageBackend() {
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      window.localStorage.setItem('__test_storage__', '1');
      window.localStorage.removeItem('__test_storage__');
      return window.localStorage;
    }
  } catch (e) {
    isStorageFallback = true;
  }
  return null;
}

const backend = getStorageBackend();

const appStorage = {
  isFallback: isStorageFallback || !backend,
  get(key) {
    if (this.isFallback) return memoryStore.has(key) ? memoryStore.get(key) : null;
    try {
      return backend.getItem(key);
    } catch (e) {
      this.isFallback = true;
      return memoryStore.has(key) ? memoryStore.get(key) : null;
    }
  },
  set(key, val) {
    const s = String(val);
    if (this.isFallback) {
      memoryStore.set(key, s);
      return;
    }
    try {
      backend.setItem(key, s);
    } catch (e) {
      this.isFallback = true;
      memoryStore.set(key, s);
      showStorageWarningOnce();
    }
  },
  remove(key) {
    if (this.isFallback) {
      memoryStore.delete(key);
      return;
    }
    try {
      backend.removeItem(key);
    } catch (e) {
      memoryStore.delete(key);
    }
  },
  clear() {
    memoryStore.clear();
    if (!this.isFallback && backend) {
      try { backend.clear(); } catch(e) {}
    }
  }
};

let storageWarningShown = false;
function showStorageWarningOnce() {
  if (storageWarningShown) return;
  storageWarningShown = true;
  if(typeof showToast === 'function') {
    showToast('⚠️ وضع التصفح الخاص أو التخزين معطل. سيبقى تقدمك محفوظاً خلال هذه الجلسة فقط.');
  }
}
if (appStorage.isFallback) {
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(showStorageWarningOnce, 1500);
  });
}

// Automatic legacy migration
try {
  if (!appStorage.get(STORAGE_KEYS.PROGRESS) && appStorage.get('deutsch_lern_v1')) {
    appStorage.set(STORAGE_KEYS.PROGRESS, appStorage.get('deutsch_lern_v1'));
  }
  if (!appStorage.get(STORAGE_KEYS.STATS) && appStorage.get('deutsch_stats_v1')) {

// progress[catId][mode] = { unlocked:Number, counts:{ wordIndex:Number } }
const PROGRESS_KEY = 'german-arabic-progress-v1';
let progress = {};
let progressReady = false;
let saveTimer = null;

async function loadProgress(){
  try{
    const res = await window.storage.get(PROGRESS_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)){
        const cleaned = {};
        const knownCatIds = new Set(CATEGORIES.map(c => c.id));
        const catMap = new Map(CATEGORIES.map(c => [c.id, c]));
        const allActiveWordIds = new Set();
        CATEGORIES.forEach(c => {
          if(Array.isArray(c.words)){
            c.words.forEach(w => { if(w && w.id) allActiveWordIds.add(w.id); });
          }
        });
        for(const [catId, val] of Object.entries(parsed)){
          if(knownCatIds.has(catId) && typeof val === 'object' && val !== null && !Array.isArray(val)){
            const cat = catMap.get(catId);
            const maxWords = cat && Array.isArray(cat.words) ? cat.words.length : 0;
            const catProg = {};
            for(const [m, mVal] of Object.entries(val)){
              if(PROGRESS_MODES.includes(m) || m === 'coreAcked'){
                if(m === 'coreAcked'){
                  catProg[m] = mVal;
                } else if(typeof mVal === 'object' && mVal !== null && !Array.isArray(mVal)){
                  let unlocked = Number.isInteger(mVal.unlocked) ? Math.max(0, mVal.unlocked) : 0;
                  unlocked = Math.min(unlocked, maxWords);
                  const modeObj = {
                    unlocked,
                    counts: {}
                  };
                  if(mVal.coreAcked !== undefined) modeObj.coreAcked = mVal.coreAcked;
                  if(typeof mVal.counts === 'object' && mVal.counts !== null && !Array.isArray(mVal.counts)){
                    for(const [wKey, cnt] of Object.entries(mVal.counts)){
                      if(!Number.isInteger(cnt) || cnt < 0) continue;
                      if(/^\d+$/.test(wKey) || allActiveWordIds.has(wKey)){
                        modeObj.counts[wKey] = cnt;
                      }
                    }
                  }
                  catProg[m] = modeObj;
                }
              }
            }
            cleaned[catId] = catProg;
          }
        }
        progress = cleaned;
      } else {
        progress = {};
      }
    } else {
      progress = {};
    }
  }catch(e){
    progress = {};
  }
  progressReady = true;
}

          longest: Number.isInteger(parsed.longest) && parsed.longest >= 0 ? parsed.longest : 0,

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function daysBetween(d1, d2){
  if(!d1 || !d2) return 0;
  const [y1, m1, day1] = d1.split('-').map(Number);
  const [y2, m2, day2] = d2.split('-').map(Number);
  const utc1 = Date.UTC(y1, m1 - 1, day1);
  const utc2 = Date.UTC(y2, m2 - 1, day2);
  return Math.round((utc2 - utc1) / 86400000);
}

// The streak the learner should actually SEE right now — if it's been more
// than a day since their last recorded activity, the streak is broken even
// though we don't overwrite the stored number until they act again.
function displayStreak(){
  if(!stats.lastDate) return 0;
  const diff = daysBetween(stats.lastDate, todayStr());
  return diff <= 1 ? stats.current : 0;
}

// Call this on every answered question, anywhere in the app (normal
// practice modes, global review, difficult bank, quiz, section review).
function recordActivity(ok){
  stats.totalAnswered = (stats.totalAnswered || 0) + 1;
  requestPersistentStorageOnce();
  if(ok) stats.totalCorrect = (stats.totalCorrect || 0) + 1;
  const today = todayStr();
  if(stats.lastDate !== today){
    if(stats.lastDate){
      const diff = daysBetween(stats.lastDate, today);
      stats.current = (diff === 1) ? (stats.current || 0) + 1 : 1;
    } else {
      stats.current = 1;
    }
    stats.lastDate = today;
    stats.todayCount = 0;
    if(stats.current > (stats.longest || 0)) stats.longest = stats.current;
  }
  saveStatsSoon();
  if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
}

// A word counts as fully "mastered" only once every mode it can be tested
// in (mcq/written, plus article for noun categories) has reached threshold.
function computeMasteredCount(){
  let count = 0;
  CATEGORIES.forEach(cat=>{
    const catProg = progress[cat.id];
    if(!catProg) return;
    const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
    for(let i=0;i<cat.words.length;i++){
      const w = cat.words[i];
      const allMastered = modes.every(m => catProg[m] && ((w && w.id && catProg[m].counts && catProg[m].counts[w.id]) || 0) >= threshFor(m));
      if(allMastered) count++;
    }
  });
  return count;
}

function ensureProgress(catId, mode){
  if(!PROGRESS_MODES.includes(mode)){
    throw new Error(`Unknown progress mode: ${mode}`);
  }
  progress[catId] = progress[catId] || {};
  if(!progress[catId][mode]){
    const cat = CATEGORIES.find(c => c.id === catId);
    const maxWords = cat && Array.isArray(cat.words) ? cat.words.length : UNLOCK_STEP;
    progress[catId][mode] = { unlocked: Math.min(UNLOCK_STEP, maxWords), counts:{}, coreAcked:false };
  }
  return progress[catId][mode];
}
function threshFor(mode){ return THRESH[mode] || 8; }

// true once the learner has mastered every "core" word for this mode
function coreDone(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const core = coreCountFor(cat);
  const th = threshFor(mode);
  for(let i=0;i<core;i++){
    if(mode === 'plural' && !cat.words[i].pl) continue; // no plural to test for this word
    if(getWordCount(catId,mode,i) < th) return false;
  }
  return true;
}

function resolveWordId(catId, target){
  if(!target && target !== 0) return null;
  const actualCatId = catId || (typeof target === 'string' && target.includes('.') ? target.split('.')[0] : null);
  const cat = CATEGORIES.find(c => c.id === actualCatId);
  if(!cat || !Array.isArray(cat.words)) return null;

  if(typeof target === 'object' && target !== null && target.id){
    return cat.words.some(w => w.id === target.id) ? target.id : null;
  }
  if(typeof target === 'number' && Number.isInteger(target)){
    if(target >= 0 && target < cat.words.length){
      return cat.words[target].id;
    }
    return null;
  }
  if(typeof target === 'string'){
    if(/^\d+$/.test(target)){
      const idx = parseInt(target, 10);
      if(idx >= 0 && idx < cat.words.length){
        return cat.words[idx].id;
      }
      return null;
    }
    if(cat.words.some(w => w.id === target)){
      return target;
    }
    return null;
  }
  return null;
}

function getWordCount(catId, mode, target){
  const p = ensureProgress(catId, mode);
  const wid = resolveWordId(catId, target);
  if(wid && p.counts && p.counts[wid] !== undefined) return p.counts[wid];
  return 0;
}
function setWordCount(catId, mode, target, val){
  const wid = resolveWordId(catId, target);
  if(!wid) return;
  const p = ensureProgress(catId, mode);
  const countVal = Math.max(0, val);
  p.counts[wid] = countVal;
  saveProgressSoon();
  if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
}

// Used by the section quiz: force a word back into active practice
// across all of its normal modes when the learner gets it wrong.
function reinforceWord(catId, idx){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(!cat || !cat.words) return;
  const wid = resolveWordId(catId, idx);
  if(!wid) return;
  const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
  modes.forEach(m=>{
    const p = ensureProgress(catId, m);
    p.unlocked = Math.max(p.unlocked, idx+1);
    const th = threshFor(m);
    const cur = (p.counts && p.counts[wid] !== undefined) ? p.counts[wid] : 0;
    const nextVal = Math.max(0, Math.min(cur, th - 3));
    p.counts[wid] = nextVal;
  });
  saveProgressSoon();
}

// Used by review mode: degrade only the 'plural' mode progress for one word
// (word+article progress is handled separately by reinforceWord).
function reinforcePlural(catId, idx){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(!cat || !cat.words) return;
  const wid = resolveWordId(catId, idx);
  if(!wid) return;
  const p = ensureProgress(catId, 'plural');
  p.unlocked = Math.max(p.unlocked, idx+1);
  const th = threshFor('plural');
  const cur = (p.counts && p.counts[wid] !== undefined) ? p.counts[wid] : 0;
  const nextVal = Math.max(0, Math.min(cur, th - 3));
  p.counts[wid] = nextVal;
  saveProgressSoon();
}

function categoryWords(catId){
  return CATEGORIES.find(c=>c.id===catId).words;
}

// Pool of {catId, idx} for every word the learner has already been
// introduced to (unlocked) in any category they've started practicing.
// Used by the global "review all" screen.
function learnedPool(){
  // A word only counts as "learned" if the learner has actually answered it
  // correctly at least once in some mode (counts[idx] > 0) — NOT just because
  // it fell inside the default "unlocked" window, which gets seeded (and can
  // get bumped) as a side effect of simply rendering progress bars on the
  // home/modes screens, even for modes the learner never actually opened.
  const pool = [];
  CATEGORIES.forEach(cat=>{
    const catProg = progress[cat.id];
    if(!catProg) return; // never opened this category at all
    const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
    for(let i=0;i<cat.words.length;i++){
      const w = cat.words[i];
      const sources = modes.filter(m => catProg[m] && (((w && w.id && catProg[m].counts && catProg[m].counts[w.id]) || 0) > 0));
      if(sources.length) pool.push({ catId: cat.id, idx: i, sources });
    }
  });
  return pool;
}

// Pool of {catId, idx, count, th} for words the learner has attempted in a
// given mode but hasn't mastered yet (count < threshold) — including words
// that got knocked all the way down to 0 by repeated wrong answers, which
// are exactly the words worth surfacing. Sorted hardest (lowest count/th
// ratio) first. Used by the "بنك الكلمات الصعبة" difficult-words bank.
function difficultPool(mode){
  const th = threshFor(mode);
  const pool = [];
  CATEGORIES.forEach(cat=>{
    if(mode === 'article' && !cat.hasArticles) return;
    const catProg = progress[cat.id];
    if(!catProg || !catProg[mode]) return;
    const counts = catProg[mode].counts || {};
    const wordMap = new Map();
    cat.words.forEach((w, i) => { wordMap.set(w.id, i); });
    Object.keys(counts).forEach(k=>{
      const idx = wordMap.get(k);
      if(idx === undefined) return; // tolerate and silently drop deleted/unknown ids
      const c = counts[k] || 0;
      if(c < th) pool.push({ catId: cat.id, idx, count: c, th });
    });
  });
  pool.sort((a,b) => (a.count/a.th) - (b.count/b.th));
  return pool;
}

function unlockedIndices(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const p = ensureProgress(catId, mode);
  const n = Math.min(p.unlocked, cat.words.length);
  return Array.from({length:n}, (_,i)=>i);
}

function activeIndices(catId, mode){
  // words currently unlocked but not yet mastered
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  let idxs = unlockedIndices(catId, mode);
  if(mode === 'plural') idxs = idxs.filter(i => cat.words[i].pl); // skip words with no plural (pl: null)
  return idxs.filter(i => getWordCount(catId,mode,i) < th);
}
function masteredUnlockedIndices(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  let idxs = unlockedIndices(catId, mode);
  if(mode === 'plural') idxs = idxs.filter(i => cat.words[i].pl);
  return idxs.filter(i => getWordCount(catId,mode,i) >= th);
}

function maybeUnlockMore(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const p = ensureProgress(catId, mode);
  while(activeIndices(catId, mode).length === 0 && p.unlocked < cat.words.length){
    p.unlocked = Math.min(p.unlocked + UNLOCK_STEP, cat.words.length);
  }
}

function categoryProgressPct(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  const words = mode === 'plural' ? cat.words.filter(w=>w.pl) : cat.words;
  if(words.length === 0) return 0;
  let sum = 0;
  cat.words.forEach((w,i)=>{ if(mode!=='plural' || w.pl) sum += Math.min(getWordCount(catId,mode,i), th); });
  return Math.round((sum / (words.length*th)) * 100);
}


function normalizeAr(s){
  if(!s) return '';
  return s.trim().toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[\s\-_]+/g, ' ');
}

function streakUnit(n){
  if(n === 1) return 'يوم';
  if(n === 2) return 'يومان';
  if(n >= 3 && n <= 10) return 'أيام';
  return 'يوم';
}

function sentenceLine(w){

        <button class="mini-speak" data-speak="${escapeAttr(w.s)}" title="استمع للجملة">
          ${MINI_SPEAK_SVG}
        </button>

    </div>`;
}

/* ======================= HTML ESCAPING & EVALUATION HELPERS ======================= */
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escapeAttr(s){
  return escapeHtml(s);
}

function verbSynonyms(wordId){
  const cat = typeof CATEGORIES !== 'undefined' ? CATEGORIES.find(c => c.id === 'verben') : null;
  if(!cat || !Array.isArray(cat.words)) return [];
  const target = cat.words.find(w => w.id === wordId || w.n === wordId || (wordId && typeof wordId === 'object' && wordId.id === w.id));
  if(!target || !target.ar) return [];
  const targetParts = target.ar.split('/').map(s => s.trim()).filter(Boolean);
  if(targetParts.length === 0) return [];
  const targetSet = new Set(targetParts);

  return cat.words.filter(w => {
    if(w.id === target.id) return false;
    if(!w.ar) return false;
    const parts = w.ar.split('/').map(s => s.trim()).filter(Boolean);
    return parts.some(p => targetSet.has(p));
  });
}

function evaluateWrittenAnswer(inputVal, targetWord, category){
  const val = (inputVal || '').trim();
  if(!val) return { ok: false, empty: true };

  const given = normalizeDe(val).replace(/\s+/g, ' ');
  const wantArticle = category && category.hasArticles && Boolean(targetWord.a);
  const correctWithArt = wantArticle ? `${targetWord.a} ${targetWord.n}` : targetWord.n;
  const normCorrectWithArt = normalizeDe(correctWithArt);
  const normWordOnly = normalizeDe(targetWord.n);

  let ok = false;
  let casingNotice = false;
  let isSynonym = false;
  let matchedSynonym = null;

  const articleRegex = /^(der|die|das)\s+/i;
  const matchArt = val.match(articleRegex);

  if(category && category.id === 'verben'){
    if(given === normWordOnly){
      ok = true;
    } else {
      const syns = typeof verbSynonyms === 'function' ? verbSynonyms(targetWord.id) : [];
      for(const syn of syns){
        if(given === normalizeDe(syn.n)){
          ok = true;
          isSynonym = true;
          matchedSynonym = syn;
          break;
        }
      }
    }
  } else {
    // Non-verb categories: existing logic completely unchanged
    const matchingWords = (category && category.words) ? category.words.filter(w => w.ar.trim() === targetWord.ar.trim()) : [targetWord];

    for(const mw of matchingWords){
      const mwWantArticle = category && category.hasArticles && Boolean(mw.a);
      if(mwWantArticle){
        // الأداة إلزامية: الإجابة لازم تكون "der Apfel" (مع تجاهل حالة الحروف)
        if(matchArt && matchArt[1].toLowerCase() === mw.a.toLowerCase() &&
          given === normalizeDe(`${mw.a} ${mw.n}`)){
          ok = true;
          break;
        }
      } else if(given === normalizeDe(mw.n)){
        ok = true;
        break;
      }
    }
  }

  // الكلمة صحيحة لكن بدون أداة التعريف: تُحسب خطأ مع تنبيه
  let missingArticle = false;
  if(!ok && !matchArt && category && category.hasArticles){
    const matchingWords = category.words ? category.words.filter(w => w.ar.trim() === targetWord.ar.trim()) : [targetWord];
    missingArticle = matchingWords.some(mw => mw.a && given === normalizeDe(mw.n));
  }

  // Educational hint for lowercase German nouns
  if(ok && targetWord.n && /^[A-ZÄÖÜ]/.test(targetWord.n)){
    const nounPart = matchArt ? val.slice(matchArt[0].length).trim() : val.trim();
    if(nounPart.length > 0 && /^[a-zäöü]/.test(nounPart)){
      casingNotice = true;
    }
  }

  const out = { ok, casingNotice, missingArticle };
  if(isSynonym){
    out.isSynonym = true;
    out.matchedSynonym = matchedSynonym;
  }
  return out;
}

/* ======================= SPEECH & VOICE SELECTION ======================= */
// Verified German Male Voice Names with official documentation sources (see docs/tts_voices.md):
// 1. stefan: Microsoft Windows Desktop / Server SAPI 5 (de-DE, Stefan, Apollo)
// 2. conrad: Microsoft Azure / Windows Edge Neural Voice (de-DE-ConradNeural)
// 3. markus: Apple macOS / iOS native German male voice (AVSpeechSynthesisVoice)
// 4. martin: Apple macOS / iOS native German male voice (AVSpeechSynthesisVoice)
// 5. yannick: Apple macOS / iOS native German male voice (AVSpeechSynthesisVoice)
// 6. killian: Microsoft Azure / Edge Neural Voice (de-DE-KillianNeural)
// 7. klaus: Microsoft Azure Neural Voice (de-DE-KlausNeural)
// 8. ralf: Microsoft Azure Neural Voice (de-DE-RalfNeural)
// 9. christoph: Microsoft Azure Neural Voice (de-DE-ChristophNeural / de-AT-ChristophNeural)
// Unverified / non-German dropped: daniel (en-GB), lukas (sk-SK), florian, hans, bernd.
const KNOWN_MALE_GERMAN_VOICES = [
  'stefan',
  'conrad',
  'markus',
  'martin',
  'yannick',
  'killian',
  'klaus',
  'ralf',
  'christoph',
  ' male',
  '(male)',
  '_male',
  'männlich'
];

const KNOWN_FEMALE_GERMAN_VOICES = [
  'katja',     // Microsoft Katja (Windows Desktop)
  'hedda',     // Microsoft Hedda (Windows Desktop)
  'anna',      // Apple macOS / iOS German (Anna)
  'petra',     // Apple macOS / iOS German (Petra)
  'marlene',   // Apple macOS / iOS German (Marlene)
  'vicki',     // Apple macOS / iOS German (Vicki)
  'amala',     // Microsoft Amala Online (Natural)
  'ingrid',    // Microsoft Ingrid Online (Natural)
  'maja',      // Microsoft Maja Online (Natural)
  'louisa',    // Microsoft Louisa Online (Natural)
  'elke',      // Microsoft Elke Online (Natural)
  'gudrun',    // Microsoft Gudrun Online (Natural) (Austria)
  'karolin',   // Microsoft Karolin Online (Natural) (Switzerland)
  'seraphina', // Microsoft Seraphina Online (Natural)
  'gisela',    // Microsoft Gisela Online (Natural)
  'helga',     // Apple / SAPI
  'zira',      // Microsoft Desktop
  ' female',   // Generic female indicators
  '(female)',
  '_female',
  'weiblich'
];

function isGermanVoice(v){
  if(!v || !v.lang) return false;
  const l = String(v.lang).toLowerCase().replace('_', '-');
  return l === 'de' || l.startsWith('de-');
}

function isFemaleVoice(v){
  if(!v || !v.name) return false;
  const n = String(v.name).toLowerCase();
  return KNOWN_FEMALE_GERMAN_VOICES.some(f => n.includes(f));
}

function isMaleVoice(v){
  if(!v || !v.name) return false;
  if(isFemaleVoice(v)) return false; // female exclusion takes priority
  const n = String(v.name).toLowerCase();
  return KNOWN_MALE_GERMAN_VOICES.some(m => n.includes(m));
}

function selectVoice(allVoices, savedChoice = null, isOnline = true){
  const candidates = (allVoices || []).filter(isGermanVoice);
  if(candidates.length === 0){
    return { voice: null, reason: 'default', isMale: false, isLocal: false, needsNetwork: false, candidates: [] };
  }

  const maleLocal = candidates.find(v => isMaleVoice(v) && v.localService === true);
  const maleOnline = candidates.find(v => isMaleVoice(v) && !v.localService);
  const anyLocal = candidates.find(v => v.localService === true);
  const anyOnline = candidates.find(v => !v.localService);

  // 1. User's saved choice: must exist AND its lang must start with "de"
  if(savedChoice){
    const saved = candidates.find(v => isGermanVoice(v) && ((v.voiceURI && v.voiceURI === savedChoice) || v.name === savedChoice));
    if(saved){
      // When offline and saved voice is not local, prefer a local German voice if available
      if(!isOnline && !saved.localService){
        if(maleLocal){
          return { voice: maleLocal, reason: 'male_local_offline', isMale: true, isLocal: true, needsNetwork: false, candidates };
        }
        if(anyLocal){
          return { voice: anyLocal, reason: 'any_local_offline', isMale: isMaleVoice(anyLocal), isLocal: true, needsNetwork: false, candidates };
        }
        // No local German voice exists: use saved voice but warn about network
        return { voice: saved, reason: 'saved_needs_net', isMale: isMaleVoice(saved), isLocal: false, needsNetwork: true, candidates };
      }
      const isLocal = Boolean(saved.localService);
      return { voice: saved, reason: 'saved', isMale: isMaleVoice(saved), isLocal, needsNetwork: !isOnline && !isLocal, candidates };
    }
  }

  // 2. Offline-first ranking when offline:
  // male local > any local > male online > any online > default
  if(!isOnline){
    if(maleLocal) return { voice: maleLocal, reason: 'male_local', isMale: true, isLocal: true, needsNetwork: false, candidates };
    if(anyLocal) return { voice: anyLocal, reason: 'any_local', isMale: isMaleVoice(anyLocal), isLocal: true, needsNetwork: false, candidates };
    if(maleOnline) return { voice: maleOnline, reason: 'male_online', isMale: true, isLocal: false, needsNetwork: true, candidates };
    if(anyOnline) return { voice: anyOnline, reason: 'any_online', isMale: isMaleVoice(anyOnline), isLocal: false, needsNetwork: true, candidates };
    return { voice: candidates[0], reason: 'fallback', isMale: isMaleVoice(candidates[0]), isLocal: Boolean(candidates[0].localService), needsNetwork: !candidates[0].localService, candidates };
  }

  // 3. Online ranking:
  // male local > male online > any local > any online > default
  if(maleLocal) return { voice: maleLocal, reason: 'male_local', isMale: true, isLocal: true, needsNetwork: false, candidates };
  if(maleOnline) return { voice: maleOnline, reason: 'male_online', isMale: true, isLocal: false, needsNetwork: false, candidates };
  if(anyLocal) return { voice: anyLocal, reason: 'any_local', isMale: isMaleVoice(anyLocal), isLocal: true, needsNetwork: false, candidates };
  if(anyOnline) return { voice: anyOnline, reason: 'any_online', isMale: isMaleVoice(anyOnline), isLocal: false, needsNetwork: false, candidates };

  return { voice: candidates[0], reason: 'fallback', isMale: isMaleVoice(candidates[0]), isLocal: Boolean(candidates[0].localService), needsNetwork: false, candidates };
}

function createVoiceManager(synth = (typeof window !== 'undefined' ? window.speechSynthesis : null), storage = (typeof appStorage !== 'undefined' ? appStorage : null)){
  let selectedVoice = null;
  let selectionReason = 'default';
  let isMale = false;
  let isLocal = false;
  let needsNet = false;
  let candidates = [];
  let isLoaded = false;
  let retryTimer = null;
  let warnedNoMale = false;
  let warnedOffline = false;

  function getSavedChoice(){
    try {
      if(storage && typeof storage.get === 'function') return storage.get('deutsch_voice_v1');
      if(typeof window !== 'undefined' && window.localStorage) return window.localStorage.getItem('deutsch_voice_v1');
    } catch(e){}
    return null;
  }

  function setSavedChoice(val){
    try {
      if(storage && typeof storage.set === 'function') storage.set('deutsch_voice_v1', val);
      else if(typeof window !== 'undefined' && window.localStorage) window.localStorage.setItem('deutsch_voice_v1', val);
    } catch(e){}
  }

  function removeSavedChoice(){
    try {
      if(storage && typeof storage.remove === 'function') storage.remove('deutsch_voice_v1');
      if(typeof window !== 'undefined' && window.localStorage) window.localStorage.removeItem('deutsch_voice_v1');
    } catch(e){}
  }

  function update(){
    if(!synth || typeof synth.getVoices !== 'function') return false;
    const all = synth.getVoices() || [];
    candidates = all.filter(isGermanVoice);
    const saved = getSavedChoice();
    const isOnline = (typeof navigator !== 'undefined') ? (navigator.onLine !== false) : true;
    const res = selectVoice(all, saved, isOnline);
    selectedVoice = res.voice;
    selectionReason = res.reason;
    isMale = res.isMale;
    isLocal = res.isLocal;
    needsNet = res.needsNetwork;
    if(all.length > 0) isLoaded = true;
    return isLoaded;
  }

  function init(timeoutMs = 3000){
    if(!synth) return Promise.resolve(null);
    update();
    if(isLoaded && candidates.length > 0){
      return Promise.resolve(selectedVoice);
    }

    return new Promise(resolve => {
      let done = false;
      const start = Date.now();

      function onVoices(){
        if(done) return;
        update();
        if(candidates.length > 0 || (Date.now() - start >= timeoutMs)){
          done = true;
          cleanup();
          resolve(selectedVoice);
        }
      }

      function cleanup(){
        if(retryTimer){ clearInterval(retryTimer); retryTimer = null; }
        if(synth && synth.removeEventListener){ synth.removeEventListener('voiceschanged', onVoices); }
      }

      if(synth.addEventListener){
        synth.addEventListener('voiceschanged', onVoices);
      } else {
        synth.onvoiceschanged = onVoices;
      }

      retryTimer = setInterval(()=>{
        const vList = (synth && synth.getVoices) ? synth.getVoices() : [];
        if(vList.length > 0 || (Date.now() - start >= timeoutMs)){
          onVoices();
        }
      }, 100);
    });
  }

  return {
    init,
    update,
    getVoice: () => selectedVoice,
    getReason: () => selectionReason,
    isMale: () => isMale,
    isLocal: () => isLocal,
    needsNetwork: () => needsNet,
    hasMaleCandidate: () => candidates.some(isMaleVoice),
    getCandidates: () => candidates,
    getSavedChoice,
    setSavedChoice: (val) => { setSavedChoice(val); update(); },
    resetSavedVoice: () => { removeSavedChoice(); update(); },
    hasWarnedNoMale: () => {
      try {
        if(warnedNoMale) return true;
        if(storage && typeof storage.get === 'function') return storage.get('deutsch_no_male_warned_v1') === '1';
        if(typeof window !== 'undefined' && window.localStorage) return window.localStorage.getItem('deutsch_no_male_warned_v1') === '1';
      } catch(e){}
      return warnedNoMale;
    },
    markWarnedNoMale: () => {
      warnedNoMale = true;
      try {
        if(storage && typeof storage.set === 'function') storage.set('deutsch_no_male_warned_v1', '1');
        else if(typeof window !== 'undefined' && window.localStorage) window.localStorage.setItem('deutsch_no_male_warned_v1', '1');
      } catch(e){}
    },
    hasWarnedOffline: () => {
      try {
        if(warnedOffline) return true;
        if(storage && typeof storage.get === 'function') return storage.get('deutsch_offline_voice_warned_v1') === '1';
        if(typeof window !== 'undefined' && window.localStorage) return window.localStorage.getItem('deutsch_offline_voice_warned_v1') === '1';
      } catch(e){}
      return warnedOffline;
    },
    markWarnedOffline: () => {
      warnedOffline = true;
      try {
        if(storage && typeof storage.set === 'function') storage.set('deutsch_offline_voice_warned_v1', '1');
        else if(typeof window !== 'undefined' && window.localStorage) window.localStorage.setItem('deutsch_offline_voice_warned_v1', '1');
      } catch(e){}
    }
  };
}

let deVoice = null;
function speak(text){
  try{
    if(!text || !('speechSynthesis' in window)) return;
    text = String(text);
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';

    if(window.voiceManager){
      const v = window.voiceManager.getVoice();
      if(v) u.voice = v;
      if(!window.voiceManager.hasMaleCandidate() && !window.voiceManager.hasWarnedNoMale()){
        showNoMaleVoiceWarningOnce();
      }
      if(window.voiceManager.needsNetwork() && !window.voiceManager.hasWarnedOffline()){
        showOfflineVoiceWarningOnce();
      }
    } else if(deVoice){
      u.voice = deVoice;
    }

    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  }catch(e){ /* audio not critical */ }
}

// Minimal action toast: shows a message with a labelled action button for ~6 s.
// actionLabel: Arabic button text; onAction: callback when button is clicked.
// Returns a cancel function to dismiss early.
function showToastWithAction(msg, actionLabel, onAction){
  if(typeof document === 'undefined') return ()=>{};
  let el = document.getElementById('appActionToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'appActionToast';
    el.className = 'app-action-toast';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  clearTimeout(el._timer);
  el.innerHTML = '';
  const msgSpan = document.createElement('span');
  msgSpan.textContent = msg;
  el.appendChild(msgSpan);
  const btn = document.createElement('button');
  btn.className = 'app-action-toast__btn';
  btn.textContent = actionLabel;
  btn.type = 'button';
  el.appendChild(btn);
  el.classList.add('show');
  function dismiss(){
    clearTimeout(el._timer);
    el.classList.remove('show');
    btn.onclick = null;
    if(typeof el.remove === 'function') el.remove();
    else if(el.parentNode) el.parentNode.removeChild(el);
  }
  el._dismiss = dismiss;
  btn.onclick = ()=>{ dismiss(); onAction(); };
  // Allow keyboard access
  btn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); btn.onclick(); } });
  el._timer = setTimeout(dismiss, 6000);
  return dismiss;
}
