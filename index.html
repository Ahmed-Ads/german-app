/* ---------- Starred Words ---------- */
let starredSet = new Set();
async function loadStarred(){
  starredSet = new Set();
  try {
    const raw = (window.localStorage && window.localStorage.getItem('deutsch_starred_v1')) || '[]';
    const parsed = JSON.parse(raw);
    if(Array.isArray(parsed)){
      const knownCatIds = new Set(CATEGORIES.map(c => c.id));
      const catWordCounts = new Map(CATEGORIES.map(c => [c.id, c.words.length]));
      const allActiveWordIds = new Set();
      CATEGORIES.forEach(c => {
        if(Array.isArray(c.words)) c.words.forEach(w => { if(w && w.id) allActiveWordIds.add(w.id); });
      });
      parsed.forEach(item => {
        if(typeof item === 'string'){
          if(item.includes('.')){
            if(allActiveWordIds.has(item)){
              starredSet.add(item);
            }
          } else {
            const parts = item.split('_');
            if(parts.length === 2 && knownCatIds.has(parts[0])){
              const idx = parseInt(parts[1], 10);
              if(Number.isInteger(idx) && idx >= 0 && idx < catWordCounts.get(parts[0])){
                const cat = CATEGORIES.find(c => c.id === parts[0]);
                if(cat && cat.words[idx] && cat.words[idx].id && allActiveWordIds.has(cat.words[idx].id)){
                  starredSet.add(cat.words[idx].id);
                }
              }
            }
          }
        }
      });
    }
  } catch(e){
    starredSet = new Set();
  }
}
function saveStarredSoon(){
  try {
    if(window.localStorage){
      window.localStorage.setItem('deutsch_starred_v1', JSON.stringify(Array.from(starredSet)));
    }
  } catch(e){}
}
function isStarred(catId, target){
  const wid = resolveWordId(catId, target);
  if(wid && starredSet.has(wid)) return true;
  return false;
}
function toggleStar(catId, target){
  const wid = resolveWordId(catId, target);
  if(!wid) return false;

  if(starredSet.has(wid)){
    starredSet.delete(wid);
    saveStarredSoon();
    if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
    showToast('تمت إزالة الكلمة من المميزة ⭐');
    return false;
  } else {
    starredSet.add(wid);
    saveStarredSoon();
    if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
    showToast('تمت إضافة الكلمة إلى المفضلة ⭐');
    return true;
  }
}
function toggleStarFeedback(catId, idx, btn){
  const active = toggleStar(catId, idx);
  if(btn){
    if(active){ btn.classList.add('starred'); }
    else { btn.classList.remove('starred'); }
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    btn.setAttribute('title', active ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة');
    btn.setAttribute('aria-label', active ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة');
  }
}
function starredPool(){
  const pool = [];
  CATEGORIES.forEach(c => {
    c.words.forEach((w, idx) => {
      if(w.id && starredSet.has(w.id)){
        pool.push({ catId: c.id, cat: c, idx, word: w });
      }
    });
  });
  return pool;
}

/* ---------- Leitner Spaced Repetition System (SRS) ---------- */
const SRS_INTERVALS = [1, 3, 7, 14, 30]; // days per box (0, 1, 2, 3, 4)
let srsStore = {};
async function loadSrs(){
  srsStore = {};
  try {
    const raw = (window.localStorage && window.localStorage.getItem('deutsch_srs_v1')) || '{}';
    const parsed = JSON.parse(raw);
    if(typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)){
      const knownCatIds = new Set(CATEGORIES.map(c => c.id));
      const catWordCounts = new Map(CATEGORIES.map(c => [c.id, c.words.length]));
      const allActiveWordIds = new Set();
      CATEGORIES.forEach(c => {
        if(Array.isArray(c.words)) c.words.forEach(w => { if(w && w.id) allActiveWordIds.add(w.id); });
      });
      for(const [k, rec] of Object.entries(parsed)){
        if(typeof rec === 'object' && rec !== null && !Array.isArray(rec)){
          const entry = {
            box: Number.isInteger(rec.box) && rec.box >= 0 && rec.box <= 4 ? rec.box : 0,
            lastDate: typeof rec.lastDate === 'string' ? rec.lastDate : todayStr(),
            nextDate: typeof rec.nextDate === 'string' ? rec.nextDate : todayStr()
          };
          if(k.includes('.')){
            if(allActiveWordIds.has(k)){
              srsStore[k] = entry;
            }
          } else {
            const parts = k.split('_');
            if(parts.length === 2 && knownCatIds.has(parts[0])){
              const idx = parseInt(parts[1], 10);
              if(Number.isInteger(idx) && idx >= 0 && idx < catWordCounts.get(parts[0])){
                const cat = CATEGORIES.find(c => c.id === parts[0]);
                if(cat && cat.words[idx] && cat.words[idx].id && allActiveWordIds.has(cat.words[idx].id)){
                  srsStore[cat.words[idx].id] = entry;
                }
              }
            }
          }
        }
      }
    }
  } catch(e){
    srsStore = {};
  }
}
function saveSrsSoon(){
  try {
    if(window.localStorage){
      window.localStorage.setItem('deutsch_srs_v1', JSON.stringify(srsStore));
    }
  } catch(e){}
}
function addDaysToStr(dateStr, numDays){
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + numDays);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function updateSrs(catId, target, ok){
  const wid = resolveWordId(catId, target);
  if(!wid) return;
  const now = todayStr();
  const rec = srsStore[wid] || { box: 0, lastDate: now, nextDate: now };
  if(ok){
    rec.box = Math.min((rec.box || 0) + 1, SRS_INTERVALS.length - 1);
  } else {
    rec.box = 0;
  }
  const interval = SRS_INTERVALS[rec.box];
  rec.lastDate = now;
  rec.nextDate = addDaysToStr(now, interval);
  srsStore[wid] = rec;
  saveSrsSoon();
  if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
}
function srsDuePool(){
  const now = todayStr();
  const pool = [];
  CATEGORIES.forEach(c => {
    c.words.forEach((w, idx) => {
      const rec = w.id && srsStore[w.id];
      if(rec && rec.nextDate && rec.nextDate <= now){
        pool.push({ catId: c.id, cat: c, idx, word: w, box: rec.box + 1 });
      }
    });
  });
  return pool;
}
function getSrsDueWords(){ return srsDuePool(); }

function getDailyGoalUpdatedAt(){

}
function setDailyGoalUpdatedAt(ts){

    if(appStorage) appStorage.set('deutsch_daily_goal_updated_at_v1', ts || '');

function getDailyGoal(){

      if(Number.isInteger(parsed) && parsed >= 5 && parsed <= 200){

function setDailyGoal(g, preserveTimestamp = false, customTimestamp = null){

    showToast(`تم تعيين الهدف اليومي إلى ${clamped} كلمة 🎯`);

/* ---------- Backup & Restore Validation ---------- */
function validateBackupData(data, categoriesList = (typeof CATEGORIES !== 'undefined' ? CATEGORIES : [])){
  if(!data || typeof data !== 'object' || Array.isArray(data)){
    return { valid: false, error: 'الملف غير صالح: لا يحتوي على كائن بيانات صالح (JSON Object).' };
  }

  const knownCatIds = new Set(categoriesList.map(c => c.id));
  const catWordCounts = new Map(categoriesList.map(c => [c.id, c.words ? c.words.length : 0]));
  const validModes = new Set(typeof PROGRESS_MODES !== 'undefined' ? PROGRESS_MODES : ['mcq', 'written', 'article', 'plural', 'listen', 'conj']);
  const legacyMap = (typeof SyncMergePolicy !== 'undefined' && SyncMergePolicy && SyncMergePolicy.LEGACY_INDEX_IDS) || null;
  const maxLegacyWords = (catId) => Math.max(catWordCounts.get(catId) || 0, (legacyMap && legacyMap[catId] ? legacyMap[catId].length : 0));

  const hasProgress = data.progress !== undefined;
  const hasStats = data.stats !== undefined;
  const hasStarred = data.starred !== undefined;
  const hasSrs = data.srs !== undefined;
  const hasGoal = data.dailyGoal !== undefined;

  if(!hasProgress && !hasStats && !hasStarred && !hasSrs && !hasGoal){
    return { valid: false, error: 'الملف غير صالح أو فارغ: لا يحتوي على أي حقول تقدم صالحة (progress, stats, starred, srs, dailyGoal).' };
  }

  // 1. Progress validation
  if(hasProgress){
    if(typeof data.progress !== 'object' || data.progress === null || Array.isArray(data.progress)){
      return { valid: false, error: 'حقل التقدم (progress) غير صالح أو فارغ.' };
    }
    for(const [catId, catVal] of Object.entries(data.progress)){
      if(!knownCatIds.has(catId)){
        return { valid: false, error: `القسم «${catId}» في بيانات التقدم غير معروف في التطبيق.` };
      }
      if(typeof catVal !== 'object' || catVal === null || Array.isArray(catVal)){
        return { valid: false, error: `بيانات القسم «${catId}» غير صالحة.` };
      }
      const maxWords = catWordCounts.get(catId) || 0;
      for(const [mKey, mVal] of Object.entries(catVal)){
        if(mKey === 'coreAcked'){
          if(typeof mVal !== 'boolean') return { valid: false, error: `حقل coreAcked في القسم «${catId}» غير صالح.` };
          continue;
        }
        if(!validModes.has(mKey)){
          return { valid: false, error: `الوضع «${mKey}» في القسم «${catId}» غير معروف.` };
        }
        if(typeof mVal !== 'object' || mVal === null || Array.isArray(mVal)){
          return { valid: false, error: `بيانات الوضع «${mKey}» في القسم «${catId}» غير صالحة.` };
        }
        if(mVal.unlocked !== undefined && (!Number.isInteger(mVal.unlocked) || mVal.unlocked < 0 || mVal.unlocked > maxWords + 50)){
          return { valid: false, error: `عدد الكلمات المفتوحة في «${catId}/${mKey}» غير صالح.` };
        }
        if(mVal.counts !== undefined){
          if(typeof mVal.counts !== 'object' || mVal.counts === null || Array.isArray(mVal.counts)){
            return { valid: false, error: `عدادات الكلمات في «${catId}/${mKey}» غير صالحة.` };
          }
          for(const [keyStr, cnt] of Object.entries(mVal.counts)){
            if(/^\d+$/.test(keyStr)){
              const wIdx = parseInt(keyStr, 10);
              if(!Number.isInteger(wIdx) || wIdx < 0 || wIdx >= maxLegacyWords(catId)){
                return { valid: false, error: `فهرس الكلمة (${keyStr}) في القسم «${catId}» خارج نطاق القسم.` };
              }
            } else if(keyStr.startsWith(catId + '.') && keyStr.slice(catId.length + 1).length > 0 && /^[a-z0-9_.-]+$/.test(keyStr.slice(catId.length + 1))){
              // Valid word ID
            } else {
              return { valid: false, error: `معرف الكلمة (${keyStr}) في «${catId}» ليس معرفاً مستقراً صالحاً.` };
            }
            if(!Number.isInteger(cnt) || cnt < 0 || cnt > 10000){
              return { valid: false, error: `قيمة العداد للكلمة (${keyStr}) في «${catId}/${mKey}» غير صالحة.` };
            }
          }
        }
      }
    }
  }

  // 2. Stats validation
  if(hasStats){
    if(typeof data.stats !== 'object' || data.stats === null || Array.isArray(data.stats)){
      return { valid: false, error: 'حقل الإحصائيات (stats) غير صالح أو فارغ.' };
    }
    const numFields = ['current', 'longest', 'totalAnswered', 'totalCorrect'];
    for(const f of numFields){
      if(data.stats[f] !== undefined && (!Number.isInteger(data.stats[f]) || data.stats[f] < 0)){
        return { valid: false, error: `حقل الإحصائيات «${f}» يجب أن يكون عدداً صحيحاً غير سالب.` };
      }
    }
    if(data.stats.todayCount !== undefined && (!Number.isInteger(data.stats.todayCount) || data.stats.todayCount < 0)){
      return { valid: false, error: 'قيمة إنجاز اليوم في الإحصائيات غير صالحة.' };
    }
    if(data.stats.totalCorrect !== undefined && data.stats.totalAnswered !== undefined && data.stats.totalCorrect > data.stats.totalAnswered){
      return { valid: false, error: 'عدد الإجابات الصحيحة لا يمكن أن يتجاوز إجمالي الإجابات.' };
    }
    if(data.stats.lastDate !== undefined && data.stats.lastDate !== null && typeof data.stats.lastDate !== 'string'){
      return { valid: false, error: 'تاريخ آخر تدريب في الإحصائيات غير صالح.' };
    }
  }

  // 3. Starred validation
  if(hasStarred){
    if(!Array.isArray(data.starred)){
      return { valid: false, error: 'حقل المفضلة (starred) يجب أن يكون مصفوفة.' };
    }
    for(const item of data.starred){
      if(typeof item !== 'string'){
        return { valid: false, error: 'عنصر في المفضلة بصيغة غير صالحة.' };
      }
      if(/^[a-z0-9-]+_\d+$/.test(item)){
        const lastIdx = item.lastIndexOf('_');
        const catId = item.slice(0, lastIdx);
        const idxStr = item.slice(lastIdx + 1);
        if(!knownCatIds.has(catId)){
          return { valid: false, error: `القسم «${catId}» في المفضلة غير معروف في التطبيق.` };
        }
        const idx = parseInt(idxStr, 10);
        if(!Number.isInteger(idx) || idx < 0 || idx >= maxLegacyWords(catId)){
          return { valid: false, error: `فهرس الكلمة «${item}» في المفضلة خارج نطاق القسم.` };
        }
      } else if(item.includes('.')){
        const dotIdx = item.indexOf('.');
        const catId = item.slice(0, dotIdx);
        const slug = item.slice(dotIdx + 1);
        if(!knownCatIds.has(catId)){
          return { valid: false, error: `القسم «${catId}» في المفضلة غير معروف في التطبيق.` };
        }
        if(!slug || !/^[a-z0-9_.-]+$/.test(slug)){
          return { valid: false, error: `معرّف الكلمة المميزة «${item}» ليس معرفاً مستقراً صالحاً.` };
        }
      } else {
        return { valid: false, error: `معرّف الكلمة المميزة «${item}» ليس معرفاً مستقراً صالحاً.` };
      }
    }
  }

  // 4. Srs validation
  if(hasSrs){
    if(typeof data.srs !== 'object' || data.srs === null || Array.isArray(data.srs)){
      return { valid: false, error: 'حقل التكرار المتباعد (srs) غير صالح.' };
    }
    for(const [k, rec] of Object.entries(data.srs)){
      if(/^[a-z0-9-]+_\d+$/.test(k)){
        const lastIdx = k.lastIndexOf('_');
        const catId = k.slice(0, lastIdx);
        const idxStr = k.slice(lastIdx + 1);
        if(!knownCatIds.has(catId)) return { valid: false, error: `قسم SRS «${catId}» غير معروف.` };
        const idx = parseInt(idxStr, 10);
        if(!Number.isInteger(idx) || idx < 0 || idx >= maxLegacyWords(catId)){
          return { valid: false, error: `فهرس الكلمة «${k}» في SRS خارج نطاق القسم.` };
        }
      } else if(k.includes('.')){
        const dotIdx = k.indexOf('.');
        const catId = k.slice(0, dotIdx);
        const slug = k.slice(dotIdx + 1);
        if(!knownCatIds.has(catId)) return { valid: false, error: `قسم SRS «${catId}» غير معروف.` };
        if(!slug || !/^[a-z0-9_.-]+$/.test(slug)){
          return { valid: false, error: `مفتاح SRS «${k}» ليس معرفاً مستقراً صالحاً.` };
        }
      } else {
        return { valid: false, error: `مفتاح SRS «${k}» ليس معرفاً مستقراً صالحاً.` };
      }
      if(typeof rec !== 'object' || rec === null || Array.isArray(rec)){
        return { valid: false, error: `سجل SRS للكلمة «${k}» غير صالح.` };
      }
      if(rec.box !== undefined && (!Number.isInteger(rec.box) || rec.box < 0 || rec.box > 4)){
        return { valid: false, error: `رقم صندوق SRS للكلمة «${k}» يجب أن يكون بين 0 و 4.` };
      }
      if(rec.lastDate !== undefined && typeof rec.lastDate !== 'string'){
        return { valid: false, error: `تاريخ المراجعة السابق للكلمة «${k}» غير صالح.` };
      }
      if(rec.nextDate !== undefined && typeof rec.nextDate !== 'string'){
        return { valid: false, error: `تاريخ المراجعة القادم للكلمة «${k}» غير صالح.` };
      }
    }
  }

  // 5. DailyGoal validation
  if(hasGoal){
    const g = typeof data.dailyGoal === 'object' && data.dailyGoal !== null ? data.dailyGoal.target : data.dailyGoal;
    const numG = Number(g);
    if(isNaN(numG) || !Number.isInteger(numG) || numG < 5 || numG > 200){
      return { valid: false, error: 'الهدف اليومي (dailyGoal) يجب أن يكون عدداً صحيحاً بين 5 و 200 كلمة.' };
    }
  }

  return { valid: true };
}

/* ---------- Backup & Restore ---------- */
// NOTE: Voice preference (deutsch_voice_v1) is intentionally NOT exported or imported
// in backups because speech synthesis voices are hardware/OS/browser-specific.
// NOTE ON BROWSER DOWNLOADS: Standard browser security APIs cannot detect whether a user
// or browser popup blocker silently blocks a download after an anchor click (a.click()).
// exportBackup returns the JSON string whenever no synchronous exception is thrown.
// Thrown exceptions indicate blocked/failed operations; the caller (sync_manager) shows
// a confirmation dialog only when an exception is thrown.
function exportBackup(isAutoBeforeRestore = false){
  try {
    const backupData = {
      version: 2,
      dataFormat: 2,
      exportDate: new Date().toISOString(),
      progress: progress || {},
      stats: stats || {},
      starred: Array.from(starredSet),
      srs: srsStore || {},
      dailyGoal: getDailyGoal()
    };
    const jsonStr = JSON.stringify(backupData, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (isAutoBeforeRestore === 'sync')
      ? `deutsch_lernen_backup_pre_sync_${todayStr()}.json`
      : ((isAutoBeforeRestore === true || isAutoBeforeRestore === 'restore')
        ? `deutsch_lernen_backup_pre_restore_${todayStr()}.json`
        : `deutsch_lernen_backup_${todayStr()}.json`);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if(!isAutoBeforeRestore){
      try {
        if(typeof localStorage !== 'undefined' && localStorage){
          localStorage.setItem(BACKUP_DATE_KEY, new Date().toISOString());
        }
      } catch(_) {}
      showToast('تم تصدير النسخة الاحتياطية بنجاح 📥');
    }
    return jsonStr;
  } catch(e){
    if(!isAutoBeforeRestore){
      alert('حدث خطأ أثناء تصدير النسخة الاحتياطية: ' + e.message);
    }
    throw e;
  }
}

function importBackup(jsonStr){
  let data;
  try {
    data = JSON.parse(jsonStr);
  } catch(e){
    alert('فشل استيراد النسخة الاحتياطية:\nالملف ليس بتنسيق JSON صالح.');
    return;
  }

  const valRes = validateBackupData(data);
  if(!valRes.valid){
    alert('فشل استيراد النسخة الاحتياطية:\n' + valRes.error);
    return;
  }

  if(typeof SyncMergePolicy !== 'undefined' && typeof SyncMergePolicy.migrateLegacyUserData === 'function'){
    data = SyncMergePolicy.migrateLegacyUserData(data, CATEGORIES);
  }

  const allActiveWordIds = new Set();
  CATEGORIES.forEach(c => {
    if(Array.isArray(c.words)) c.words.forEach(w => { if(w && w.id) allActiveWordIds.add(w.id); });
  });

  const catProgressCount = data.progress ? Object.keys(data.progress).length : 0;
  const starredCount = data.starred ? data.starred.length : 0;
  const srsCount = data.srs ? Object.keys(data.srs).length : 0;

  const confirmMsg =
    `تنبيه: استعادة النسخة الاحتياطية ستستبدل تقدّمك الحالي في التطبيق!\n\n` +
    `ملخص البيانات المراد استيرادها:\n` +
    `• أقسام تحتوي على تقدّم: ${catProgressCount}\n` +
    `• كلمات محفوظة في المفضلة: ${starredCount}\n` +
    `• كلمات في نظام التكرار الذكي (SRS): ${srsCount}\n\n` +
    `ملاحظة: سيحاول المتصفح تنزيل نسخة احتياطية وقائية لبياناتك الحالية قبل البدء (إذا كانت التنزيلات التلقائية مسموحة).\n` +
    `هل ترغب في المتابعة والاستبدال الآن؟`;

  if(!confirm(confirmMsg)) return;

  // Auto-backup download before overwrite
  try {
    exportBackup(true);
  } catch(e){
    console.error('فشل إنشاء النسخة الاحتياطية التلقائية قبل الاستبدال:', e);
    const proceedWithoutBackup = confirm(
      'تعذر تنزيل نسخة احتياطية وقائية من بياناتك الحالية تلقائياً (قد تكون التنزيلات التلقائية محظورة في متصفحك).\n\n' +
      'هل ترغب في متابعة الاستبدال وحذف بياناتك الحالية على أي حال دون حفظ نسخة وقائية؟'
    );
    if(!proceedWithoutBackup) return;
  }

  // Overwrite state safely
  if(data.progress !== undefined && typeof data.progress === 'object' && data.progress !== null){
    const cleanProg = {};
    const catMap = new Map(CATEGORIES.map(c => [c.id, c]));
    for(const [catId, catVal] of Object.entries(data.progress)){
      if(!catMap.has(catId) || typeof catVal !== 'object' || catVal === null) continue;
      const cat = catMap.get(catId);
      const maxWords = cat && Array.isArray(cat.words) ? cat.words.length : 0;
      const cleanCat = {};
      for(const [m, mVal] of Object.entries(catVal)){
        if(m === 'coreAcked'){
          cleanCat[m] = mVal;
        } else if(typeof mVal === 'object' && mVal !== null){
          let unlocked = Number.isInteger(mVal.unlocked) ? Math.max(0, mVal.unlocked) : 0;
          unlocked = Math.min(unlocked, maxWords);
          const cleanM = { unlocked, counts: {} };
          if(mVal.coreAcked !== undefined) cleanM.coreAcked = mVal.coreAcked;
          if(typeof mVal.counts === 'object' && mVal.counts !== null){
            for(const [k, cnt] of Object.entries(mVal.counts)){
              if(!Number.isInteger(cnt) || cnt < 0) continue;
              if(allActiveWordIds.has(k)) cleanM.counts[k] = cnt;
            }
          }
          cleanCat[m] = cleanM;
        }
      }
      cleanProg[catId] = cleanCat;
    }
    progress = cleanProg;
    appStorage.set(STORAGE_KEYS.PROGRESS, JSON.stringify(progress));
    if(window.localStorage) window.localStorage.setItem('deutsch_lern_v1', JSON.stringify(progress));
  }
  if(data.stats !== undefined){
    stats = data.stats;
    appStorage.set(STORAGE_KEYS.STATS, JSON.stringify(stats));
    if(window.localStorage) window.localStorage.setItem('deutsch_stats_v1', JSON.stringify(stats));
  }
  if(data.starred !== undefined){
    starredSet = new Set((data.starred || []).filter(item => allActiveWordIds.has(item)));
    saveStarredSoon();
  }
  if(data.srs !== undefined && typeof data.srs === 'object' && data.srs !== null){
    const cleanSrs = {};
    for(const [k, v] of Object.entries(data.srs)){
      if(allActiveWordIds.has(k)) cleanSrs[k] = v;
    }
    srsStore = cleanSrs;
    saveSrsSoon();
  }
  if(typeof appStorage !== 'undefined' && appStorage){
    appStorage.set('deutsch_data_format_v1', '2');
  }
  if(typeof window !== 'undefined' && window.localStorage){
    try { window.localStorage.setItem('deutsch_data_format_v1', '2'); } catch(e){}
  }
  if(data.dailyGoal !== undefined){
    if(typeof data.dailyGoal === 'object' && data.dailyGoal !== null){
      setDailyGoal(Number(data.dailyGoal.target) || 20, true, data.dailyGoal.updatedAt || '');
    } else {
      setDailyGoal(Number(data.dailyGoal), true);
    }
  }

  showToast('تمت استعادة النسخة الاحتياطية بنجاح 🎉');
  render();
}

function triggerImportBackup(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => importBackup(ev.target.result);
    reader.readAsText(file);
  };
  input.click();
}

/* ---------- Enhanced Feedback Builder (Always includes Plural on Right & Wrong) ---------- */
function buildFeedbackHtml(w, cat, ok, correctText, isPluralMode, context){
  const safeCorrect = escapeHtml(correctText);
  let statusText = '';
  if(context === 'quiz'){

const ALL_PRONOUNS = new Set(['ich', 'du', 'er', 'sie', 'es', 'wir', 'ihr']);

function checkConjAnswer(inputVal, wordId, stage, pronounIndex){
  const cat = typeof CATEGORIES !== 'undefined' ? CATEGORIES.find(c => c.id === 'verben') : null;
  const word = cat && Array.isArray(cat.words) ? cat.words.find(w => w.id === wordId) : null;
  const vf = (typeof VERB_FORMS !== 'undefined' && VERB_FORMS) ? VERB_FORMS[wordId] : null;

  if(!vf || !word){
    return { ok: false, expected: '', altExpected: null, missingPrefix: false, hint: null, isSynonym: false };
  }

  let expected = '';
  let altExpected = null;

  if(stage === 1){
    // Stage 1: Infinitive
    expected = word.n;
  } else if(stage === 2){
    // Stage 2: Praesens for given pronoun
    const pIdx = (Number.isInteger(pronounIndex) && pronounIndex >= 0 && pronounIndex < 6) ? pronounIndex : 0;
    expected = (vf.pres && vf.pres[pIdx]) ? vf.pres[pIdx] : '';
  } else if(stage === 3){
    // Stage 3: Praeteritum for given pronoun
    const pIdx = (Number.isInteger(pronounIndex) && pronounIndex >= 0 && pronounIndex < 6) ? pronounIndex : 0;
    expected = (vf.pret && vf.pret[pIdx]) ? vf.pret[pIdx] : '';
    if(pIdx === 1 && vf.pretDuAlt){
      altExpected = vf.pretDuAlt;
    }
  } else if(stage === 4){
    // Stage 4: Perfekt for er/sie/es
    expected = vf.perfekt || '';
  }

  const cleanInput = normalizeDe(inputVal || '').replace(/\s+/g, ' ').trim();
  const cleanExpected = normalizeDe(expected).replace(/\s+/g, ' ').trim();
  const cleanAlt = altExpected ? normalizeDe(altExpected).replace(/\s+/g, ' ').trim() : null;

  if(!cleanInput){
    return { ok: false, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
  }

  // --- STAGE 1: Infinitive (never accepts a leading pronoun; accepts synonyms) ---
  if(stage === 1){
    if(cleanInput === cleanExpected){
      return { ok: true, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
    }
    const syns = typeof verbSynonyms === 'function' ? verbSynonyms(wordId) : [];
    for(const syn of syns){
      if(cleanInput === normalizeDe(syn.n).replace(/\s+/g, ' ').trim()){
        return { ok: true, expected, altExpected, missingPrefix: false, hint: null, isSynonym: true, matchedSynonym: syn };
      }
    }
    if(vf.sep && expected.startsWith(vf.sep)){
      const stem = expected.slice(vf.sep.length).trim();
      if(cleanInput === normalizeDe(stem).replace(/\s+/g, ' ').trim()){
        return {
          ok: false,
          expected,
          altExpected,
          missingPrefix: true,
          hint: `تنبيه: هذا فعل منفصل (trennbares Verb)، نسيت كتابة السابقة «${vf.sep}» في بداية المصدر (${expected}).`,
          isSynonym: false
        };
      }
    }
    return { ok: false, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
  }

  // --- STAGES 2-4: Optional leading pronoun ---
  let verbInput = cleanInput;
  let pronounValid = true;

  let allowedPronouns = null;
  if(stage === 2 || stage === 3){
    const pIdx = (Number.isInteger(pronounIndex) && pronounIndex >= 0 && pronounIndex < 6) ? pronounIndex : 0;
    if(pIdx === 0) allowedPronouns = new Set(['ich']);
    else if(pIdx === 1) allowedPronouns = new Set(['du']);
    else if(pIdx === 2) allowedPronouns = new Set(['er', 'sie', 'es']);
    else if(pIdx === 3) allowedPronouns = new Set(['wir']);
    else if(pIdx === 4) allowedPronouns = new Set(['ihr']);
    else if(pIdx === 5) allowedPronouns = new Set(['sie']); // lowercase normalized
  } else if(stage === 4){
    allowedPronouns = new Set(['er', 'sie', 'es']);
  }

  const pronounMatch = cleanInput.match(/^([a-zäöüß]+)\s+(.+)$/i);
  if(pronounMatch){
    const leadingWord = pronounMatch[1].toLowerCase();
    if(ALL_PRONOUNS.has(leadingWord)){
      if(allowedPronouns && allowedPronouns.has(leadingWord)){
        verbInput = pronounMatch[2].trim();
      } else {
        pronounValid = false;
      }
    }
  }

  if(!pronounValid){
    return { ok: false, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
  }

  if(verbInput === cleanExpected || (cleanAlt && verbInput === cleanAlt)){
    return { ok: true, expected, altExpected, missingPrefix: false, hint: null, isSynonym: false };
  }

  // Check for missing separable prefix in stages 2 & 3:
  let missingPrefix = false;
  let hint = null;

  if(vf.sep && (stage === 2 || stage === 3)){
    if(expected.endsWith(' ' + vf.sep)){
      const stem = expected.slice(0, -(vf.sep.length + 1)).trim();
      if(verbInput === normalizeDe(stem).replace(/\s+/g, ' ').trim()){
        missingPrefix = true;
        hint = `تنبيه: هذا فعل منفصل (trennbares Verb)، يجب كتابة السابقة «${vf.sep}» في النهاية (مثال: ${expected}).`;
      }
    }
    if(!missingPrefix && altExpected && altExpected.endsWith(' ' + vf.sep)){
      const stem = altExpected.slice(0, -(vf.sep.length + 1)).trim();
      if(verbInput === normalizeDe(stem).replace(/\s+/g, ' ').trim()){
        missingPrefix = true;
        hint = `تنبيه: هذا فعل منفصل (trennbares Verb)، يجب كتابة السابقة «${vf.sep}» في النهاية (مثال: ${altExpected}).`;
      }
    }
  }

  return { ok: false, expected, altExpected, missingPrefix, hint, isSynonym: false };
}

function getVerbConjPool(){
  const cat = typeof CATEGORIES !== 'undefined' ? CATEGORIES.find(c => c.id === 'verben') : null;
  if(!cat || !Array.isArray(cat.words)) return [];
  if(typeof progress === 'undefined' || !progress || !progress['verben']) return [];
  const catProg = progress['verben'];
  const modes = ['mcq', 'written', 'listen'];
  const pool = [];
  for(let i=0; i<cat.words.length; i++){
    const w = cat.words[i];
    if(!w || !w.id) continue;
    const isUnlocked = modes.some(m => catProg[m] && catProg[m].counts && ((catProg[m].counts[w.id] || 0) > 0));
    if(isUnlocked){
      pool.push(i);
    }
  }
  return pool;
}

function selectConjSession(pool, getCountFn, maxCount = 10){
  if(!Array.isArray(pool) || pool.length < 3) return [];
  const fn = typeof getCountFn === 'function' ? getCountFn : (idx => getWordCount('verben', 'conj', idx));

  const items = pool.map(idx => ({
    idx,
    count: fn(idx),
    rnd: Math.random()
  }));

  items.sort((a, b) => (a.count - b.count) || (a.rnd - b.rnd));

  const countToTake = Math.min(maxCount, items.length);
  return items.slice(0, countToTake).map(item => item.idx);
}

function computeConjMasteredCount(){
  const cat = typeof CATEGORIES !== 'undefined' ? CATEGORIES.find(c => c.id === 'verben') : null;
  if(!cat || !Array.isArray(cat.words)) return 0;
  const th = threshFor('conj');
  let mastered = 0;
  for(let i=0; i<cat.words.length; i++){
    if(getWordCount('verben', 'conj', i) >= th) mastered++;
  }
  return mastered;
}

      conjState.currentStage++;
      conjState.answered = false;

  }

  });

function pluralReady(cat){ return cat.hasArticles && cat.words.every(w => w.pl !== undefined); }

function applyUmlaut(word){
  const m = word.match(/[aouAOU]/g);
  if(!m) return word;
  const lastVowel = m[m.length-1];
  const lastIdx = word.lastIndexOf(lastVowel);
  const rep = { 'a':'ä', 'o':'ö', 'u':'ü', 'A':'Ä', 'O':'Ö', 'U':'Ü' }[lastVowel];
  return word.slice(0, lastIdx) + rep + word.slice(lastIdx+1);
}

function pluralDistractors(targetWord, cat){
  const correct = (typeof targetWord === 'object' && targetWord && targetWord.pl ? targetWord.pl : (typeof cat === 'string' ? cat : (typeof targetWord === 'string' ? targetWord : ''))).trim();
  const distractors = [];
  const catWords = (cat && Array.isArray(cat.words)) ? cat.words : [];
  const catPlurals = catWords
    .filter(cw => cw.pl && cw.pl.trim() !== correct)
    .map(cw => cw.pl.trim());
  const globalPlurals = CATEGORIES
    .filter(c => c.hasArticles)
    .flatMap(c => c.words.filter(cw => cw.pl && cw.pl.trim() !== correct).map(cw => cw.pl.trim()));
  const pool = Array.from(new Set([...shuffle(catPlurals), ...shuffle(globalPlurals)]));
  for(const pl of pool){
    if(pl !== correct && !distractors.includes(pl)){
      distractors.push(pl);
      if(distractors.length >= 3) break;
    }
  }
  return distractors;
}

function buildMcqDistractors(cat, idx, count = 3){
  const w = cat && cat.words ? cat.words[idx] : null;
  const targetGloss = (w && w.ar ? w.ar : '').trim();
  const correctText = cat && cat.hasArticles && w && w.a ? `${w.a} ${w.n}` : (w ? w.n : '');
  const distractors = [];
  const chosenTexts = new Set([correctText]);
  const synIds = (cat && cat.id === 'verben' && w && typeof verbSynonyms === 'function')
    ? new Set(verbSynonyms(w.id).map(s => s.id))
    : new Set();

  const pool = (cat && Array.isArray(cat.words) ? cat.words : []).filter((d, i) => {
    if(i === idx) return false;
    if(cat.id === 'verben' && synIds.has(d.id)) return false;
    if((d.ar || '').trim() === targetGloss) return false;
    const dt = cat.hasArticles && d.a ? `${d.a} ${d.n}` : d.n;
    return dt !== correctText;
  });

  for(const d of shuffle(pool)){
    const dt = cat.hasArticles && d.a ? `${d.a} ${d.n}` : d.n;
    if(!chosenTexts.has(dt)){
      chosenTexts.add(dt);
      distractors.push(dt);
      if(distractors.length >= count) break;
    }
  }

  if(distractors.length < count && typeof CATEGORIES !== 'undefined'){
    const others = CATEGORIES
      .filter(c => c.id !== cat.id && c.hasArticles === cat.hasArticles)
      .flatMap(c => c.words || [])
      .filter(d => {
        if((d.ar || '').trim() === targetGloss) return false;
        const dt = cat.hasArticles && d.a ? `${d.a} ${d.n}` : d.n;
        return !chosenTexts.has(dt);
      });

    for(const d of shuffle(others)){
      const dt = cat.hasArticles && d.a ? `${d.a} ${d.n}` : d.n;
      if(!chosenTexts.has(dt)){
        chosenTexts.add(dt);
        distractors.push(dt);
        if(distractors.length >= count) break;
      }
    }
  }

  return distractors;
}

function buildListenDistractors(cat, idx, count = 3){
  const w = cat && cat.words ? cat.words[idx] : null;
  const targetGloss = (w && w.ar ? w.ar : '').trim();
  const distractors = [];
  const chosenGlosses = new Set([targetGloss]);
  const synIds = (cat && cat.id === 'verben' && w && typeof verbSynonyms === 'function')
    ? new Set(verbSynonyms(w.id).map(s => s.id))
    : new Set();

  const pool = (cat && Array.isArray(cat.words) ? cat.words : []).filter((d, i) => {
    if(i === idx) return false;
    if(cat.id === 'verben' && synIds.has(d.id)) return false;
    const g = (d.ar || '').trim();
    return g !== '' && g !== targetGloss;
  });

  for(const d of shuffle(pool)){
    const g = (d.ar || '').trim();
    if(!chosenGlosses.has(g)){
      chosenGlosses.add(g);
      distractors.push(d.ar);
      if(distractors.length >= count) break;
    }
  }

  if(distractors.length < count && typeof CATEGORIES !== 'undefined'){
    const others = CATEGORIES
      .filter(c => c.id !== cat.id)
      .flatMap(c => c.words || [])
      .filter(d => {
        const g = (d.ar || '').trim();
        return g !== '' && !chosenGlosses.has(g);
      });

    for(const d of shuffle(others)){
      const g = (d.ar || '').trim();
      if(!chosenGlosses.has(g)){
        chosenGlosses.add(g);
        distractors.push(d.ar);
        if(distractors.length >= count) break;
      }
    }
  }

  return distractors;
}

let historyDepth = 0;

function cloneView(v){
  if(!v) return { screen:'home', catId:null, mode:null, highlightIdx:null, fromSearch:false };
  return {
    screen: v.screen || 'home',
    catId: v.catId !== undefined ? v.catId : null,
    mode: v.mode !== undefined ? v.mode : null,
    highlightIdx: v.highlightIdx !== undefined ? v.highlightIdx : null,
    fromSearch: !!v.fromSearch
  };
}

function isSameView(a, b){
  if(!a || !b) return false;
  return a.screen === b.screen &&
         a.catId === b.catId &&
         a.mode === b.mode &&
         a.highlightIdx === b.highlightIdx &&
         !!a.fromSearch === !!b.fromSearch;
}

let pendingRefresh = false;

function isExerciseInProgress(){
  return typeof view !== 'undefined' && view && (view.screen === 'exercise' || view.screen === 'flashcards');
}

function refreshAfterSync(status, event){
  const changed = event ? Boolean(event.changed) : Boolean(status && status.lastApplyChangedLocal);
  if(!changed) return;

  if(typeof showToast === 'function'){
    showToast('تم تحديث تقدمك من السحابة');
  }

  if(isExerciseInProgress()){
    pendingRefresh = true;
  } else {
    pendingRefresh = false;
    if(typeof render === 'function'){
      render();
    }
  }
}

function go(v, opts){
  opts = opts || {};
  if (typeof dismissActionToast === 'function') dismissActionToast();
  const currentScreen = view && view.screen;
  const nextView = Object.assign({}, view, v);
  const nextScreen = nextView && nextView.screen;

  // Checkpoint flush: when leaving exercise or flashcards to any other screen
  if ((currentScreen === 'exercise' || currentScreen === 'flashcards') && nextScreen !== currentScreen) {
    if (typeof window !== 'undefined' && window.syncManager && typeof window.syncManager.flushSave === 'function') {
      try {
        window.syncManager.flushSave().catch(() => {});
      } catch (e) {}
    }
  }

  const same = isSameView(view, nextView);
  view = nextView;
  exState = null;
  if(view.mode !== 'conj') conjState = null;

  if (typeof window !== 'undefined' && window.history) {
    if (opts.replace) {
      if (typeof window.history.replaceState === 'function') {
        window.history.replaceState({ view: cloneView(view), depth: historyDepth }, '');
      }
    } else if (!opts.fromPopState && !same) {
      historyDepth++;
      if (typeof window.history.pushState === 'function') {
        window.history.pushState({ view: cloneView(view), depth: historyDepth }, '');
      }
    }
  }

  const hasPending = (typeof pendingRefresh !== 'undefined')
    ? pendingRefresh
    : (typeof window !== 'undefined' && Boolean(window.pendingRefresh));
  const inExercise = (typeof isExerciseInProgress === 'function')
    ? isExerciseInProgress()
    : (typeof window !== 'undefined' && typeof window.isExerciseInProgress === 'function' && window.isExerciseInProgress());

  if (hasPending && !inExercise) {
    if (typeof pendingRefresh !== 'undefined') {
      try { pendingRefresh = false; } catch (e) {}
    }
    if (typeof window !== 'undefined') {
      window.pendingRefresh = false;
    }
  }

  render();
  if (typeof window !== 'undefined' && typeof window.scrollTo === 'function') {
    window.scrollTo(0,0);
  }
}

function goBack(fallback){
  if (typeof window !== 'undefined' && window.history && typeof window.history.back === 'function' && ((window.history.state && window.history.state.depth > 0) || historyDepth > 0)) {
    window.history.back();
  } else {
    go(fallback || { screen:'home', catId:null, mode:null, highlightIdx:null, fromSearch:false }, { replace: true });
  }
}

function searchVocabulary(query){
  const q = query.trim();
  if(!q) return [];
  const qDe = normalizeDe(q);
  const qAr = normalizeAr(q);

  const results = [];
  CATEGORIES.forEach(cat => {
    cat.words.forEach((w, idx) => {
      const fullDe = cat.hasArticles && w.a ? `${w.a} ${w.n}` : w.n;
      const wDeNorm = normalizeDe(fullDe);
      const nDeNorm = normalizeDe(w.n);
      const wArNorm = normalizeAr(w.ar || '');
      const sDeNorm = normalizeDe(w.s || '');
      const sArNorm = normalizeAr(w.sar || '');
      const plNorm = w.pl ? normalizeDe(w.pl) : '';
      const catDeNorm = normalizeDe(cat.de);
      const catArNorm = normalizeAr(cat.ar);

      let matched = false;

      if(wDeNorm.includes(qDe) || nDeNorm.includes(qDe)){
        matched = true;
      } else if(wArNorm.includes(qAr)){
        matched = true;
      } else if(plNorm && plNorm.includes(qDe)){
        matched = true;
      } else if(sDeNorm.includes(qDe) || sArNorm.includes(qAr)){
        matched = true;
      } else if(catArNorm.includes(qAr) || catDeNorm.includes(qDe)){
        matched = true;
      } else if(typeof VERB_FORMS !== 'undefined' && w.id && VERB_FORMS[w.id]){
        const vf = VERB_FORMS[w.id];
        const forms = [...(vf.pres || []), ...(vf.pret || []), vf.pp, vf.perfekt, vf.pretDuAlt].filter(Boolean);
        if(forms.some(f => normalizeDe(f).includes(qDe))){
          matched = true;
        }
      }

      if(matched){
        results.push({
          cat,
          catId: cat.id,
          idx,
          word: w,
          fullDe
        });
      }
    });
  });
  return results;
}

        </div>

        <span>تم العثور على <b>${matches.length}</b> كلمة في كل الأقسام</span>
        ${matches.length > maxItems ? `<span style="font-size:11px;">(يُعرض أول ${maxItems} كلمة)</span>` : ''}
      </div>
      <div class="search-res-list">${itemsHtml}</div>
    `;

    // Click handler for search items: navigate directly to word in its section
    sPanel.querySelectorAll('.search-res-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if(e.target.closest('.mini-speak')) return;
        const catId = el.dataset.cat;
        const idx = parseInt(el.dataset.idx, 10);
        go({ screen:'wordlist', catId, highlightIdx: idx, fromSearch: true });
      });
    });

    sPanel.querySelectorAll('.mini-speak[data-speak]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        speak(btn.dataset.speak);
      });

  sInput.addEventListener('input', doSearch);
  sClear.addEventListener('click', () => {
    sInput.value = '';
    lastSearchQuery = '';
    doSearch();
    sInput.focus();
  });

  if(lastSearchQuery){
    doSearch();
  }

  app.querySelectorAll('.cat-card[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=> go({screen:'modes', catId: el.dataset.cat, fromSearch:false}));

  const grc = document.getElementById('globalReviewCard');
  if(grc) grc.addEventListener('click', ()=> go({screen:'globalReview', fromSearch:false}));
  const dbc = document.getElementById('difficultBankCard');
  if(dbc) dbc.addEventListener('click', ()=> go({screen:'difficultBank', fromSearch:false}));
  const src = document.getElementById('srsReviewCard');
  if(src) src.addEventListener('click', ()=> go({screen:'exercise', mode:'srsReview'}));
  const sbc = document.getElementById('starredBankCard');
  if(sbc) sbc.addEventListener('click', ()=> go({screen:'starredList'}));
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    const sm = typeof window !== 'undefined' ? window.syncManager : null;
    const st = sm && typeof sm.getStatus === 'function' ? sm.getStatus() : { isConfigured: false, user: null };
    const isSignedIn = st.isConfigured && !!st.user;
    let msg = 'هل أنت متأكد من تصفير كافة بياناتك؟\n\nسيتم حذف:\n- تقدّم جميع الأقسام (' + CATEGORIES.length + ' قسماً)\n- السلسلة اليومية والإحصائيات بالكامل\n- بنك الكلمات المفضلة ⭐\n- جدولة المراجعة الذكية (SRS)\n- الهدف اليومي';
    if(isSignedIn){
      msg += '\n\nسيتم أيضاً حذف نسختك السحابية بالكامل لمنع استرجاع البيانات القديمة.';
    } else {
      msg += '\n\nإذا كانت لديك نسخة سحابية على جهاز آخر، فقد تعود بياناتك عند تسجيل الدخول والمزامنة مجدداً.';
    }
    if(confirm(msg)){
      try {
        const ok = await resetAllProgress();
        if(ok === false) return;
        showToast('تم تصفير جميع بيانات التقدم بنجاح 🔄');
        render();
      } catch(err){
        const errMsg = 'فشل حذف البيانات من السحابة: ' + (err && err.message ? err.message : 'خطأ غير معروف');
        showToast(errMsg);
        if(typeof alert === 'function') alert(errMsg);
        render();
      }
    }
  });
}

function renderSyncBoxHtml() {
  const sm = typeof window !== 'undefined' ? window.syncManager : null;
  const status = sm ? sm.getStatus() : { state: 'UNCONFIGURED', isConfigured: false, user: null };
  const isConf = status.isConfigured;
  const user = status.user;
  const state = status.state;

  let contentHtml = '';

  if (!isConf) {
    contentHtml = `
      <div class="sync-status-badge sync-status-inactive">المزامنة غير مفعّلة (الإعداد غير مكتمل)</div>
      <p class="sync-desc">المزامنة السحابية غير متاحة حاليًا. تقدمك محفوظ على هذا الجهاز، ويمكنك نقله بالتصدير والاستيراد من هذه الشاشة.</p>
    `;
  } else if (!user) {
    contentHtml = `
      <div class="sync-status-badge sync-status-inactive">غير مسجل الدخول</div>
      <p class="sync-desc">سجّل الدخول بحساب Google لمزامنة تقدمك تلقائياً وبأمان عبر جميع أجهزتك دون فقدان أي كلمة.</p>
      <div class="sync-actions">
        <button type="button" class="sync-btn sync-btn-primary" id="syncSignInBtn" data-action="sync-signin" aria-label="تسجيل الدخول باستخدام Google">🔑 تسجيل الدخول باستخدام Google</button>
      </div>
    `;
  } else {
    let stateBadge = '';
    if (state === 'SYNCED') {
      stateBadge = '<span class="sync-status-badge sync-status-ok">🟢 متزامن مع السحابة</span>';
    } else if (state === 'SYNCING') {
      stateBadge = '<span class="sync-status-badge sync-status-working">🔄 جاري المزامنة...</span>';
    } else if (state === 'OFFLINE') {
      stateBadge = '<span class="sync-status-badge sync-status-offline">📡 غير متصل بالإنترنت (محفوظ محلياً)</span>';
    } else {
      stateBadge = '<span class="sync-status-badge sync-status-error">⚠️ تعذر الاتصال بالسحابة</span>';
    }

    const lastTimeStr = status.lastSyncTime ? new Date(status.lastSyncTime).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'غير محدد';
    const userLabel = user.displayName || user.email || user.uid;

    contentHtml = `
      <div class="sync-user-row">
        <div class="sync-user-info">
          <div class="sync-user-name">👤 ${escapeHtml(userLabel)}</div>
          <div class="sync-meta">${stateBadge} <span class="sync-time">آخر مزامنة: ${escapeHtml(lastTimeStr)}</span></div>
        </div>
      </div>
      ${status.lastError ? `<div class="sync-error-banner">⚠️ ${escapeHtml(status.lastError)}</div>` : ''}
      <div class="sync-actions">
        <button type="button" class="sync-btn" id="syncNowBtn" data-action="sync-now" aria-label="مزامنة التقدم الآن">🔄 مزامنة الآن</button>
        <button type="button" class="sync-btn sync-btn-danger" id="syncSignOutBtn" data-action="sync-signout" aria-label="تسجيل الخروج">🚪 تسجيل الخروج</button>
        <button type="button" class="sync-btn sync-btn-subtle" id="syncDeleteBtn" data-action="sync-delete" aria-label="حذف بياناتي من السحابة">🗑️ حذف بياناتي من السحابة</button>
      </div>
    `;
  }

  return `
    <div class="sync-box" id="syncBox">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">☁️ الحساب والمزامنة السحابية (اختياري)</div>
      <div style="font-size:12.5px;color:#42403b;margin-bottom:10px;">مزامنة تقدمك تلقائياً وبأمان عبر أجهزتك المختلفة دون التأثير على عمل التطبيق بدون إنترنت:</div>
      ${contentHtml}
      <div class="sync-privacy-note">🔒 <b>ملاحظة الخصوصية:</b> التطبيق يحفظ فقط أرقام مؤشرات الكلمات المتقنة ونقاط الإتقان وسجل التكرار المتباعد المرتبط بمعرّف حسابك (UID). لا يتم إرسال أو تخزين أي كلمات سرية أو رسائل أو نصوص خاصة في السحابة إطلاقاً.</div>
    </div>
  `;
}

let _statsSyncBundleTriggered = false;
function triggerSyncBundleOnStatsOpen(){
  if (_statsSyncBundleTriggered) return;
  _statsSyncBundleTriggered = true;
  if (typeof isFirebaseConfigured === 'function' && isFirebaseConfigured(window.FIREBASE_CONFIG)) {
    if (typeof loadFirebaseSyncBundle === 'function') {
      loadFirebaseSyncBundle().then(() => {
        if (window.syncManager && window.syncManager.adapter && typeof window.syncManager.adapter.attachAuthListener === 'function') {
          window.syncManager.adapter.attachAuthListener();
        }
      }).catch(() => {});
    }
  }
}

function renderStats(){
  triggerSyncBundleOnStatsOpen();
  const streak = displayStreak();
  const longest = stats.longest || stats.current || 0;
  const masteredCount = computeMasteredCount();
  const totalWords = CATEGORIES.reduce((sum, c) => sum + c.words.length, 0);
  const masteredPct = Math.round((masteredCount / totalWords) * 100);
  const totalAnswered = stats.totalAnswered || 0;
  const totalCorrect = stats.totalCorrect || 0;
  const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  const poolCount = learnedPool().length;
  const studiedToday = stats.lastDate === todayStr();

  // Breakdown per category
  const breakdownRows = ORDERED_CATEGORIES.map((c, i) => {
    const color = PALETTE[i % PALETTE.length];
    const catProg = progress[c.id];
    let catMastered = 0;
    const modes = c.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
    if(catProg){
      for(let wIdx=0; wIdx<c.words.length; wIdx++){
        const w = c.words[wIdx];
        const allDone = modes.every(m => catProg[m] && ((w && w.id && catProg[m].counts && catProg[m].counts[w.id]) || 0) >= threshFor(m));
        if(allDone) catMastered++;
      }
    }
    const catPct = Math.round((catMastered / c.words.length) * 100);

    return `
    <div class="stat-cat-row" data-cat="${c.id}">
      <div class="stat-cat-info">
        <div class="stat-cat-name">
          <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};"></span>
          <span>${c.ar}</span>
          <span class="de" lang="de" dir="ltr" style="font-size:12.5px;color:#42403b;">${c.de}</span>
        </div>
        <div class="stat-cat-sub">${catMastered} من ${c.words.length} كلمة متقنة</div>
      </div>
      <div class="stat-cat-bar-wrap">
        <span class="stat-cat-pct">${catPct}%</span>
        <div class="stat-cat-bar">
          <div class="stat-cat-bar-fill" style="width:${catPct}%;background:${color};"></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Voice selection UI data
  let voiceOptionsHtml = '';
  let voiceStatusText = '';
  if (typeof window !== 'undefined' && window.voiceManager) {
    window.voiceManager.update();
    const vCandidates = window.voiceManager.getCandidates();
    const curVoice = window.voiceManager.getVoice();
    const saved = window.voiceManager.getSavedChoice();
    const isMaleActive = window.voiceManager.isMale();

    if (vCandidates.length === 0) {
      voiceOptionsHtml = '<option value="">لا تتوفر أصوات ألمانية مثبتة في المتصفح حالياً</option>';
      voiceStatusText = 'يتم استخدام إعداد الصوت التلقائي للنظام';
    } else {
      voiceOptionsHtml = vCandidates.map(v => {
        const val = v.voiceURI || v.name;
        const isSel = (saved && (v.voiceURI === saved || v.name === saved)) ||
                      (!saved && curVoice && (v.voiceURI === curVoice.voiceURI || v.name === curVoice.name));
        const male = VoiceSelection.isMaleVoice(v);
        const label = `${v.name} (${v.lang})${male ? ' [رجالي ♂]' : ''}`;
        return `<option value="${escapeAttr(val)}" ${isSel ? 'selected' : ''}>${escapeHtml(label)}</option>`;
      }).join('');

      voiceStatusText = curVoice 
        ? `الصوت النشط: ${escapeHtml(curVoice.name)} (${isMaleActive ? 'رجالي معتمد ♂' : 'صوت بديل'})`
        : 'الصوت النشط: الصوت الافتراضي للمتصفح';
    }
  }

  const lastBackupIso = getLastBackupDate();
  const lastBackupDisplay = lastBackupIso ? new Date(lastBackupIso).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' }) : 'لم يتم التصدير بعد';

  app.innerHTML = `

      <h2>📊 إحصائيات التعلّم</h2>
      <p>نظرة شاملة على تقدمك والتزامك اليومي بالألمانية</p>
    </div>

    ${studiedToday 
      ? `<div class="stat-streak-msg">🔥 أحسنت! أكملت دراستك اليوم وحافظت على استمرارية سلسلتك.</div>`
      : streak > 0 
        ? `<div class="stat-streak-msg" style="background:rgba(30,79,163,0.1);border-color:var(--blue);">⚡ تدرّب اليوم للحفاظ على سلسلتك المستمرة (${streak} ${streakUnit(streak)})!</div>`
        : `<div class="stat-streak-msg" style="background:rgba(23,21,18,0.06);border-color:var(--line);">🚀 ابدأ تدريبك اليوم لتسجيل أول يوم في سلسلتك اليومية!</div>`
    }

    <div class="stats-hero-grid">
      <div class="stat-card">
        <div class="stat-card-top">
          <span class="stat-card-icon">🔥</span>
          <span class="stat-card-tag">${streak > 0 ? 'نشطة' : 'غير نشطة'}</span>
        </div>
        <div class="stat-val" style="color:var(--red);">${streak} <span style="font-size:16px;color:var(--ink);">${streakUnit(streak)}</span></div>
        <div class="stat-lbl">السلسلة اليومية الحالية</div>
        <div class="stat-sub">أطول سلسلة سابقة: <b>${longest}</b> يوم</div>
      </div>

      <div class="stat-card">
        <div class="stat-card-top">
          <span class="stat-card-icon">🌟</span>
          <span class="stat-card-tag">${masteredPct}% إتقان</span>
        </div>
        <div class="stat-val" style="color:var(--green);">${masteredCount} <span style="font-size:16px;color:#42403b;">/ ${totalWords}</span></div>
        <div class="stat-lbl">الكلمات المتقنة كليًا</div>
        <div class="stat-sub">أتقنت في جميع الأوضاع المطلوبة</div>
      </div>

      <div class="stat-card">
        <div class="stat-card-top">
          <span class="stat-card-icon">🎯</span>
          <span class="stat-card-tag">${accuracy}% دقة</span>
        </div>
        <div class="stat-val" style="color:var(--blue);">${accuracy}%</div>
        <div class="stat-lbl">نسبة الدقة الكلية</div>
        <div class="stat-sub">${totalCorrect} إجابة صحيحة من أصل ${totalAnswered} سؤال</div>
      </div>

      <div class="stat-card">
        <div class="stat-card-top">
          <span class="stat-card-icon">📖</span>
          <span class="stat-card-tag">${poolCount} كلمة</span>
        </div>
        <div class="stat-val" style="color:var(--yellow);">${poolCount}</div>
        <div class="stat-lbl">كلمات بدأتها</div>
        <div class="stat-sub">كلمات تمت الإجابة عليها بنجاح في أي وضع</div>
      </div>
    </div>

    <!-- Daily Goal Selector -->
    <div class="goal-selector-box">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">🎯 تحديد الهدف اليومي</div>
      <div style="font-size:12.5px;color:#42403b;">اختر عدد الكلمات التي ترغب في إتقانها كل يوم:</div>
      <div class="goal-btns">
        ${[10, 20, 30, 50].map(g => `
          <button class="goal-sel-btn ${getDailyGoal()===g ? 'active' : ''}" data-action="set-daily-goal" data-goal="${g}">${g} كلمة</button>
        `).join('')}
      </div>
    </div>

    ${showBackupBanner ? `
      <div class="backup-reminder-banner" id="backupReminderBanner" style="background:#fff3cd;border:1px solid #ffeeba;color:#856404;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;">
        <span>⚠️ تذكير: لم تقم بتصدير نسخة احتياطية لتقدمك منذ أكثر من 14 يومًا. يُنصح بتحميل نسخة لحفظ تقدمك.</span>
        <button type="button" id="dismissBackupReminderBtn" style="background:transparent;border:none;cursor:pointer;font-size:16px;color:#856404;padding:4px;" aria-label="تذكيري لاحقًا">✕</button>
      </div>
    ` : ''}

    <!-- Backup & Restore Box -->
    <div class="backup-box">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">💾 النسخ الاحتياطي ونقل التقدّم</div>
      <div style="font-size:12.5px;color:#42403b;">احفظ بيانات تقدمك وسلسلتك في ملف خارجي لنقله إلى جهاز آخر أو استعادته لاحقاً:</div>
      <div class="backup-actions">
        <button class="backup-btn" id="exportBtnStats">📥 تصدير نسخة احتياطية (JSON)</button>
        <button class="backup-btn" id="importBtnStats">📤 استعادة نسخة سابقة (JSON)</button>
      </div>
      <div style="font-size:12px;color:#555;margin-top:10px;line-height:1.6;border-top:1px dashed var(--line);padding-top:8px;">
        <div>🔒 حماية التخزين الدائم: ${isStoragePersisted ? 'ممنوحة من المتصفح ✅' : 'غير مضمونة (طلب اختياري للمتصفح، وخاصة في Safari إن لم يكن التطبيق مثبتًا)'}</div>
        <div>📅 آخر تصدير للنسخة الاحتياطية: ${lastBackupDisplay}</div>
      </div>
    </div>

    <!-- Cloud Sync Box -->
    ${renderSyncBoxHtml()}

    <!-- Voice Picker Box -->
    <div class="voice-box">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">🔊 إعدادات الصوت (نطق المفردات)</div>
      <div style="font-size:12.5px;color:#42403b;margin-bottom:8px;">تفضيل الصوت الألماني الرجالي تلقائياً مع إمكانية اختيار الصوت المناسب لجهازك:</div>
      <div class="voice-controls">
        <select class="voice-select" id="voiceSelect" aria-label="اختيار الصوت الألماني" data-action="change-voice">

  document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen:'home'}));

      try {
        if(typeof localStorage !== 'undefined' && localStorage){
          localStorage.setItem(BACKUP_REMINDER_DISMISSED_KEY, Date.now().toString());
        }
      } catch(_) {}
      const banner = document.getElementById('backupReminderBanner');
      if(banner) banner.remove();
    });
  }
  app.querySelectorAll('.stat-cat-row[data-cat]').forEach(el => {

  });
  const expBtn = document.getElementById('exportBtnStats');
  if(expBtn) expBtn.addEventListener('click', exportBackup);
  const impBtn = document.getElementById('importBtnStats');
  if(impBtn) impBtn.addEventListener('click', triggerImportBackup);

  const syncSignBtn = document.getElementById('syncSignInBtn');
  if(syncSignBtn){
    syncSignBtn.addEventListener('click', async ()=>{
      if(!window.syncManager) return;
      try {
        showToast('جاري فتح نافذة تسجيل الدخول... 🔑');
        await window.syncManager.signIn();
        render();
      } catch(err) {
        showToast(`تعذر تسجيل الدخول: ${err.message}`);
        render();
      }
    });
  }

  const syncNowBtn = document.getElementById('syncNowBtn');
  if(syncNowBtn){
    syncNowBtn.addEventListener('click', async ()=>{
      if(!window.syncManager) return;
      if(syncNowBtn.disabled) return;
      syncNowBtn.disabled = true;
      try {
        showToast('جاري مزامنة التقدم مع السحابة... 🔄');
        await window.syncManager.syncNow();
        const sm = window.syncManager;
        const errState = window.SYNC_STATES ? window.SYNC_STATES.ERROR : 'ERROR';
        const offState = window.SYNC_STATES ? window.SYNC_STATES.OFFLINE : 'OFFLINE';
        if(sm.state === errState){
          showToast(`فشلت المزامنة: ${sm.lastError || 'تعذر حفظ التقدم سحابياً'}`);
        } else if(sm.state === offState){
          showToast(`فشلت المزامنة: ${sm.lastError || 'الجهاز غير متصل بالإنترنت حالياً'}`);
        } else {
          showToast('تمت المزامنة');
        }
        render();
      } catch(err) {
        showToast(`فشلت المزامنة: ${err.message || 'تعذر إتمام المزامنة'}`);
        render();
      } finally {
        syncNowBtn.disabled = false;

/* ------------ exercise engine ------------ */
function pickQuestionIndex(catId, mode, lastIdx){
  maybeUnlockMore(catId, mode);
  const active = activeIndices(catId, mode);
  const mastered = masteredUnlockedIndices(catId, mode);
  if(active.length === 0 && mastered.length === 0) return null; // done entirely

  // Never pick the exact same word twice in a row when alternatives are available
  if(mastered.length > 0 && active.length > 0 && Math.random() < 0.2){
    let pool = mastered;
    if(pool.length > 1 && lastIdx !== undefined && lastIdx !== null) pool = pool.filter(i => i !== lastIdx);
    return { idx: pool[Math.floor(Math.random()*pool.length)], review:true };
  }
  if(active.length === 0){
    let pool = mastered;
    if(pool.length > 1 && lastIdx !== undefined && lastIdx !== null) pool = pool.filter(i => i !== lastIdx);
    return { idx: pool[Math.floor(Math.random()*pool.length)], review:true };
  }
  let pool = active;
  if(pool.length > 1 && lastIdx !== undefined && lastIdx !== null) pool = pool.filter(i => i !== lastIdx);
  return { idx: pool[Math.floor(Math.random()*pool.length)], review:false };
}

function renderUmlautBar(inputEl, mountTarget){
  if(!inputEl) return null;

  const wrap = document.createElement('div');
  wrap.className = 'umlaut-bar';

  const row = document.createElement('div');
  row.className = 'umlaut-btn-row';
  row.setAttribute('dir', 'ltr');
  row.setAttribute('lang', 'de');

  const chars = ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'];
  let lastTouchTime = 0;

  function doInsert(ch){
    if(!inputEl || inputEl.disabled || inputEl.readOnly) return;
    const val = inputEl.value || '';
    const start = (typeof inputEl.selectionStart === 'number') ? inputEl.selectionStart : val.length;
    const end = (typeof inputEl.selectionEnd === 'number') ? inputEl.selectionEnd : val.length;
    const s = Math.min(start, end);
    const e = Math.max(start, end);

    inputEl.value = val.slice(0, s) + ch + val.slice(e);
    const newPos = s + ch.length;
    if(typeof inputEl.setSelectionRange === 'function'){
      inputEl.setSelectionRange(newPos, newPos);
    } else {
      inputEl.selectionStart = newPos;
      inputEl.selectionEnd = newPos;
    }

    try {
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
    } catch(err){
      if(typeof document !== 'undefined' && document.createEvent){
        const evt = document.createEvent('Event');
        evt.initEvent('input', true, true);
        inputEl.dispatchEvent(evt);
      }
    }

    if(typeof inputEl.focus === 'function'){
      inputEl.focus();
    }
  }

  chars.forEach(ch => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'umlaut-btn de';
    btn.setAttribute('dir', 'ltr');
    btn.setAttribute('lang', 'de');
    btn.setAttribute('aria-label', `إدراج الحرف ${ch}`);
    btn.textContent = ch;

    // Prevent blur on mouse click
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
    });

    // Touch support: prevent blur & activate immediately
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      lastTouchTime = Date.now();
      doInsert(ch);
    });

    // Click activation (mouse click or keyboard Tab+Enter/Space)
    btn.addEventListener('click', (e) => {
      if(Date.now() - lastTouchTime < 500) return;
      doInsert(ch);
    });

    row.appendChild(btn);
  });

  const hint = document.createElement('div');
  hint.className = 'umlaut-hint';
  hint.textContent = 'اكتب ae أو oe أو ue أو ss، أو استعمل الأزرار';

  wrap.appendChild(row);
  wrap.appendChild(hint);

  if(mountTarget && typeof mountTarget.appendChild === 'function'){
    mountTarget.appendChild(wrap);
  } else if(inputEl.closest && inputEl.closest('.write-row')){
    inputEl.closest('.write-row').insertAdjacentElement('afterend', wrap);
  } else if(inputEl.closest && inputEl.closest('.search-input-box')){
    inputEl.closest('.search-input-box').insertAdjacentElement('afterend', wrap);
  } else if(inputEl.parentNode && typeof inputEl.parentNode.insertBefore === 'function'){
    inputEl.parentNode.insertBefore(wrap, inputEl.nextSibling);
  }

  return wrap;
}

function normalizeDe(s){
  return s.trim().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
}

function modeLabel(mode){
  return mode==='mcq' ? 'اختيار من متعدد' : mode==='written' ? 'الكتابة' : mode==='article' ? 'أداة التعريف' : mode==='plural' ? 'صيغة الجمع' : mode==='listen' ? 'الاستماع' : mode==='review' ? 'مراجعة القسم' : mode==='conj' ? 'اختبار التصريفات' : 'اختبار القسم';
}

function renderExercise(){
  if(view.mode === 'globalMcq') return renderGlobalReviewStep('mcq');
  if(view.mode === 'globalWritten') return renderGlobalReviewStep('written');
  if(view.mode === 'diffMcq') return renderDifficultStep('mcq');
  if(view.mode === 'diffWritten') return renderDifficultStep('written');
  if(view.mode === 'srsReview') return renderSrsReviewStep();
  if(view.mode === 'starredReview') return renderStarredReviewStep();
  if(view.mode === 'conj') return renderConjExercise();
  const cat = CATEGORIES.find(c=>c.id===view.catId);
  const mode = view.mode;
  if(mode === 'quiz') return renderQuiz(cat);
  if(mode === 'review') return renderReviewCat(cat);
  const words = cat.words;
  const th = threshFor(mode);

  // "stop notification": once the learner masters all core words for this
  // mode, pause once to celebrate and offer moving on before extras appear.
  const core = coreCountFor(cat);
  const p = ensureProgress(cat.id, mode);
  if(!p.coreAcked && core < words.length && coreDone(cat.id, mode)){
    const orderedIdx = ORDERED_CATEGORIES.findIndex(c=>c.id===cat.id);
    const nextCat = ORDERED_CATEGORIES[orderedIdx+1];
    app.innerHTML = `
      ${headerHtml(true,'رجوع لأوضاع القسم')}
      <div class="cat-title"><h2>${cat.ar}</h2><span class="cat-sub">${modeLabel(mode)} · <span class="de" lang="de" dir="ltr">${cat.de}</span>${miniSpeak(speakText(cat))}</span></div>
      <div class="done-card">
        <h2>🌟 أتقنت أهم ${core} كلمة في هذا القسم!</h2>
        <p>تقدر تكمّل الـ${words.length-core} كلمة الإضافية دلوقتي، أو تنتقل للقسم اللي بعده وترجع تكمّلهم في أي وقت — تقدمك محفوظ.</p>
      </div>
      <div class="next-row" style="flex-direction:column;gap:10px;">
        <button class="backbtn" id="continueExtra" style="width:100%;">كمّل الكلمات الإضافية دلوقتي</button>
        ${nextCat ? `<button class="backbtn" id="goNextCat" style="width:100%;">روح لقسم "${nextCat.ar}" التالي</button>` : ''}
      </div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen:'modes'}));
    document.getElementById('continueExtra').addEventListener('click', ()=>{
      ensureProgress(cat.id, mode).coreAcked = true; saveProgressSoon(); renderExercise();
    });
    const nextBtn2 = document.getElementById('goNextCat');
    if(nextBtn2) nextBtn2.addEventListener('click', ()=>{
      ensureProgress(cat.id, mode).coreAcked = true; saveProgressSoon(); go({screen:'modes', catId: nextCat.id});
    });
    return;
  }

  const lastIdx = (exState && exState.catId === cat.id && exState.mode === mode) ? exState.idx : null;
  const pick = pickQuestionIndex(cat.id, mode, lastIdx);
  const dotsIdx = unlockedIndices(cat.id, mode).filter(i => getWordCount(cat.id,mode,i) < th);
  const dotsHtml = (dotsIdx.length? dotsIdx : unlockedIndices(cat.id,mode)).slice(0,5).map(i=>{
    const pct = Math.min(100, Math.round((getWordCount(cat.id,mode,i)/th)*100));
    return `<div class="dot"><i style="width:${pct}%;background:${PALETTE[1]}"></i></div>`;
  }).join('');

  if(pick === null){
    app.innerHTML = `
      ${headerHtml(true,'رجوع للأقسام')}
      <div class="cat-title"><h2>${cat.ar}</h2><span class="cat-sub"><span class="de" lang="de" dir="ltr">${cat.de}</span>${miniSpeak(speakText(cat))}</span></div>
      <div class="done-card">
        <h2>🎉 أتقنت كل كلمات هذا القسم في هذا التمرين</h2>
        <p>جرّب وضعًا آخر لنفس القسم أو انتقل إلى قسم جديد.</p>
      </div>
      <div class="next-row"><button class="backbtn" id="toModes">أوضاع أخرى لهذا القسم</button></div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen:'home'}));
    document.getElementById('toModes').addEventListener('click', ()=> go({screen:'modes'}));
    return;
  }

  const idx = pick.idx;
  const w = words[idx];
  exState = { catId: cat.id, mode, idx, answered:false };

  app.innerHTML = `
    ${headerHtml(true,'رجوع لأوضاع القسم')}
    <div class="cat-title"><h2>${cat.ar}</h2><span class="cat-sub">${modeLabel(mode)} · <span class="de" lang="de" dir="ltr">${cat.de}</span>${miniSpeak(speakText(cat))}</span></div>
    <div class="progress-dots">${dotsHtml}</div>
    <div id="qzone"></div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen:'modes'}));
  renderQuestion(cat, mode, idx, w);
}

/* ------------ section quiz: all words shuffled, one full pass ------------ */
function renderQuiz(cat){
  if(!exState || exState.catId !== cat.id || exState.mode !== 'quiz'){
    exState = {
      catId: cat.id, mode:'quiz',
      queue: shuffle(cat.words.map((_,i)=>i)),
      pos: 0, correct: 0, wrongCount: 0, answered:false
    };
  }
  const total = exState.queue.length;

  if(exState.pos >= total){
    const pct = Math.round((exState.correct/total)*100);
    app.innerHTML = `
      ${headerHtml(true,'رجوع لأوضاع القسم')}
      <div class="cat-title"><h2>${cat.ar}</h2><span class="cat-sub">نتيجة اختبار القسم · <span class="de" lang="de" dir="ltr">${cat.de}</span>${miniSpeak(speakText(cat))}</span></div>
      <div class="done-card">
        <h2>${exState.correct} / ${total} إجابة صحيحة (${pct}%)</h2>
        <p>${exState.wrongCount ? `${exState.wrongCount} كلمة رجعت للتدريب العادي (MCQ/كتابة) في هذا القسم عشان تراجعها.` : 'ممتاز! أجبت صح على كل كلمات القسم 🎉'}</p>
      </div>
      <div class="next-row"><button class="backbtn" id="retryQuiz">إعادة اختبار القسم</button></div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen:'modes'}));
    document.getElementById('retryQuiz').addEventListener('click', ()=>{ exState = null; renderExercise(); });
    return;
  }

  const idx = exState.queue[exState.pos];
  const w = cat.words[idx];
  exState.answered = false;

  app.innerHTML = `
    ${headerHtml(true,'رجوع لأوضاع القسم')}
    <div class="cat-title"><h2>${cat.ar}</h2><span class="cat-sub">اختبار القسم · ${exState.pos+1} / ${total} · <span class="de" lang="de" dir="ltr">${cat.de}</span>${miniSpeak(speakText(cat))}</span></div>
    <div id="qzone"></div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen:'modes'}));

  const zone = document.getElementById('qzone');
  const correctText = cat.hasArticles ? `${w.a} ${w.n}` : w.n;
  const distractors = buildMcqDistractors(cat, idx, 3);
  const options = shuffle([correctText, ...distractors]);
  zone.innerHTML = `
    <div class="qcard">
      <div class="qlabel">ما هي الكلمة الألمانية الصحيحة؟</div>
      <div class="qmain">${escapeHtml(w.ar)}</div>
    </div>
    <div class="options">${options.map(o=>`<div class="opt de" lang="de" dir="ltr" data-val="${escapeAttr(o)}">${escapeHtml(o)}</div>`).join('')}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="next-row"><button class="next-btn" id="nextBtn">${exState.pos+1 < total ? 'التالي ←' : 'عرض النتيجة'}</button></div>
  `;
  zone.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(exState.answered) return;
      exState.answered = true;
      const chosen = el.dataset.val;
      const ok = chosen === correctText;
      zone.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('disabled');
        if(o.dataset.val === correctText) o.classList.add('correct');
        else if(o === el) o.classList.add('wrong');
      });
      if(ok){ exState.correct++; }
      else { exState.wrongCount++; reinforceWord(cat.id, idx); }
      recordActivity(ok);
      refreshGoalDisplay();
      speak(correctText);
      const fb = document.getElementById('fb');
      fb.innerHTML = buildFeedbackHtml(w, cat, ok, correctText, false, 'quiz');
      document.getElementById('nextBtn').classList.add('show');
    });
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ exState.pos++; renderQuiz(cat); });
}

// ---- Review mode (per-category "مراجعة القسم" and global "مراجعة شاملة") ----
// Each word is tested in up to 2 back-to-back steps: (1) the word + its
// article, (2) its plural form — or, for words with no plural, a "لا يوجد
// جمع" option mixed in with real plurals from the same category, which
// specifically drills the "not every noun has a plural" lesson.
const NO_PLURAL_LABEL = 'لا يوجد جمع لهذه الكلمة';

function reviewTotalQ(queue){
  return queue.reduce((sum, it) => {
    const c = CATEGORIES.find(x => x.id === it.catId);
    return sum + (c.hasArticles ? 2 : 1);
  }, 0);
}

function renderReviewCat(cat){
  if(!exState || exState.kind !== 'catReview' || exState.catId !== cat.id){
    const queue = shuffle(cat.words.map((_,i)=>({ catId: cat.id, idx: i })));
    exState = { kind:'catReview', catId:cat.id, queue, pos:0, stage:0, correct:0, wrongCount:0, answered:false, totalQ: reviewTotalQ(queue) };
  }
  renderReviewScreen({
    backScreen:'modes', backLabel:'رجوع لأوضاع القسم',
    headerTitle: cat.ar,
    headerSub: `مراجعة القسم · ${cat.de}${miniSpeak(speakText(cat))}`,
    emptyMsg: 'مفيش كلمات في هذا القسم لسه.',
    rebuild: ()=>{ exState = null; renderReviewCat(cat); }
  });
}

function renderReviewScreen(opts){
  const queue = exState.queue;

  if(queue.length === 0){
    app.innerHTML = `
      ${headerHtml(true, opts.backLabel)}
      <div class="cat-title"><h2>${opts.headerTitle}</h2></div>
      <div class="done-card"><h2>مفيش كلمات كفاية للمراجعة لسه</h2><p>${opts.emptyMsg}</p></div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen: opts.backScreen}));
    return;
  }

  if(exState.pos >= queue.length){
    const pct = Math.round((exState.correct / exState.totalQ) * 100);
    app.innerHTML = `
      ${headerHtml(true, opts.backLabel)}
      <div class="cat-title"><h2>${opts.headerTitle}</h2><span style="display:block;font-size:14px;color:#42403b;margin-top:4px;">نتيجة المراجعة</span></div>
      <div class="done-card">
        <h2>${exState.correct} / ${exState.totalQ} إجابة صحيحة (${pct}%)</h2>
        <p>${exState.wrongCount ? `${exState.wrongCount} سؤال غلط رجّع كلماته للتدريب العادي عشان تراجعها.` : 'ممتاز! أجبت صح على كل حاجة في المراجعة 🎉'}</p>
      </div>
      <div class="next-row"><button class="backbtn" id="retryReview">إعادة المراجعة</button></div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen: opts.backScreen}));
    document.getElementById('retryReview').addEventListener('click', opts.rebuild);
    return;
  }

  const item = queue[exState.pos];
  const cat = CATEGORIES.find(c => c.id === item.catId);
  const idx = item.idx;
  const w = cat.words[idx];
  exState.answered = false;
  const stageLabel = cat.hasArticles ? ` · خطوة ${exState.stage+1} من 2` : '';

  app.innerHTML = `
    ${headerHtml(true, opts.backLabel)}
    <div class="cat-title"><h2>${opts.headerTitle}</h2><span style="display:block;font-size:14px;color:#42403b;margin-top:4px;">${opts.headerSub} · كلمة ${exState.pos+1} / ${queue.length}${stageLabel}</span></div>
    <div id="qzone"></div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen: opts.backScreen}));
  const zone = document.getElementById('qzone');
  const isLast = exState.pos+1 >= queue.length;

  function goNext(){
    if(exState.stage === 0 && cat.hasArticles){
      exState.stage = 1;
    } else {
      exState.pos++;
      exState.stage = 0;
    }
    renderReviewScreen(opts);
  }

  if(exState.stage === 0){
    const correctText = cat.hasArticles ? `${w.a} ${w.n}` : w.n;
    const distractors = buildMcqDistractors(cat, idx, 3);
    const options = shuffle([correctText, ...distractors]);
    const willBeLastStep = !cat.hasArticles && isLast;
    const srcTag = item.sources && item.sources.length
      ? `<div style="font-size:12px;color:#42403b;margin-top:6px;">📍 اتعلمتها في: ${item.sources.map(modeLabel).join(' + ')}</div>` : '';
    zone.innerHTML = `
      <div class="qcard">
        <div class="qlabel">ما هي الكلمة الألمانية الصحيحة؟</div>
        <div class="qmain">${escapeHtml(w.ar)}</div>
        ${srcTag}
      </div>
      <div class="options">${options.map(o=>`<div class="opt de" lang="de" dir="ltr" data-val="${escapeAttr(o)}">${escapeHtml(o)}</div>`).join('')}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div class="next-row"><button class="next-btn" id="nextBtn">${willBeLastStep ? 'عرض النتيجة' : 'التالي ←'}</button></div>
    `;
    zone.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(exState.answered) return;
        exState.answered = true;
        const chosen = el.dataset.val;
        const ok = chosen === correctText;
        zone.querySelectorAll('.opt').forEach(o=>{
          o.classList.add('disabled');
          if(o.dataset.val === correctText) o.classList.add('correct');
          else if(o === el) o.classList.add('wrong');
        });
        if(ok){ exState.correct++; } else { exState.wrongCount++; reinforceWord(cat.id, idx); }
        recordActivity(ok);
        refreshGoalDisplay();
        speak(correctText);
        const fb = document.getElementById('fb');
        if(cat && (!cat.hasArticles || cat.id === 'verben') && typeof renderVerbPanel === 'function'){
          fb.innerHTML = buildFeedbackHtml(w, cat, ok, correctText, false);
        } else {
          fb.innerHTML = (ok ? `إجابة صحيحة! ${escapeHtml(correctText)}` : `إجابة غير صحيحة، الصحيحة هي: ${escapeHtml(correctText)}`) + noteLine(w) + sentenceLine(w);
        }
        fb.className = 'feedback ' + (ok?'ok':'bad');
        document.getElementById('nextBtn').classList.add('show');
      });
    });
    document.getElementById('nextBtn').addEventListener('click', goNext);
    return;
  }

  // stage 1 — plural (only reached when cat.hasArticles is true)
  const correctText = w.pl || NO_PLURAL_LABEL;
  const distractors = pluralDistractors(w, cat);
  const options = shuffle([correctText, ...distractors]);
  zone.innerHTML = `
    <div class="qcard">
      <div class="qlabel">إيه صيغة الجمع الصحيحة لهذه الكلمة؟</div>
      <div class="qmain de" lang="de" dir="ltr">${escapeHtml(w.a)} ${escapeHtml(w.n)}</div>
      <div class="qsub">${escapeHtml(w.ar)}</div>
    </div>
    <div class="options">${options.map(o=>`<div class="opt ${o===NO_PLURAL_LABEL?'':'de'}" ${o===NO_PLURAL_LABEL?'':'lang="de" dir="ltr" '}data-val="${escapeAttr(o)}">${escapeHtml(o)}</div>`).join('')}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="next-row"><button class="next-btn" id="nextBtn">${isLast ? 'عرض النتيجة' : 'التالي ←'}</button></div>
  `;
  zone.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(exState.answered) return;
      exState.answered = true;
      const chosen = el.dataset.val;
      const ok = chosen === correctText;
      zone.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('disabled');
        if(o.dataset.val === correctText) o.classList.add('correct');
        else if(o === el) o.classList.add('wrong');
      });
      if(ok){ exState.correct++; } else { exState.wrongCount++; if(w.pl) reinforcePlural(cat.id, idx); }
      speak(w.pl || w.n);
      const fb = document.getElementById('fb');
      fb.innerHTML = (ok ? `إجابة صحيحة! ${escapeHtml(correctText)}` : `إجابة غير صحيحة، الصحيحة هي: ${escapeHtml(correctText)}`) + noteLine(w) + sentenceLine(w);
      fb.className = 'feedback ' + (ok?'ok':'bad');
      document.getElementById('nextBtn').classList.add('show');
    });
  });
  document.getElementById('nextBtn').addEventListener('click', goNext);
}

function renderSrsReviewStep(){
  if(!exState || exState.kind !== 'srsStep'){
    const queue = shuffle(srsDuePool());
    exState = { kind:'srsStep', queue, pos:0, correct:0, wrongCount:0, answered:false };
  } else if(exState.answered){
    if(exState.lastOk) exState.correct++; else exState.wrongCount++;
    exState.pos++;
    exState.answered = false;
  }

  const queue = exState.queue;
  if(queue.length === 0){
    app.innerHTML = `
      ${headerHtml(true,'رجوع للرئيسية')}

    `;
    document.getElementById('backBtn').addEventListener('click', ()=> goBack({screen:'home'}));

  app.innerHTML = `
    ${headerHtml(true,'رجوع للرئيسية')}

function renderQuestion(cat, mode, idx, w){
  const zone = document.getElementById('qzone');

  // ---------- LISTENING COMPREHENSION MODE ----------
  if(mode === 'listen'){
    const correctDe = cat.hasArticles && w.a ? `${w.a} ${w.n}` : w.n;
    const distractors = buildListenDistractors(cat, idx, 3);
    const options = shuffle([w.ar, ...distractors]);
    
    zone.innerHTML = `
      <div class="qcard">
        <div class="qlabel">استمع للصوت واختر المعنى العربي الصحيح</div>
        <button class="listen-hero-btn" id="listenPlayBtn" title="استمع مجددًا">${MINI_SPEAK_SVG}</button>

      </div>

        ${options.map((o,i)=>`<div class="opt" data-val="${escapeAttr(o)}"><span>${escapeHtml(o)}</span> <span class="kbd-key">${i+1}</span></div>`).join('')}

    `;
