<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="theme-color" content="#171512">

<title>تعلّم الألمانية · Deutsch lernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC;
    --ink:#171512;
    --blue:#1E4FA3;
    --red:#C8342A;
    --yellow:#EBB111;
    --green:#2C6E49;
    --line: rgba(23,21,18,0.14);
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .de{ font-family:'Space Grotesk', sans-serif; direction:ltr; unicode-bidi: isolate; }
  .wrap{ width:100%; max-width:760px; }

  /* ---------- Header ---------- */
  header.app-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:26px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:34px; height:34px; position:relative; flex-shrink:0; }
  .brand-mark span{ position:absolute; border-radius:50%; }
  .brand-mark .c1{ width:20px;height:20px; background:var(--red); top:0; right:0; border-radius:50%; }
  .brand-mark .c2{ width:16px;height:16px; background:var(--yellow); bottom:0; left:2px; border-radius:2px; transform:rotate(20deg); }
  .brand-mark .c3{ width:12px;height:12px; background:var(--blue); bottom:2px; right:8px; border-radius:50%; }
  .brand h1{ font-size:19px; margin:0; font-weight:800; }
  .brand p{ margin:2px 0 0; font-size:12.5px; color:#6b6a66; }
  .backbtn{
    border:1.5px solid var(--ink); background:transparent; color:var(--ink);
    font-family:'Cairo',sans-serif; font-weight:700; font-size:14px;
    padding:8px 16px; border-radius:999px; cursor:pointer;
  }
  .backbtn:hover{ background:var(--ink); color:var(--paper); }

  /* ---------- Home grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:14px;
  }
  .cat-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:16px; cursor:pointer; text-align:right; position:relative; overflow:hidden;
    transition:transform .12s ease, border-color .12s ease;
  }
  .cat-card:hover{ transform:translateY(-2px); border-color:var(--ink); }
  .cat-shape{ width:26px; height:26px; margin-bottom:14px; border-radius:50%; }
  .cat-card h3{ margin:0 0 2px; font-size:16px; font-weight:700; }
  .cat-card .de{ display:block; font-size:13px; color:#6b6a66; margin-bottom:12px; }
  .bar-bg{ height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; }
  .cat-meta{ font-size:11px; color:#8a8983; margin-top:6px; }

  /* ---------- Mode picker ---------- */
  .cat-title{ text-align:center; margin-bottom:26px; }
  .cat-title h2{ margin:0; font-size:24px; font-weight:800; }
  .cat-title .de{ display:block; font-size:16px; color:#6b6a66; margin-top:4px; }
  .wordcount-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:12px 16px; margin-bottom:16px; font-size:13.5px;
  }
  .wordcount-row .backbtn{ padding:6px 14px; font-size:12.5px; }
  .modes{ display:flex; flex-direction:column; gap:12px; }

  /* ---------- Word list ---------- */
  .wl-list{ display:flex; flex-direction:column; gap:8px; }
  .wl-row{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:10px 14px;
  }
  .wl-speak{
    width:36px; height:36px; border-radius:50%; border:1.5px solid var(--ink);
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; color:var(--ink);
  }
  .wl-speak:hover{ background:var(--ink); color:var(--paper); }
  .wl-speak svg{ width:16px; height:16px; fill:currentColor; }
  .wl-text{ flex:1; display:flex; flex-direction:column; }
  .wl-de{ font-size:16px; font-weight:600; }
  .wl-ar{ font-size:13px; color:#6b6a66; margin-top:1px; }
  .wl-note{ font-size:12px; color:#8a8983; margin-top:3px; }
  .wl-num{ font-size:12px; color:#b3b1a8; font-family:'Space Grotesk',sans-serif; }
  .wl-divider{
    text-align:center; font-size:12.5px; color:#8a8983; background:rgba(23,21,18,0.05);
    border-radius:8px; padding:8px 12px; margin:6px 0 2px;
  }
  .mode-btn{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:18px 20px; cursor:pointer; text-align:right;
  }
  .mode-btn:hover{ border-color:var(--ink); }
  .mode-btn .mt{ font-size:17px; font-weight:700; }
  .mode-btn .ms{ font-size:12.5px; color:#6b6a66; margin-top:2px; }
  .mode-icon{ width:30px; height:30px; flex-shrink:0; border-radius:8px; }

  /* ---------- Exercise ---------- */
  .progress-dots{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
  .dot{ width:34px; height:6px; border-radius:3px; background:var(--line); position:relative; overflow:hidden; }
  .dot i{ position:absolute; inset:0; border-radius:3px; }
  .qcard{
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    padding:34px 26px; text-align:center; margin-bottom:20px;
  }
  .qlabel{ font-size:12.5px; color:#8a8983; margin-bottom:10px; letter-spacing:.02em;}
  .qmain{ font-size:26px; font-weight:800; margin-bottom:6px; }
  .qsub{ font-size:14px; color:#6b6a66; }
  .speak-row{ display:flex; justify-content:center; margin-top:16px; }
  .speak-btn{
    width:46px; height:46px; border-radius:50%; border:1.5px solid var(--ink);
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .speak-btn:hover{ background:var(--ink); }
  .speak-btn:hover svg{ fill:var(--paper); }
  .speak-btn svg{ width:20px; height:20px; fill:var(--ink); }

  .mini-speak{
    width:22px; height:22px; border-radius:50%; border:1.3px solid var(--ink);
    background:transparent; display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; vertical-align:middle; margin-inline-start:6px; padding:0;
  }
  .mini-speak svg{ width:10px; height:10px; fill:var(--ink); }
  .mini-speak:hover{ background:var(--ink); }
  .mini-speak:hover svg{ fill:var(--paper); }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt{
    font-family:'Space Grotesk',sans-serif; direction:ltr; text-align:center;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:16px 10px; font-size:16px; font-weight:600; cursor:pointer;
  }
  .opt:hover{ border-color:var(--blue); }
  .opt.correct{ background:var(--green); border-color:var(--green); color:#fff; }
  .opt.wrong{ background:var(--red); border-color:var(--red); color:#fff; }
  .opt.disabled{ pointer-events:none; }

  .article-options{ display:flex; gap:10px; justify-content:center; }
  .article-options .opt{ flex:1; max-width:140px; }

  .write-row{ display:flex; gap:10px; }
  .write-row input{
    flex:1; font-family:'Space Grotesk',sans-serif; direction:ltr; text-align:center;
    font-size:18px; padding:14px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink);
  }
  .write-row input:focus{ outline:none; border-color:var(--blue); }
  .submit-btn{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:15px;
    background:var(--ink); color:var(--paper); border:none; border-radius:10px;
    padding:0 22px; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:.4; cursor:default; }

  .feedback{ margin-top:16px; text-align:center; font-size:14.5px; min-height:20px; font-weight:700; }
  .feedback.ok{ color:var(--green); }
  .feedback.bad{ color:var(--red); }
  .fbnote{ margin-top:8px; font-weight:400; font-size:13px; color:#6b6a66; }

  .next-row{ display:flex; justify-content:center; margin-top:14px; }
  .next-btn{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:14px;
    background:transparent; border:1.5px solid var(--ink); border-radius:999px;
    padding:9px 22px; cursor:pointer; display:none;
  }
  .next-btn.show{ display:inline-block; }

  .done-card{ text-align:center; padding:50px 20px; }
  .done-card h2{ font-size:22px; margin-bottom:8px; }
  .done-card p{ color:#6b6a66; font-size:14.5px; }

  .footnote{ text-align:center; font-size:12px; color:#9a9990; margin-top:36px; line-height:1.9; }

  /* ---------- Streak & Header Actions ---------- */
  .head-actions{ display:flex; align-items:center; gap:8px; }
  .streak-badge{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 14px; font-weight:700; font-size:13.5px; cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    user-select:none;
  }
  .streak-badge:hover{ transform:translateY(-1px); border-color:var(--red); box-shadow:0 2px 8px rgba(200,52,42,0.15); }
  .streak-badge .streak-flame{ font-size:16px; line-height:1; }
  .streak-badge .streak-num{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--red); }
  .streak-badge .streak-lbl{ font-size:12px; color:#6b6a66; }
  .stats-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 14px; font-family:'Cairo',sans-serif; font-weight:700; font-size:13px;
    cursor:pointer; color:var(--ink);
    transition:transform .12s ease, border-color .12s ease;
  }
  .stats-btn:hover{ transform:translateY(-1px); border-color:var(--blue); color:var(--blue); }
  .stats-btn svg{ fill:currentColor; width:15px; height:15px; }

  /* ---------- Search Across All Sections ---------- */
  .search-box-wrap{ margin-bottom:20px; position:relative; }
  .search-input-box{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:2px solid var(--ink); border-radius:12px;
    padding:10px 16px; box-shadow:0 3px 0 var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-input-box:focus-within{ border-color:var(--blue); box-shadow:0 3px 0 var(--blue); }
  .search-icon{ width:20px; height:20px; fill:#8a8983; flex-shrink:0; }
  .search-input-box input{
    flex:1; border:none; background:transparent; font-family:'Cairo',sans-serif;
    font-size:15px; font-weight:600; color:var(--ink); outline:none; direction:rtl;
  }
  .search-input-box input::placeholder{ color:#9a9990; font-weight:400; }
  .search-clear-btn{
    background:rgba(23,21,18,0.08); border:none; border-radius:50%; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px;
    color:var(--ink); padding:0; flex-shrink:0; font-weight:bold;
  }
  .search-clear-btn:hover{ background:var(--ink); color:#fff; }
  .search-results-panel{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    margin-top:10px; max-height:450px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }
  .search-res-header{
    padding:10px 16px; font-size:12.5px; color:#8a8983; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; background:rgba(23,21,18,0.02);
  }
  .search-res-list{ display:flex; flex-direction:column; }
  .search-res-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer;
    transition:background .12s ease;
  }
  .search-res-item:last-child{ border-bottom:none; }
  .search-res-item:hover{ background:rgba(30,79,163,0.05); }
  .search-res-main{ flex:1; text-align:right; }
  .search-res-word{ display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .search-res-de{ font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; direction:ltr; }
  .search-res-ar{ font-size:14.5px; font-weight:600; color:var(--ink); }
  .search-res-sentence{ font-size:12.5px; color:#6b6a66; margin-top:2px; }
  .search-res-sentence .de{ color:var(--blue); font-weight:500; }
  .search-res-cat{
    font-size:11.5px; padding:4px 10px; border-radius:999px; background:rgba(23,21,18,0.06);
    color:#4a4944; white-space:nowrap; flex-shrink:0; font-weight:600;
  }
  .search-no-results{ padding:30px 20px; text-align:center; color:#8a8983; font-size:14px; }

  /* ---------- Word List Highlight Pulse ---------- */
  @keyframes wlPulse {
    0% { background:rgba(235,177,17,0.45); transform:scale(1.02); box-shadow:0 0 12px rgba(235,177,17,0.5); }
    50% { background:rgba(235,177,17,0.22); }
    100% { background:var(--card); transform:scale(1); box-shadow:none; }
  }
  .wl-highlight-pulse{
    animation: wlPulse 2.5s ease forwards;
    border-color: var(--yellow) !important;
  }
  .wl-sentence{
    margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
    font-size:12.5px; color:#6b6a66; line-height:1.4;
  }
  .wl-sentence-de{ color:var(--blue); font-weight:600; display:flex; align-items:center; gap:4px; }
  .wl-sentence-ar{ color:#7a7974; margin-top:2px; }

  /* ---------- Contextual Sentence Feedback ---------- */
  .fb-sentence{
    margin-top:12px;
    background:rgba(23,21,18,0.04);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    text-align:center;
  }
  .fb-sentence-de{
    font-family:'Space Grotesk',sans-serif;
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    direction:ltr;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .fb-sentence-ar{
    font-family:'Cairo',sans-serif;
    font-size:13.5px;
    color:#5a5954;
    margin-top:4px;
    direction:rtl;
  }

  /* ---------- Statistics Screen ---------- */
  .stats-header{ text-align:center; margin-bottom:24px; }
  .stats-header h2{ margin:0 0 4px; font-size:24px; font-weight:800; }
  .stats-header p{ margin:0; font-size:14px; color:#6b6a66; }
  .stats-hero-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:14px; margin-bottom:24px;
  }
  .stat-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:18px; text-align:right; position:relative; overflow:hidden;
  }
  .stat-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .stat-card-icon{ font-size:22px; }
  .stat-card-tag{ font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(23,21,18,0.06); color:#6b6a66; font-weight:600; }
  .stat-val{ font-size:28px; font-weight:800; line-height:1.1; margin-bottom:4px; font-family:'Space Grotesk',sans-serif; }
  .stat-lbl{ font-size:14px; font-weight:700; color:var(--ink); }
  .stat-sub{ font-size:12px; color:#8a8983; margin-top:4px; line-height:1.4; }
  .stat-streak-msg{
    background:rgba(235,177,17,0.12); border:1.5px solid var(--yellow);
    border-radius:10px; padding:12px 16px; margin-bottom:20px; text-align:center;
    font-weight:700; font-size:14px; color:var(--ink);
  }
  .stats-section-title{ font-size:17px; font-weight:800; margin:24px 0 14px; }
  .stats-breakdown-list{ display:flex; flex-direction:column; gap:8px; }
  .stat-cat-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:10px 14px; cursor:pointer; transition:transform .1s ease, border-color .12s ease;
  }
  .stat-cat-row:hover{ border-color:var(--ink); transform:translateY(-1px); }
  .stat-cat-info{ flex:1; text-align:right; }
  .stat-cat-name{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .stat-cat-sub{ font-size:12px; color:#8a8983; margin-top:2px; }
  .stat-cat-bar-wrap{ width:120px; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .stat-cat-bar{ width:100%; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .stat-cat-bar-fill{ height:100%; border-radius:3px; }
  .stat-cat-pct{ font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:#6b6a66; }

  /* ---------- Gender Color-Coding & Badges ---------- */
  :root {
    --gender-der: #1E4FA3;
    --gender-die: #C8342A;
    --gender-das: #2C6E49;
    --gender-pl: #B45309;
  }
  .gender-tag{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700;
    padding:2px 7px; border-radius:4px; margin-inline-end:6px;
    line-height:1.2; vertical-align:middle; text-transform:lowercase;
  }
  .gender-tag.der, .article-der{ background:rgba(30,79,163,0.12); color:var(--gender-der); border:1px solid rgba(30,79,163,0.3); }
  .gender-tag.die, .article-die{ background:rgba(200,52,42,0.12); color:var(--gender-die); border:1px solid rgba(200,52,42,0.3); }
  .gender-tag.das, .article-das{ background:rgba(44,110,73,0.12); color:var(--gender-das); border:1px solid rgba(44,110,73,0.3); }
  .gender-tag.pl, .article-pl{ background:rgba(235,177,17,0.18); color:var(--gender-pl); border:1px solid rgba(235,177,17,0.4); }

  /* ---------- Starred Vocabulary ---------- */
  .star-btn{
    background:transparent; border:none; cursor:pointer; font-size:18px;
    padding:4px 6px; line-height:1; color:#c5c3ba; transition:transform .12s, color .12s;
    vertical-align:middle;
  }
  .star-btn:hover{ transform:scale(1.2); color:#EBB111; }
  .star-btn.starred{ color:#EBB111; text-shadow:0 0 4px rgba(235,177,17,0.4); }

  /* ---------- Plural & Answer Feedback Box ---------- */
  .fb-box{
    margin-top:14px; background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; padding:16px; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.04);
  }
  .fb-status-line{
    font-size:16px; font-weight:700; margin-bottom:8px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .fb-status-line.ok{ color:var(--green); }
  .fb-status-line.bad{ color:var(--red); }
  .fb-plural-badge{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(235,177,17,0.12); border:1px solid rgba(235,177,17,0.35);
    border-radius:8px; padding:6px 14px; font-size:14px; margin-bottom:8px;
  }
  .fb-plural-badge .pl-label{ font-weight:700; color:#6b6a66; font-size:12.5px; }
  .fb-plural-badge .pl-text{ font-weight:700; font-size:15px; color:var(--ink); }
  .fb-plural-uncountable{ background:rgba(0,0,0,0.04); border-color:var(--line); }

  /* ---------- Keyboard Shortcuts Badges ---------- */
  .kbd-key{
    font-family:'Space Grotesk',sans-serif; font-size:10.5px; font-weight:700;
    padding:2px 5px; border-radius:4px; background:rgba(23,21,18,0.08);
    color:#7a7974; border:1px solid rgba(23,21,18,0.14); margin-inline-start:6px;
    vertical-align:middle; display:inline-block; line-height:1;
  }

  /* ---------- Daily Goal Badge in Header ---------- */
  .goal-badge{
    display:flex; align-items:center; gap:5px;
    background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:6px 12px; font-weight:700; font-size:13px; cursor:pointer;
    transition:transform .12s, border-color .12s;
  }
  .goal-badge:hover{ transform:translateY(-1px); border-color:var(--yellow); }
  .goal-badge .goal-num{ font-family:'Space Grotesk',sans-serif; color:#b45309; }

  /* ---------- Interactive 3D Flashcards ---------- */
  .fc-wrap{
    width:100%; max-width:480px; margin:0 auto 20px; perspective:1000px;
    cursor:pointer; user-select:none;
  }
  .fc-card{
    width:100%; min-height:260px; position:relative; transform-style:preserve-3d;
    transition:transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius:14px; border:2px solid var(--ink); box-shadow:0 6px 0 var(--ink);
    background:var(--card);
  }
  .fc-card.flipped{ transform:rotateY(180deg); }
  .fc-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px; text-align:center; border-radius:12px;
  }
  .fc-back{ transform:rotateY(180deg); background:#FAF7F0; }
  .fc-hint{ font-size:12px; color:#8a8983; margin-top:14px; }
  .fc-controls{ display:flex; justify-content:center; gap:12px; margin-top:18px; flex-wrap:wrap; }
  .fc-btn{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:14px;
    padding:10px 22px; border-radius:999px; cursor:pointer; border:1.5px solid var(--ink);
    background:var(--card); color:var(--ink); transition:transform .12s, background .12s;
  }
  .fc-btn:hover{ transform:translateY(-1px); }
  .fc-btn.know{ background:var(--green); color:#fff; border-color:var(--green); }
  .fc-btn.repeat{ background:var(--red); color:#fff; border-color:var(--red); }

  /* ---------- Listening Mode UI ---------- */
  .listen-hero-btn{
    width:84px; height:84px; border-radius:50%; background:var(--blue);
    color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px; box-shadow:0 6px 18px rgba(30,79,163,0.35);
    transition:transform .15s ease, background .15s ease;
  }
  .listen-hero-btn:hover{ transform:scale(1.08); background:#163d80; }
  .listen-hero-btn svg{ width:40px; height:40px; fill:currentColor; }

  /* ---------- Backup & Restore UI ---------- */
  .backup-box{
    margin-top:20px; padding:18px; background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; text-align:center;
  }
  .backup-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .backup-btn{
    display:inline-flex; align-items:center; gap:6px; font-family:'Cairo',sans-serif;
    font-weight:700; font-size:13px; padding:8px 16px; border-radius:999px;
    border:1.5px solid var(--ink); background:transparent; cursor:pointer; color:var(--ink);
    transition:background .12s, color .12s;
  }
  .backup-btn:hover{ background:var(--ink); color:var(--paper); }

  /* ---------- Goal Selector in Stats ---------- */
  .goal-selector-box{
    margin-top:16px; padding:16px; background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; text-align:center;
  }
  .goal-btns{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .goal-sel-btn{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    padding:6px 16px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--card); cursor:pointer; transition:all .12s ease;
  }
  .goal-sel-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  /* ---------- Toast Notification ---------- */
  .app-toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 22px; border-radius:999px;
    font-size:14px; font-weight:700; z-index:9999; box-shadow:0 6px 20px rgba(0,0,0,0.25);
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .app-toast.show{ opacity:1; }

</style>

/* thresholds requested by user */
const THRESH = { mcq:10, written:10, article:8, plural:8 };
const UNLOCK_STEP = 5;

// "core" = the most essential/common words a learner should master first;
// the rest are "extra" bonus vocabulary. Categories can set an explicit
// `core` count; otherwise the first 20 words (already ordered by importance)
// are treated as core, or all of them if the category has fewer than 20.
function coreCountFor(cat){ return cat.core || Math.min(20, cat.words.length); }

const ORDERED_CATEGORIES = CATEGORIES.slice().sort((a,b) => (a.order||999) - (b.order||999));


/* Storage fallback: if window.storage is not available (e.g. running in standard browser), fallback to localStorage */
if(typeof window !== 'undefined' && !window.storage && typeof window.localStorage !== 'undefined'){
  window.storage = {
    get: async (key) => {
      try {
        const v = window.localStorage.getItem(key);
        return v !== null ? { value: v } : null;
      } catch(e) { return null; }
    },
    set: async (key, val) => {
      try { window.localStorage.setItem(key, val); } catch(e){}
    }
  };
}

/* ======================= STATE (persisted via window.storage) ======================= */
// progress[catId][mode] = { unlocked:Number, counts:{ wordIndex:Number } }
const PROGRESS_KEY = 'german-arabic-progress-v1';
let progress = {};
let progressReady = false;
let saveTimer = null;

async function loadProgress(){
  try{
    const res = await window.storage.get(PROGRESS_KEY, false);
    if(res && res.value) progress = JSON.parse(res.value);
  }catch(e){
    // no saved progress yet, or storage unavailable — start fresh
    progress = {};
  }
  progressReady = true;
}

// stats = { lastDate:'YYYY-MM-DD', current:N, longest:N, totalAnswered:N, totalCorrect:N }
const STATS_KEY = 'german-arabic-stats-v1';
let stats = { lastDate:null, current:0, longest:0, totalAnswered:0, totalCorrect:0 };
let statsSaveTimer = null;

async function loadStats(){
  try{
    const res = await window.storage.get(STATS_KEY, false);
    if(res && res.value) stats = Object.assign({ lastDate:null, current:0, longest:0, totalAnswered:0, totalCorrect:0 }, JSON.parse(res.value));
  }catch(e){
    stats = { lastDate:null, current:0, longest:0, totalAnswered:0, totalCorrect:0 };
  }
}

function saveStatsSoon(){
  clearTimeout(statsSaveTimer);
  statsSaveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STATS_KEY, JSON.stringify(stats), false); }
    catch(e){ /* saving failed silently; stats still work in-memory this session */ }
  }, 250);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function daysBetween(d1, d2){
  const a = new Date(d1 + 'T00:00:00');
  const b = new Date(d2 + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

// The streak the learner should actually SEE right now — if it's been more
// than a day since their last recorded activity, the streak is broken even
// though we don't overwrite the stored number until they act again.
function displayStreak(){
  if(!stats.lastDate) return 0;
  const diff = daysBetween(stats.lastDate, todayStr());
  return diff <= 1 ? stats.current : 0;
}

// Call this on every answered question, anywhere in the app (normal
// practice modes, global review, difficult bank, quiz, section review).
function recordActivity(ok){
  stats.totalAnswered = (stats.totalAnswered || 0) + 1;
  if(ok) stats.totalCorrect = (stats.totalCorrect || 0) + 1;
  const today = todayStr();
  if(stats.lastDate !== today){
    if(stats.lastDate){
      const diff = daysBetween(stats.lastDate, today);
      stats.current = (diff === 1) ? (stats.current || 0) + 1 : 1;
    } else {
      stats.current = 1;
    }
    stats.lastDate = today;
    stats.todayCount = 1;
    if(stats.current > (stats.longest || 0)) stats.longest = stats.current;
  } else {
    stats.todayCount = (stats.todayCount || 0) + 1;
  }
  saveStatsSoon();
}

// A word counts as fully "mastered" only once every mode it can be tested
// in (mcq/written, plus article for noun categories) has reached threshold.
function computeMasteredCount(){
  let count = 0;
  CATEGORIES.forEach(cat=>{
    const catProg = progress[cat.id];
    if(!catProg) return;
    const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
    for(let i=0;i<cat.words.length;i++){
      const allMastered = modes.every(m => catProg[m] && (catProg[m].counts[i]||0) >= threshFor(m));
      if(allMastered) count++;
    }
  });
  return count;
}

function saveProgressSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(PROGRESS_KEY, JSON.stringify(progress), false); }
    catch(e){ /* saving failed silently; progress still works in-memory this session */ }
  }, 250);
}

function ensureProgress(catId, mode){
  progress[catId] = progress[catId] || {};
  if(!progress[catId][mode]){
    progress[catId][mode] = { unlocked: UNLOCK_STEP, counts:{}, coreAcked:false };
  }
  return progress[catId][mode];
}
function threshFor(mode){ return THRESH[mode]; }

// true once the learner has mastered every "core" word for this mode
function coreDone(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const core = coreCountFor(cat);
  const th = threshFor(mode);
  for(let i=0;i<core;i++){
    if(mode === 'plural' && !cat.words[i].pl) continue; // no plural to test for this word
    if(getWordCount(catId,mode,i) < th) return false;
  }
  return true;
}

function getWordCount(catId, mode, idx){
  const p = ensureProgress(catId, mode);
  return p.counts[idx] || 0;
}
function setWordCount(catId, mode, idx, val){
  const p = ensureProgress(catId, mode);
  p.counts[idx] = Math.max(0, val);
  saveProgressSoon();
}

function resetAllProgress(){
  progress = {};
  saveProgressSoon();
}

// Used by the section quiz: force a word back into active practice
// across all of its normal modes when the learner gets it wrong.
function reinforceWord(catId, idx){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
  modes.forEach(m=>{
    const p = ensureProgress(catId, m);
    p.unlocked = Math.max(p.unlocked, idx+1);
    const th = threshFor(m);
    const cur = p.counts[idx] || 0;
    p.counts[idx] = Math.max(0, Math.min(cur, th - 3));
  });
  saveProgressSoon();
}

// Used by review mode: degrade only the 'plural' mode progress for one word
// (word+article progress is handled separately by reinforceWord).
function reinforcePlural(catId, idx){
  const p = ensureProgress(catId, 'plural');
  p.unlocked = Math.max(p.unlocked, idx+1);
  const th = threshFor('plural');
  const cur = p.counts[idx] || 0;
  p.counts[idx] = Math.max(0, Math.min(cur, th - 3));
  saveProgressSoon();
}

function categoryWords(catId){
  return CATEGORIES.find(c=>c.id===catId).words;
}

// Pool of {catId, idx} for every word the learner has already been
// introduced to (unlocked) in any category they've started practicing.
// Used by the global "review all" screen.
function learnedPool(){
  // A word only counts as "learned" if the learner has actually answered it
  // correctly at least once in some mode (counts[idx] > 0) — NOT just because
  // it fell inside the default "unlocked" window, which gets seeded (and can
  // get bumped) as a side effect of simply rendering progress bars on the
  // home/modes screens, even for modes the learner never actually opened.
  const pool = [];
  CATEGORIES.forEach(cat=>{
    const catProg = progress[cat.id];
    if(!catProg) return; // never opened this category at all
    const modes = cat.hasArticles ? ['mcq','written','article'] : ['mcq','written'];
    for(let i=0;i<cat.words.length;i++){
      const sources = modes.filter(m => catProg[m] && (catProg[m].counts[i]||0) > 0);
      if(sources.length) pool.push({ catId: cat.id, idx: i, sources });
    }
  });
  return pool;
}

// Pool of {catId, idx, count, th} for words the learner has attempted in a
// given mode but hasn't mastered yet (count < threshold) — including words
// that got knocked all the way down to 0 by repeated wrong answers, which
// are exactly the words worth surfacing. Sorted hardest (lowest count/th
// ratio) first. Used by the "بنك الكلمات الصعبة" difficult-words bank.
function difficultPool(mode){
  const th = threshFor(mode);
  const pool = [];
  CATEGORIES.forEach(cat=>{
    if(mode === 'article' && !cat.hasArticles) return;
    const catProg = progress[cat.id];
    if(!catProg || !catProg[mode]) return;
    const counts = catProg[mode].counts || {};
    Object.keys(counts).forEach(k=>{
      const idx = parseInt(k, 10);
      const c = counts[idx] || 0;
      if(c < th) pool.push({ catId: cat.id, idx, count: c, th });
    });
  });
  pool.sort((a,b) => (a.count/a.th) - (b.count/b.th));
  return pool;
}

function unlockedIndices(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const p = ensureProgress(catId, mode);
  const n = Math.min(p.unlocked, cat.words.length);
  return Array.from({length:n}, (_,i)=>i);
}

function activeIndices(catId, mode){
  // words currently unlocked but not yet mastered
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  let idxs = unlockedIndices(catId, mode);
  if(mode === 'plural') idxs = idxs.filter(i => cat.words[i].pl); // skip words with no plural (pl: null)
  return idxs.filter(i => getWordCount(catId,mode,i) < th);
}
function masteredUnlockedIndices(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  let idxs = unlockedIndices(catId, mode);
  if(mode === 'plural') idxs = idxs.filter(i => cat.words[i].pl);
  return idxs.filter(i => getWordCount(catId,mode,i) >= th);
}

function maybeUnlockMore(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const p = ensureProgress(catId, mode);
  while(activeIndices(catId, mode).length === 0 && p.unlocked < cat.words.length){
    p.unlocked = Math.min(p.unlocked + UNLOCK_STEP, cat.words.length);
  }
}

function categoryProgressPct(catId, mode){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const th = threshFor(mode);
  const words = mode === 'plural' ? cat.words.filter(w=>w.pl) : cat.words;
  if(words.length === 0) return 0;
  let sum = 0;
  cat.words.forEach((w,i)=>{ if(mode!=='plural' || w.pl) sum += Math.min(getWordCount(catId,mode,i), th); });
  return Math.round((sum / (words.length*th)) * 100);
}


function normalizeAr(s){
  if(!s) return '';
  return s.trim().toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/[أإآ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[\s\-_]+/g, ' ');
}

function streakUnit(n){
  if(n === 1) return 'يوم';
  if(n === 2) return 'يومان';
  if(n >= 3 && n <= 10) return 'أيام';
  return 'يوم';
}

function sentenceLine(w){
  if(!w || !w.s) return '';
  const safeText = (w.s || '').replace(/'/g, "\\'");
  return `
    <div class="fb-sentence">
      <div class="fb-sentence-de de">
        <span>${w.s}</span>
        <button class="mini-speak" onclick="event.stopPropagation();speak('${safeText}')" title="استمع للجملة">
          ${MINI_SPEAK_SVG}
        </button>
      </div>
      <div class="fb-sentence-ar">${w.sar || ''}</div>
    </div>`;
}

/* ======================= SPEECH ======================= */
let deVoice = null;
function loadVoices(){
  const voices = speechSynthesis.getVoices();
  const deVoices = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('de'));
  // Web Speech API has no standard "gender" field, so we use a best-effort
  // heuristic: prefer German voices whose name matches common male voice
  // identifiers used by browsers/OSes (e.g. "Markus" on macOS/iOS German).
  const maleHints = ['markus','stefan','yannick','conrad','klaus','hans','daniel','viktor','male','männlich'];
  deVoice = deVoices.find(v => maleHints.some(h => v.name.toLowerCase().includes(h))) || deVoices[0] || null;
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    if(deVoice) u.voice = deVoice;
    u.rate = 0.92;
    speechSynthesis.speak(u);
  }catch(e){ /* audio not critical */ }
}

function showToast(msg){
  let t = document.getElementById('appToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'appToast';
    t.className = 'app-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2500);
}

function genderTag(article){
  if(!article) return '';
  const a = article.toLowerCase().trim();
  return `<span class="gender-tag ${a}">${a}</span>`;
}
function colorArticle(article){
  return genderTag(article);
}

/* ---------- Leitner Spaced Repetition System (SRS) ---------- */
const SRS_INTERVALS = [1, 3, 7, 14, 30]; // days per box (0, 1, 2, 3, 4)
let srsStore = {};
async function loadSrs(){
  try {
    const raw = (window.localStorage && window.localStorage.getItem('deutsch_srs_v1')) || '{}';
    srsStore = JSON.parse(raw);
  } catch(e){
    srsStore = {};
  }
}
function saveSrsSoon(){
  try {
    if(window.localStorage){
      window.localStorage.setItem('deutsch_srs_v1', JSON.stringify(srsStore));
    }
  } catch(e){}
}
function addDaysToStr(dateStr, numDays){
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + numDays);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function updateSrs(catId, idx, ok){
  const k = `${catId}_${idx}`;
  const now = todayStr();
  const rec = srsStore[k] || { box: 0, lastDate: now, nextDate: now };
  if(ok){
    rec.box = Math.min((rec.box || 0) + 1, SRS_INTERVALS.length - 1);
  } else {
    rec.box = 0;
  }
  const interval = SRS_INTERVALS[rec.box];
  rec.lastDate = now;
  rec.nextDate = addDaysToStr(now, interval);
  srsStore[k] = rec;
  saveSrsSoon();
}
function srsDuePool(){
  const now = todayStr();
  const pool = [];
  CATEGORIES.forEach(c => {
    c.words.forEach((w, idx) => {
      const k = `${c.id}_${idx}`;
      const rec = srsStore[k];
      if(rec && rec.nextDate && rec.nextDate <= now){
        pool.push({ catId: c.id, cat: c, idx, word: w, box: rec.box + 1 });
      }
    });
  });
  return pool;
}
function getSrsDueWords(){ return srsDuePool(); }

/* ---------- Backup & Restore ---------- */
function exportBackup(){
  try {
    const backupData = {
      version: 2,
      exportDate: new Date().toISOString(),
      progress: progress || {},
      stats: stats || {},
      starred: Array.from(starredSet),
      srs: srsStore || {},
      dailyGoal: getDailyGoal()
    };
    const jsonStr = JSON.stringify(backupData, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `deutsch_lernen_backup_${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('تم تصدير النسخة الاحتياطية بنجاح 📥');
  } catch(e){
    alert('حدث خطأ أثناء تصدير النسخة الاحتياطية: ' + e.message);
  }
}

function importBackup(jsonStr){
  try {
    const data = JSON.parse(jsonStr);
    if(!data || (!data.progress && !data.stats)){
      throw new Error('ملف النسخة الاحتياطية غير صالح.');
    }
    if(data.progress){
      progress = data.progress;
      if(window.localStorage) window.localStorage.setItem('deutsch_lern_v1', JSON.stringify(progress));
    }
    if(data.stats){
      stats = data.stats;
      if(window.localStorage) window.localStorage.setItem('deutsch_stats_v1', JSON.stringify(stats));
    }
    if(data.starred){
      starredSet = new Set(data.starred);
      saveStarredSoon();
    }
    if(data.srs){
      srsStore = data.srs;
      saveSrsSoon();
    }
    if(data.dailyGoal){
      if(window.localStorage) window.localStorage.setItem('deutsch_daily_goal_v1', String(data.dailyGoal));
    }
    showToast('تمت استعادة النسخة الاحتياطية بنجاح 🎉');
    render();
  } catch(e){
    alert('فشل استيراد النسخة الاحتياطية: ' + e.message);
  }
}

function triggerImportBackup(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => importBackup(ev.target.result);
    reader.readAsText(file);
  };
  input.click();
}

function applyUmlaut(word){
  const m = word.match(/[aouAOU]/g);
  if(!m) return word;
  const lastVowel = m[m.length-1];
  const lastIdx = word.lastIndexOf(lastVowel);
  const rep = { 'a':'ä', 'o':'ö', 'u':'ü', 'A':'Ä', 'O':'Ö', 'U':'Ü' }[lastVowel];
  return word.slice(0, lastIdx) + rep + word.slice(lastIdx+1);
}

function pluralDistractors(singular, correctFull){
  const correct = correctFull ? correctFull.replace(/^die\s+/i,'') : '';
  const forms = [
    singular,
    singular + 'n',
    singular + 'en',
    singular + 's',
    singular + 'e',
    singular + 'er',
    applyUmlaut(singular),
    applyUmlaut(singular) + 'e',
    applyUmlaut(singular) + 'er'
  ];
  return Array.from(new Set(forms))
    .filter(f => f && f !== correct && f !== singular)
    .slice(0, 3)
    .map(f => 'die ' + f);
}

/* ======================= SEARCH ACROSS ALL 30 SECTIONS ======================= */
function searchVocabulary(query){
  const q = query.trim();
  if(!q) return [];
  const qDe = normalizeDe(q);
  const qAr = normalizeAr(q);

  const results = [];
  CATEGORIES.forEach(cat => {
    cat.words.forEach((w, idx) => {
      const fullDe = cat.hasArticles && w.a ? `${w.a} ${w.n}` : w.n;
      const wDeNorm = normalizeDe(fullDe);
      const nDeNorm = normalizeDe(w.n);
      const wArNorm = normalizeAr(w.ar || '');
      const sDeNorm = normalizeDe(w.s || '');
      const sArNorm = normalizeAr(w.sar || '');
      const plNorm = w.pl ? normalizeDe(w.pl) : '';
      const catDeNorm = normalizeDe(cat.de);
      const catArNorm = normalizeAr(cat.ar);

      let matched = false;

      if(wDeNorm.includes(qDe) || nDeNorm.includes(qDe)){
        matched = true;
      } else if(wArNorm.includes(qAr)){
        matched = true;
      } else if(plNorm && plNorm.includes(qDe)){
        matched = true;
      } else if(sDeNorm.includes(qDe) || sArNorm.includes(qAr)){
        matched = true;
      } else if(catArNorm.includes(qAr) || catDeNorm.includes(qDe)){
        matched = true;
      }

      if(matched){
        results.push({
          cat,
          catId: cat.id,
          idx,
          word: w,
          fullDe
        });
      }
    });
  });
  return results;
}

      </div>
      <div class="search-res-list">${itemsHtml}</div>
    `;

    // Click handler for search items: navigate directly to word in its section

        const catId = el.dataset.cat;

        go({ screen:'wordlist', catId, highlightIdx: idx, fromSearch: true });
      });
    });

    sPanel.querySelectorAll('.mini-speak[data-speak]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        speak(btn.dataset.speak);
      });
    });
  }

  sInput.addEventListener('input', doSearch);
  sClear.addEventListener('click', () => {

    el.addEventListener('click', ()=> go({screen:'modes', catId: el.dataset.cat, fromSearch:false}));

/* ------------ exercise engine ------------ */
function pickQuestionIndex(catId, mode){
  maybeUnlockMore(catId, mode);
  const active = activeIndices(catId, mode);
  const mastered = masteredUnlockedIndices(catId, mode);
  if(active.length === 0 && mastered.length === 0) return null; // done entirely
  // 20% chance to review an already-mastered (unlocked) word if any exist
  if(mastered.length > 0 && active.length > 0 && Math.random() < 0.2){
    return { idx: mastered[Math.floor(Math.random()*mastered.length)], review:true };
  }
  if(active.length === 0){
    return { idx: mastered[Math.floor(Math.random()*mastered.length)], review:true };
  }
  return { idx: active[Math.floor(Math.random()*active.length)], review:false };
}

function normalizeDe(s){
  return s.trim().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
}

function modeLabel(mode){
  return mode==='mcq' ? 'اختيار من متعدد' : mode==='written' ? 'الكتابة' : mode==='article' ? 'أداة التعريف' : mode==='plural' ? 'صيغة الجمع' : mode==='review' ? 'مراجعة القسم' : 'اختبار القسم';
}

function renderExercise(){
  if(view.mode === 'globalMcq') return renderGlobalReviewStep('mcq');
  if(view.mode === 'globalWritten') return renderGlobalReviewStep('written');
  if(view.mode === 'diffMcq') return renderDifficultStep('mcq');
  if(view.mode === 'diffWritten') return renderDifficultStep('written');
  if(view.mode === 'srsReview') return renderSrsReviewStep();
  if(view.mode === 'starredReview') return renderStarredReviewStep();
  const cat = CATEGORIES.find(c=>c.id===view.catId);
  const mode = view.mode;
  if(mode === 'quiz') return renderQuiz(cat);
  if(mode === 'review') return renderReviewCat(cat);
  const words = cat.words;
  const th = threshFor(mode);

  // "stop notification": once the learner masters all core words for this
  // mode, pause once to celebrate and offer moving on before extras appear.
  const core = coreCountFor(cat);
  const p = ensureProgress(cat.id, mode);
  if(!p.coreAcked && core < words.length && coreDone(cat.id, mode)){
    const orderedIdx = ORDERED_CATEGORIES.findIndex(c=>c.id===cat.id);
    const nextCat = ORDERED_CATEGORIES[orderedIdx+1];
    app.innerHTML = `
      ${headerHtml(true,'رجوع لأوضاع القسم')}
      <div class="cat-title"><h2>${cat.ar}</h2><span class="de">${modeLabel(mode)} · ${cat.de}${miniSpeak(speakText(cat))}</span></div>
      <div class="done-card">
        <h2>🌟 أتقنت أهم ${core} كلمة في هذا القسم!</h2>
        <p>تقدر تكمّل الـ${words.length-core} كلمة الإضافية دلوقتي، أو تنتقل للقسم اللي بعده وترجع تكمّلهم في أي وقت — تقدمك محفوظ.</p>
      </div>
      <div class="next-row" style="flex-direction:column;gap:10px;">
        <button class="backbtn" id="continueExtra" style="width:100%;">كمّل الكلمات الإضافية دلوقتي</button>
        ${nextCat ? `<button class="backbtn" id="goNextCat" style="width:100%;">روح لقسم "${nextCat.ar}" التالي</button>` : ''}
      </div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> go({screen:'modes'}));
    document.getElementById('continueExtra').addEventListener('click', ()=>{
      p.coreAcked = true; saveProgressSoon(); renderExercise();
    });
    const nextBtn2 = document.getElementById('goNextCat');
    if(nextBtn2) nextBtn2.addEventListener('click', ()=>{
      p.coreAcked = true; saveProgressSoon(); go({screen:'modes', catId: nextCat.id});
    });
    return;
  }

  const pick = pickQuestionIndex(cat.id, mode);
  const dotsIdx = unlockedIndices(cat.id, mode).filter(i => getWordCount(cat.id,mode,i) < th);
  const dotsHtml = (dotsIdx.length? dotsIdx : unlockedIndices(cat.id,mode)).slice(0,5).map(i=>{
    const pct = Math.min(100, Math.round((getWordCount(cat.id,mode,i)/th)*100));
    return `<div class="dot"><i style="width:${pct}%;background:${PALETTE[1]}"></i></div>`;
  }).join('');

  if(pick === null){
    app.innerHTML = `
      ${headerHtml(true,'رجوع للأقسام')}
      <div class="cat-title"><h2>${cat.ar}</h2><span class="de">${cat.de}${miniSpeak(speakText(cat))}</span></div>
      <div class="done-card">
        <h2>🎉 أتقنت كل كلمات هذا القسم في هذا التمرين</h2>
        <p>جرّب وضعًا آخر لنفس القسم أو انتقل إلى قسم جديد.</p>
      </div>
      <div class="next-row"><button class="backbtn" id="toModes">أوضاع أخرى لهذا القسم</button></div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> go({screen:'home'}));
    document.getElementById('toModes').addEventListener('click', ()=> go({screen:'modes'}));
    return;
  }

  const idx = pick.idx;
  const w = words[idx];
  exState = { catId: cat.id, mode, idx, answered:false };

  app.innerHTML = `
    ${headerHtml(true,'رجوع لأوضاع القسم')}
    <div class="cat-title"><h2>${cat.ar}</h2><span class="de">${modeLabel(mode)} · ${cat.de}${miniSpeak(speakText(cat))}</span></div>
    <div class="progress-dots">${dotsHtml}</div>
    <div id="qzone"></div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> go({screen:'modes'}));
  renderQuestion(cat, mode, idx, w);
}

/* ------------ section quiz: all words shuffled, one full pass ------------ */
function renderQuiz(cat){
  if(!exState || exState.catId !== cat.id || exState.mode !== 'quiz'){
    exState = {
      catId: cat.id, mode:'quiz',
      queue: shuffle(cat.words.map((_,i)=>i)),
      pos: 0, correct: 0, wrongCount: 0, answered:false
    };
  }
  const total = exState.queue.length;

  if(exState.pos >= total){
    const pct = Math.round((exState.correct/total)*100);
    app.innerHTML = `
      ${headerHtml(true,'رجوع لأوضاع القسم')}
      <div class="cat-title"><h2>${cat.ar}</h2><span class="de">نتيجة اختبار القسم · ${cat.de}${miniSpeak(speakText(cat))}</span></div>
      <div class="done-card">

    `;

    document.getElementById('retryQuiz').addEventListener('click', ()=>{ exState = null; renderExercise(); });
    return;
  }

  const idx = exState.queue[exState.pos];
  const w = cat.words[idx];
  exState.answered = false;

  app.innerHTML = `
    ${headerHtml(true,'رجوع لأوضاع القسم')}
    <div class="cat-title"><h2>${cat.ar}</h2><span class="de">اختبار القسم · ${exState.pos+1} / ${total} · ${cat.de}${miniSpeak(speakText(cat))}</span></div>
    <div id="qzone"></div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> go({screen:'modes'}));

  const zone = document.getElementById('qzone');
  const correctText = cat.hasArticles ? `${w.a} ${w.n}` : w.n;
  const pool = cat.words.filter((_,i)=>i!==idx);
  const distractors = shuffle(pool).slice(0,3).map(d => cat.hasArticles ? `${d.a} ${d.n}` : d.n);
  const options = shuffle([correctText, ...distractors]);
  zone.innerHTML = `
    <div class="qcard">
      <div class="qlabel">ما هي الكلمة الألمانية الصحيحة؟</div>
      <div class="qmain">${w.ar}</div>
    </div>
    <div class="options">${options.map(o=>`<div class="opt de" data-val="${o}">${o}</div>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="next-row"><button class="next-btn" id="nextBtn">${exState.pos+1 < total ? 'التالي ←' : 'عرض النتيجة'}</button></div>
  `;
  zone.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(exState.answered) return;
      exState.answered = true;
      const chosen = el.dataset.val;
      const ok = chosen === correctText;
      zone.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('disabled');
        if(o.dataset.val === correctText) o.classList.add('correct');
        else if(o === el) o.classList.add('wrong');
      });
      if(ok){ exState.correct++; }
      else { exState.wrongCount++; reinforceWord(cat.id, idx); }
      recordActivity(ok);
      speak(correctText);
      const fb = document.getElementById('fb');
      fb.innerHTML = buildFeedbackHtml(w, cat, ok, correctText, false, 'quiz');
      document.getElementById('nextBtn').classList.add('show');
    });
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ exState.pos++; renderQuiz(cat); });
}

// ---- Review mode (per-category "مراجعة القسم" and global "مراجعة شاملة") ----
// Each word is tested in up to 2 back-to-back steps: (1) the word + its
// article, (2) its plural form — or, for words with no plural, a "لا يوجد
// جمع" option mixed in with real plurals from the same category, which
// specifically drills the "not every noun has a plural" lesson.
const NO_PLURAL_LABEL = 'لا يوجد جمع لهذه الكلمة';

function reviewTotalQ(queue){
  return queue.reduce((sum, it) => {
    const c = CATEGORIES.find(x => x.id === it.catId);
    return sum + (c.hasArticles ? 2 : 1);
  }, 0);
}

function renderReviewCat(cat){
  if(!exState || exState.kind !== 'catReview' || exState.catId !== cat.id){
    const queue = shuffle(cat.words.map((_,i)=>({ catId: cat.id, idx: i })));
    exState = { kind:'catReview', catId:cat.id, queue, pos:0, stage:0, correct:0, wrongCount:0, answered:false, totalQ: reviewTotalQ(queue) };
  }
  renderReviewScreen({
    backScreen:'modes', backLabel:'رجوع لأوضاع القسم',
    headerTitle: cat.ar,
    headerSub: `مراجعة القسم · ${cat.de}${miniSpeak(speakText(cat))}`,
    emptyMsg: 'مفيش كلمات في هذا القسم لسه.',
    rebuild: ()=>{ exState = null; renderReviewCat(cat); }
  });
}

function renderReviewScreen(opts){
  const queue = exState.queue;

  if(queue.length === 0){
    app.innerHTML = `
      ${headerHtml(true, opts.backLabel)}
      <div class="cat-title"><h2>${opts.headerTitle}</h2></div>
      <div class="done-card"><h2>مفيش كلمات كفاية للمراجعة لسه</h2><p>${opts.emptyMsg}</p></div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> go({screen: opts.backScreen}));
    return;
  }

  if(exState.pos >= queue.length){
    const pct = Math.round((exState.correct / exState.totalQ) * 100);
    app.innerHTML = `
      ${headerHtml(true, opts.backLabel)}
      <div class="cat-title"><h2>${opts.headerTitle}</h2><span style="display:block;font-size:14px;color:#6b6a66;margin-top:4px;">نتيجة المراجعة</span></div>
      <div class="done-card">
        <h2>${exState.correct} / ${exState.totalQ} إجابة صحيحة (${pct}%)</h2>
        <p>${exState.wrongCount ? `${exState.wrongCount} سؤال غلط رجّع كلماته للتدريب العادي عشان تراجعها.` : 'ممتاز! أجبت صح على كل حاجة في المراجعة 🎉'}</p>
      </div>
      <div class="next-row"><button class="backbtn" id="retryReview">إعادة المراجعة</button></div>
    `;
    document.getElementById('backBtn').addEventListener('click', ()=> go({screen: opts.backScreen}));
    document.getElementById('retryReview').addEventListener('click', opts.rebuild);
    return;
  }

  const item = queue[exState.pos];
  const cat = CATEGORIES.find(c => c.id === item.catId);
  const idx = item.idx;
  const w = cat.words[idx];
  exState.answered = false;
  const stageLabel = cat.hasArticles ? ` · خطوة ${exState.stage+1} من 2` : '';

  app.innerHTML = `
    ${headerHtml(true, opts.backLabel)}
    <div class="cat-title"><h2>${opts.headerTitle}</h2><span style="display:block;font-size:14px;color:#6b6a66;margin-top:4px;">${opts.headerSub} · كلمة ${exState.pos+1} / ${queue.length}${stageLabel}</span></div>
    <div id="qzone"></div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> go({screen: opts.backScreen}));
  const zone = document.getElementById('qzone');
  const isLast = exState.pos+1 >= queue.length;

  function goNext(){
    if(exState.stage === 0 && cat.hasArticles){
      exState.stage = 1;
    } else {
      exState.pos++;
      exState.stage = 0;
    }
    renderReviewScreen(opts);
  }

  if(exState.stage === 0){
    const correctText = cat.hasArticles ? `${w.a} ${w.n}` : w.n;
    const pool = cat.words.filter((_,i)=>i!==idx);
    let distractors = shuffle(pool).slice(0,3).map(d => cat.hasArticles ? `${d.a} ${d.n}` : d.n);
    if(distractors.length < 3){
      const others = CATEGORIES.filter(c => c.id!==cat.id && c.hasArticles===cat.hasArticles)
        .flatMap(c => c.words.map(d => cat.hasArticles ? `${d.a} ${d.n}` : d.n));
      distractors = shuffle([...distractors, ...shuffle(others)]).slice(0,3);
    }
    const options = shuffle([correctText, ...distractors]);
    const willBeLastStep = !cat.hasArticles && isLast;
    const srcTag = item.sources && item.sources.length
      ? `<div style="font-size:12px;color:#8a8983;margin-top:6px;">📍 اتعلمتها في: ${item.sources.map(modeLabel).join(' + ')}</div>` : '';
    zone.innerHTML = `
      <div class="qcard">
        <div class="qlabel">ما هي الكلمة الألمانية الصحيحة؟</div>
        <div class="qmain">${w.ar}</div>
        ${srcTag}
      </div>
      <div class="options">${options.map(o=>`<div class="opt de" data-val="${o}">${o}</div>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="next-row"><button class="next-btn" id="nextBtn">${willBeLastStep ? 'عرض النتيجة' : 'التالي ←'}</button></div>
    `;
    zone.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(exState.answered) return;
        exState.answered = true;
        const chosen = el.dataset.val;
        const ok = chosen === correctText;
        zone.querySelectorAll('.opt').forEach(o=>{
          o.classList.add('disabled');
          if(o.dataset.val === correctText) o.classList.add('correct');
          else if(o === el) o.classList.add('wrong');
        });
        if(ok){ exState.correct++; } else { exState.wrongCount++; reinforceWord(cat.id, idx); }
        recordActivity(ok);
        speak(correctText);
        const fb = document.getElementById('fb');
        fb.innerHTML = (ok ? `إجابة صحيحة! ${correctText}` : `إجابة غير صحيحة، الصحيحة هي: ${correctText}`) + noteLine(w) + sentenceLine(w);
        fb.className = 'feedback ' + (ok?'ok':'bad');
        document.getElementById('nextBtn').classList.add('show');
      });
    });
    document.getElementById('nextBtn').addEventListener('click', goNext);
    return;
  }

  // stage 1 — plural (only reached when cat.hasArticles is true)
  let correctText, options;
  if(w.pl){
    correctText = w.pl;
    const distractors = pluralDistractors(w.n, correctText);
    options = shuffle([correctText, ...distractors]);
  } else {
    correctText = NO_PLURAL_LABEL;
    const candidates = cat.words.filter((x,i)=> i!==idx && x.pl).map(x=>x.pl);
    const distractors = shuffle(candidates).slice(0,3);
    options = shuffle([correctText, ...distractors]);
  }
  zone.innerHTML = `
    <div class="qcard">
      <div class="qlabel">إيه صيغة الجمع الصحيحة لهذه الكلمة؟</div>
      <div class="qmain de">${w.a} ${w.n}</div>
      <div class="qsub">${w.ar}</div>
    </div>
    <div class="options">${options.map(o=>`<div class="opt ${o===NO_PLURAL_LABEL?'':'de'}" data-val="${o}">${o}</div>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="next-row"><button class="next-btn" id="nextBtn">${isLast ? 'عرض النتيجة' : 'التالي ←'}</button></div>
  `;
  zone.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(exState.answered) return;
      exState.answered = true;
      const chosen = el.dataset.val;
      const ok = chosen === correctText;
      zone.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('disabled');
        if(o.dataset.val === correctText) o.classList.add('correct');
        else if(o === el) o.classList.add('wrong');
      });
      if(ok){ exState.correct++; } else { exState.wrongCount++; if(w.pl) reinforcePlural(cat.id, idx); }
      speak(w.pl || w.n);
      const fb = document.getElementById('fb');
      fb.innerHTML = (ok ? `إجابة صحيحة! ${correctText}` : `إجابة غير صحيحة، الصحيحة هي: ${correctText}`) + noteLine(w) + sentenceLine(w);
      fb.className = 'feedback ' + (ok?'ok':'bad');
      document.getElementById('nextBtn').classList.add('show');
    });
  });
  document.getElementById('nextBtn').addEventListener('click', goNext);
}

  } else if(exState.answered){
    if(exState.lastOk) exState.correct++; else exState.wrongCount++;
    exState.pos++;
    exState.answered = false;

  if(queue.length === 0){

function renderQuestion(cat, mode, idx, w){
  const zone = document.getElementById('qzone');

  // ---------- LISTENING COMPREHENSION MODE ----------
  if(mode === 'listen'){
    const correctDe = cat.hasArticles && w.a ? `${w.a} ${w.n}` : w.n;
    const pool = cat.words.filter((_,i)=>i!==idx);
    const distractors = shuffle(pool).slice(0,3).map(d => d.ar);
    const options = shuffle([w.ar, ...distractors]);
    
    zone.innerHTML = `
      <div class="qcard">
        <div class="qlabel">استمع للصوت واختر المعنى العربي الصحيح</div>
        <button class="listen-hero-btn" id="listenPlayBtn" title="استمع مجددًا">${MINI_SPEAK_SVG}</button>
        <div style="font-size:13px;color:#8a8983;">اضغط على الزر أو حرف [R] للاستماع مرة أخرى</div>
      </div>
      <div class="options">
        ${options.map((o,i)=>`<div class="opt" data-val="${o}"><span>${o}</span> <span class="kbd-key">${i+1}</span></div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="next-row"><button class="next-btn" id="nextBtn">التالي ← <span class="kbd-key">↵</span></button></div>
    `;

    setTimeout(()=> speak(correctDe), 150);
    const lBtn = document.getElementById('listenPlayBtn');
    if(lBtn) lBtn.addEventListener('click', ()=> speak(correctDe));

    zone.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(exState.answered) return;
        exState.answered = true;
        const chosen = el.dataset.val;
        const ok = chosen === w.ar;
        zone.querySelectorAll('.opt').forEach(o=>{
          o.classList.add('disabled');
          if(o.dataset.val === w.ar) o.classList.add('correct');
          else if(o === el) o.classList.add('wrong');
        });
        applyResult(cat.id, mode, idx, ok);
        speak(correctDe);
        const fb = document.getElementById('fb');
        fb.innerHTML = buildFeedbackHtml(w, cat, ok, correctDe, false);
        const nb = document.getElementById('nextBtn');
        if(nb) nb.classList.add('show');

    });

  // ---------- MCQ MODE ----------
  if(mode === 'mcq'){

    const distractors = shuffle(pool).slice(0,3).map(d => cat.hasArticles ? `${d.a} ${d.n}` : d.n);
    const options = shuffle([correctText, ...distractors]);

        ${options.map((o,i)=>`<div class="opt de" data-val="${o}"><span>${o}</span> <span class="kbd-key">${i+1}</span></div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="next-row"><button class="next-btn" id="nextBtn">التالي ← <span class="kbd-key">↵</span></button></div>
    `;
    zone.querySelectorAll('.opt').forEach(el=>{

        const nb = document.getElementById('nextBtn');
        if(nb) nb.classList.add('show');

        if(nb) nb.classList.add('show');

    });
  }

  // ---------- PLURAL MODE ----------
  if(mode === 'plural'){
    const correctText = w.pl;
    const distractors = pluralDistractors(w.n, correctText);
    const options = shuffle([correctText, ...distractors]);
    zone.innerHTML = `
      <div class="qcard">
        <div class="qlabel">إيه صيغة الجمع الصحيحة؟</div>

    zone.querySelectorAll('.opt').forEach(el=>{

        const nb = document.getElementById('nextBtn');
        if(nb) nb.classList.add('show');
      });
    });
  }

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=> renderExercise());

function applyResult(catId, mode, idx, ok){
  if(exState && (exState.kind === 'globalStep' || exState.kind === 'diffStep' || exState.kind === 'srsStep' || exState.kind === 'starStep')) exState.lastOk = ok;
  updateSrs(catId, idx, ok);
  recordActivity(ok);
  const th = threshFor(mode);
  const cur = getWordCount(catId, mode, idx);
  if(ok){
    setWordCount(catId, mode, idx, Math.min(th, cur + 1));
  } else {
    // wrong: if it was mastered (review), demote it back into active practice
    // otherwise just reset streak-ish progress down a bit (not to zero, to avoid discouragement)
    if(cur >= th){
      setWordCount(catId, mode, idx, Math.max(0, th - 3));
    } else {
      setWordCount(catId, mode, idx, Math.max(0, cur - 1));
    }
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}


/* ======================= DESKTOP KEYBOARD SHORTCUTS ======================= */
window.addEventListener('keydown', e => {
  // If typing in written practice input, don't hijack keys
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

  // Options shortcuts: 1, 2, 3, 4
  if(['1','2','3','4'].includes(e.key)){
    const idx = parseInt(e.key, 10) - 1;
    // In exercise mode
    const opts = document.querySelectorAll('#qzone .options .opt, #qzone .article-options .opt');
    if(opts && opts[idx] && !opts[idx].classList.contains('disabled')){
      e.preventDefault();
      opts[idx].click();
    }
  }

  // Next / advance shortcut: Enter or Space
  if(e.key === 'Enter' || e.key === ' '){
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn && nextBtn.classList.contains('show')){
      e.preventDefault();
      nextBtn.click();
    }
  }

  // R or S: replay audio
  if(e.key.toLowerCase() === 'r' || e.key.toLowerCase() === 's'){
    const spk = document.querySelector('#qzone .listen-hero-btn, #qzone .mini-speak, #qzone .speak-btn');
    if(spk){
      e.preventDefault();
      spk.click();
    }
  }

  // Flashcards shortcuts
  if(view.screen === 'flashcards'){
    if(e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      flipFlashcard();
    } else if(e.key === '1'){
      e.preventDefault();
      const b = document.getElementById('fcKnowBtn');
      if(b) b.click();
    } else if(e.key === '2'){
      e.preventDefault();
      const b = document.getElementById('fcRepeatBtn');
      if(b) b.click();
    }
  }
});


async function init(){
  app.innerHTML = `<div class="done-card"><h2>...جارِ تحميل تقدّمك</h2></div>`;
  await Promise.all([loadProgress(), loadStats(), loadStarred(), loadSrs()]);
  render();
}
init();
</script>
</body>
</html>
