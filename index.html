    const lBtn = document.getElementById('listenPlayBtn');
    if(lBtn) lBtn.addEventListener('click', ()=> speak(correctDe));

    zone.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(exState.answered) return;
        exState.answered = true;
        const chosen = el.dataset.val;
        const ok = chosen === w.ar;
        zone.querySelectorAll('.opt').forEach(o=>{
          o.classList.add('disabled');
          if(o.dataset.val === w.ar) o.classList.add('correct');
          else if(o === el) o.classList.add('wrong');
        });
        applyResult(cat.id, mode, idx, ok);

        if(nb) nb.classList.add('show');
      });
    });
  }

  // ---------- MCQ MODE ----------
  if(mode === 'mcq'){
    const correctText = cat.hasArticles ? `${w.a} ${w.n}` : w.n;
    const distractors = buildMcqDistractors(cat, idx, 3);

        ${options.map((o,i)=>`<div class="opt de" lang="de" dir="ltr" data-val="${escapeAttr(o)}"><span>${escapeHtml(o)}</span> <span class="kbd-key">${i+1}</span></div>`).join('')}

    `;
    zone.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(exState.answered) return;
        exState.answered = true;
        const chosen = el.dataset.val;
        const ok = chosen === correctText;
        zone.querySelectorAll('.opt').forEach(o=>{
          o.classList.add('disabled');
          if(o.dataset.val === correctText) o.classList.add('correct');
          else if(o === el) o.classList.add('wrong');
        });
        applyResult(cat.id, mode, idx, ok);
        speak(correctText);
        const fb = document.getElementById('fb');
        fb.innerHTML = buildFeedbackHtml(w, cat, ok, correctText, false);
        const nb = document.getElementById('nextBtn');
        if(nb) nb.classList.add('show');
      });
    });
  }

  // ---------- WRITTEN MODE ----------
  if(mode === 'written'){
    // Skip button is only visible in the category written exercise (not global/diff/SRS/starred review)
    const isCatWritten = !exState.kind;
    zone.innerHTML = `
      <div class="qcard">
        <div class="qlabel">اكتب الكلمة بالألمانية</div>
        <div class="qmain">${escapeHtml(w.ar)}</div>

    const input = document.getElementById('wIn');
    if(input) input.focus();
    renderUmlautBar(input);
    const correctText = `${w.a?w.a+' ':''}${w.n}`;
    function submit(){
      if(exState.answered) return;
      const val = input.value.trim();
      if(!val) return;
      exState.answered = true;
      const evalRes = evaluateWrittenAnswer(val, w, cat);
      const ok = evalRes.ok;
      applyResult(cat.id, mode, idx, ok);
      speak(correctText);
      const fb = document.getElementById('fb');
      let fbHtml = buildFeedbackHtml(w, cat, ok, correctText, false);
      if(!ok && evalRes.missingArticle){
        fbHtml += `<div class="fbnote" style="margin-top:6px;">تنبيه: الكلمة صحيحة لكن لازم تكتب أداة التعريف (der / die / das) معها.</div>`;

      if(ok && evalRes.isSynonym){
        fbHtml += `<div class="fbnote" style="margin-top:6px;">مقبول أيضاً. الكلمة المطلوبة: ${escapeHtml(w.n)}</div>`;
      }
      fb.innerHTML = fbHtml;
      if(typeof input.blur === 'function') input.blur();
      input.disabled = true;
      document.getElementById('wSub').disabled = true;
      zone.querySelectorAll('.umlaut-btn').forEach(b => { b.disabled = true; });
      const skipBtn = document.getElementById('skipWordBtn');
      if(skipBtn) skipBtn.style.display = 'none';
      const nb = document.getElementById('nextBtn');
      if(nb) nb.classList.add('show');
    }
    document.getElementById('wSub').addEventListener('click', submit);
    input.addEventListener('keydown', e=>{
      if(e.repeat) return;
      if(e.key === 'Enter'){
        e.preventDefault();
        submit();
      }
    });

    // Skip button handler — only wired when the element is present (isCatWritten)
    const skipWordBtn = document.getElementById('skipWordBtn');
    if(skipWordBtn){
      skipWordBtn.addEventListener('click', ()=>{
        if(exState.answered) return;
        const th = threshFor(mode);
        const prevCount = getWordCount(cat.id, mode, idx);
        // Set this word's written counter to mastery threshold via setWordCount
        setWordCount(cat.id, mode, idx, th);
        maybeUnlockMore(cat.id, mode);
        // Move to next question
        renderExercise();
        // Show undo toast (6 s) — does NOT call recordActivity
        showToastWithAction('تم تخطّي الكلمة', 'تراجع', ()=>{
          // Undo: restore saved counter (always safe regardless of current screen)
          // Note: undo restores the counter but does not re-lock words that the skip unlocked (harmless).
          setWordCount(cat.id, mode, idx, prevCount);
          // Only re-render if learner is still on the exact same category written exercise.
          // Note: renderExercise passes exState.idx as lastIdx to pickQuestionIndex,
          // so after undo a DIFFERENT active word may appear; that is acceptable.
          const stillSameExercise = view && view.screen === 'exercise' && view.catId === cat.id && view.mode === 'written' && (!exState || !exState.kind);
          if(stillSameExercise){
            maybeUnlockMore(cat.id, mode);
            exState = { catId: cat.id, mode, idx, answered: false };

        });

        speak(`${correctArt} ${w.n}`);
        const fb = document.getElementById('fb');
        fb.innerHTML = buildFeedbackHtml(w, cat, ok, `${correctArt} ${w.n}`, false);
        const nb = document.getElementById('nextBtn');
        if(nb) nb.classList.add('show');
      });
    });
  }

  // ---------- PLURAL MODE ----------
  if(mode === 'plural'){
    const correctText = w.pl;
    const distractors = pluralDistractors(w, cat);
    const options = shuffle([correctText, ...distractors]);
    zone.innerHTML = `
      <div class="qcard">
        <div class="qlabel">إيه صيغة الجمع الصحيحة؟</div>
        <div class="qmain de" lang="de" dir="ltr">${escapeHtml(w.a)} ${escapeHtml(w.n)}</div>
        <div class="qsub">${escapeHtml(w.ar)}</div>
      </div>
      <div class="options">
        ${options.map((o,i)=>`<div class="opt de" lang="de" dir="ltr" data-val="${escapeAttr(o)}"><span>${escapeHtml(o)}</span> <span class="kbd-key">${i+1}</span></div>`).join('')}
      </div>

      <div class="next-row"><button class="next-btn" id="nextBtn">التالي ← <span class="kbd-key">↵</span></button></div>

function creditMasteryIfNew(catId, mode, idx, wid, th){
  if(typeof wid === 'number' && th === undefined){
    th = wid;
    wid = null;
  }
  const wordId = wid || resolveWordId(catId, idx);
  if(!wordId) return;
  const threshold = th || threshFor(mode);
  const catProg = progress[catId];
  if(catProg){
    for(let i=0; i<PROGRESS_MODES.length; i++){
      const m = PROGRESS_MODES[i];
      if(m === mode) continue;
      const mProg = catProg[m];
      if(mProg && mProg.counts && (mProg.counts[wordId] || 0) >= threshFor(m)){
        return; // Already mastered in another mode; do not double count
      }
    }
  }
  stats.todayCount = (stats.todayCount || 0) + 1;
  saveStatsSoon();
  if(typeof window !== 'undefined' && window.syncManager) window.syncManager.notifyChange();
  refreshGoalDisplay();
}
if(typeof window !== 'undefined'){ window.creditMasteryIfNew = creditMasteryIfNew; }

function applyResult(catId, mode, idx, ok){
  if(!PROGRESS_MODES.includes(mode)){
    throw new Error(`Unknown progress mode: ${mode}`);
  }
  if(exState && (exState.kind === 'globalStep' || exState.kind === 'diffStep' || exState.kind === 'srsStep' || exState.kind === 'starStep')) exState.lastOk = ok;
  updateSrs(catId, idx, ok);
  recordActivity(ok);
  refreshGoalDisplay();
  const th = threshFor(mode);
  const cur = getWordCount(catId, mode, idx);
  if(ok){
    setWordCount(catId, mode, idx, Math.min(th, cur + 1));
    if(cur < th && cur + 1 >= th){
      creditMasteryIfNew(catId, mode, idx, null, th);
    }
  } else {
    // wrong: if it was mastered (review), demote it back into active practice
    // otherwise just reset streak-ish progress down a bit (not to zero, to avoid discouragement)
    if(cur >= th){
      setWordCount(catId, mode, idx, Math.max(0, th - 3));
    } else {
      setWordCount(catId, mode, idx, Math.max(0, cur - 1));
    }
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}


/* ======================= DESKTOP KEYBOARD SHORTCUTS ======================= */
function handleGlobalKeydown(e){
  if(!e) return;
  // Ignore entirely if modifier keys are pressed or composing IME
  if(e.ctrlKey || e.metaKey || e.altKey || e.isComposing || e.defaultPrevented) return;

  const key = (typeof e.key === 'string') ? e.key : '';
  if(!key) return;

  const target = e.target;
  const tagName = target && target.tagName ? target.tagName.toUpperCase() : '';
  const isInteractive = target && !target.disabled && (
    ['BUTTON', 'A', 'INPUT', 'SELECT', 'TEXTAREA', 'SUMMARY'].includes(tagName) ||
    (typeof target.matches === 'function' && target.matches('[role="button"], [contenteditable], [contenteditable="true"]')) ||
    (target.isContentEditable === true)
  );

  // If focus is in text input / textarea / editable, don't hijack anything
  if((tagName === 'INPUT' && !target.disabled) || (tagName === 'TEXTAREA' && !target.disabled) || (target && target.isContentEditable)) return;

  // Options shortcuts: 1, 2, 3, 4
  if(['1','2','3','4'].includes(key)){
    const idx = parseInt(key, 10) - 1;
    const opts = document.querySelectorAll('#qzone .options .opt, #qzone .article-options .opt');
    if(opts && opts[idx] && !opts[idx].classList.contains('disabled')){
      e.preventDefault();
      opts[idx].click();
      return;
    }
  }

  // Next / advance shortcut: Enter or Space
  // Do not intercept when focused on an interactive control (button, link, summary, etc.)
  if(key === 'Enter' || key === ' '){
    if(e.repeat) return;
    if(isInteractive) return;
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn && nextBtn.classList.contains('show')){
      e.preventDefault();
      nextBtn.click();
      return;
    }
  }

  // R or S: replay audio
  const lowerKey = key.toLowerCase();
  if(lowerKey === 'r' || lowerKey === 's'){
    if(isInteractive) return;
    const spk = document.querySelector('#qzone .listen-hero-btn, #qzone .mini-speak, #qzone .speak-btn');
    if(spk){
      e.preventDefault();
      spk.click();
      return;
    }
  }

  // Flashcards shortcuts
  if(typeof view !== 'undefined' && view.screen === 'flashcards'){
    if(key === ' ' || key === 'Enter'){
      if(isInteractive) return;
      e.preventDefault();
      if(typeof flipFlashcard === 'function') flipFlashcard();
    } else if(key === '1'){
      if(isInteractive) return;
      e.preventDefault();
      const b = document.getElementById('fcKnowBtn');
      if(b) b.click();
    } else if(key === '2'){
      if(isInteractive) return;
      e.preventDefault();
      const b = document.getElementById('fcRepeatBtn');
      if(b) b.click();
    }
  }
}

window.addEventListener('keydown', handleGlobalKeydown);



// Global event delegation handler for all interactive UI elements
document.addEventListener('click', (e) => {
  // 1. mini-speak button
  const speakBtn = e.target.closest('[data-speak]');
  if(speakBtn){
    e.stopPropagation();
    const text = speakBtn.getAttribute('data-speak');
    if(text) speak(text);
    return;
  }

  // 2. star feedback button in exercise
  const starFbBtn = e.target.closest('[data-action="toggle-star-feedback"]');
  if(starFbBtn){
    e.stopPropagation();
    const catId = starFbBtn.getAttribute('data-cat');
    const idx = parseInt(starFbBtn.getAttribute('data-idx'), 10);
    toggleStarFeedback(catId, idx, starFbBtn);
    return;
  }

  // 3. daily goal button
  const goalBtn = e.target.closest('[data-action="set-daily-goal"]');
  if(goalBtn){
    e.stopPropagation();
    const g = parseInt(goalBtn.getAttribute('data-goal'), 10);
    if(g) setDailyGoal(g);
    return;
  }

  // 4. star toggle in wordlist
  const starWlBtn = e.target.closest('[data-action="toggle-star-wordlist"]');
  if(starWlBtn){
    e.stopPropagation();
    const catId = starWlBtn.getAttribute('data-cat');
    const idx = parseInt(starWlBtn.getAttribute('data-idx'), 10);
    const wlActive = toggleStar(catId, idx);
    starWlBtn.classList.toggle('starred', wlActive);
    starWlBtn.setAttribute('aria-pressed', wlActive ? 'true' : 'false');
    starWlBtn.setAttribute('title', wlActive ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة');
    starWlBtn.setAttribute('aria-label', wlActive ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة');
    return;
  }

  // 5. star toggle in flashcard
  const starFcBtn = e.target.closest('[data-action="toggle-star-flashcard"]');
  if(starFcBtn){
    e.stopPropagation();
    const catId = starFcBtn.getAttribute('data-cat');
    const idx = parseInt(starFcBtn.getAttribute('data-idx'), 10);
    const fcActive = toggleStar(catId, idx);
    starFcBtn.classList.toggle('starred', fcActive);
    starFcBtn.setAttribute('aria-pressed', fcActive ? 'true' : 'false');
    starFcBtn.setAttribute('title', fcActive ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة');
    starFcBtn.setAttribute('aria-label', fcActive ? 'إزالة من المفضلة' : 'حفظ الكلمة في المفضلة');
    return;
  }

  // 6. flashcard flip wrapper (unless clicking inside action buttons)
  const fcWrap = e.target.closest('[data-action="flip-flashcard"]');
  if(fcWrap){
    if(!e.target.closest('button')){
      flipFlashcard();
    }
    return;
  }

  // 7. star toggle remove in starred list
  const starRemBtn = e.target.closest('[data-action="toggle-star-remove"]');
  if(starRemBtn){
    e.stopPropagation();
    const catId = starRemBtn.getAttribute('data-cat');
    const idx = parseInt(starRemBtn.getAttribute('data-idx'), 10);
    toggleStar(catId, idx);
    renderStarredList();
    return;
  }
});

async function init(){
  app.innerHTML = `<div class="done-card"><h2>...جارِ تحميل تقدّمك</h2></div>`;
  await Promise.all([loadProgress(), loadStats(), loadStarred(), loadSrs()]);

  function hasLegacyStoredKeys(){
    if(progress && typeof progress === 'object'){
      for(const c of Object.values(progress)){
        if(c && typeof c === 'object'){
          for(const [m, mv] of Object.entries(c)){
            if(m === 'coreAcked' || !mv || typeof mv !== 'object' || !mv.counts) continue;
            for(const k of Object.keys(mv.counts)){
              if(/^\d+$/.test(k)) return true;
            }
          }
        }
      }
    }
    if(starredSet && typeof starredSet.forEach === 'function'){
      for(const item of starredSet){
        if(typeof item === 'string' && /^[a-z0-9-]+_\d+$/.test(item)) return true;
      }
    }
    if(srsStore && typeof srsStore === 'object'){
      for(const k of Object.keys(srsStore)){
        if(/^[a-z0-9-]+_\d+$/.test(k)) return true;
      }
    }
    return false;
  }

  if(typeof SyncMergePolicy !== 'undefined' && typeof SyncMergePolicy.migrateLegacyUserData === 'function'){
    const formatMarker = (typeof appStorage !== 'undefined' && appStorage && appStorage.get('deutsch_data_format_v1')) ||
                         (typeof window !== 'undefined' && window.localStorage && window.localStorage.getItem('deutsch_data_format_v1'));
    if(formatMarker !== '2' || hasLegacyStoredKeys()){
      if(!SyncMergePolicy.LEGACY_INDEX_IDS || Object.keys(SyncMergePolicy.LEGACY_INDEX_IDS).length === 0){
        if(typeof showToast === 'function'){
          showToast('تعذر تحميل خريطة المعرفات القديمة. تم إيقاف الترقية لضمان عدم فقدان البيانات.');
        }
      } else {
        const migrated = SyncMergePolicy.migrateLegacyUserData({
          progress,
          srs: srsStore,
          starred: Array.from(starredSet || []),
          stats,
          dailyGoal: getDailyGoalRecord()
        });
        progress = migrated.progress || progress;
        srsStore = migrated.srs || srsStore;
        starredSet = new Set(migrated.starred || []);
        if(typeof appStorage !== 'undefined' && appStorage){
          appStorage.set('deutsch_data_format_v1', '2');
        }
        if(typeof window !== 'undefined' && window.localStorage){
          try { window.localStorage.setItem('deutsch_data_format_v1', '2'); } catch(e){}
        }
        saveProgressSoon();
        saveSrsSoon();
        saveStarredSoon();
      }
    }
  }

  if(window.syncManager){
    window.syncManager.setLocalStateProvider({
      getLocalData: () => ({
        progress: progress || {},
        stats: stats || {},
        starred: Array.from(starredSet || []),
        srs: srsStore || {},
        dailyGoal: getDailyGoalRecord()
      }),
      applyLocalData: (merged) => {
        if(merged.progress && typeof progress === 'object'){
          for(const k of Object.keys(progress)){
            if(!(k in merged.progress)) delete progress[k];
          }
          Object.assign(progress, merged.progress);
          window.progress = progress;
          appStorage.set(STORAGE_KEYS.PROGRESS, JSON.stringify(progress));
          if(window.localStorage) try { window.localStorage.setItem('deutsch_lern_v1', JSON.stringify(progress)); } catch(e){}
        }
        if(merged.stats && typeof stats === 'object'){
          Object.assign(stats, merged.stats);
          window.stats = stats;
          appStorage.set(STORAGE_KEYS.STATS, JSON.stringify(stats));
          if(window.localStorage) try { window.localStorage.setItem('deutsch_stats_v1', JSON.stringify(stats)); } catch(e){}
        }
        if(merged.starred){
          if(starredSet instanceof Set){
            starredSet.clear();
            for(const item of merged.starred) starredSet.add(item);
          } else {
            starredSet = new Set(merged.starred);
          }
          window.starredSet = starredSet;
          saveStarredSoon();
        }
        if(merged.srs && typeof srsStore === 'object'){
          for(const k of Object.keys(srsStore)){
            if(!(k in merged.srs)) delete srsStore[k];
          }
          Object.assign(srsStore, merged.srs);
          window.srsStore = srsStore;
          saveSrsSoon();
        }
        if(merged.dailyGoal){
          const target = typeof merged.dailyGoal === 'object' ? merged.dailyGoal.target : merged.dailyGoal;
          const updatedAt = typeof merged.dailyGoal === 'object' && typeof merged.dailyGoal.updatedAt === 'string' ? merged.dailyGoal.updatedAt : '';
          if(Number.isInteger(target) && target >= 5 && target <= 200){
            if(appStorage) appStorage.set(STORAGE_KEYS.DAILY_GOAL, String(target));
            if(window.localStorage) try { window.localStorage.setItem('deutsch_daily_goal_v1', String(target)); } catch(e){}
            if(updatedAt){
              setDailyGoalUpdatedAt(updatedAt);
            }
          }
        }
      }
    });
    const hadSyncEnabled = Boolean(window.localStorage && window.localStorage.getItem('deutsch_sync_enabled') === '1');
    const redirectPending = Boolean(window.localStorage && window.localStorage.getItem('deutsch_sync_redirect_pending') === '1');
    window.syncManager.init();
    window.syncManager.subscribe((status, event)=>{
      refreshAfterSync(status, event);
    });
    if((hadSyncEnabled || redirectPending) && typeof isFirebaseConfigured === 'function' && isFirebaseConfigured(window.FIREBASE_CONFIG)){
      if(typeof window.loadFirebaseSyncBundle === 'function'){
        window.loadFirebaseSyncBundle().then(()=>{
          if(window.syncManager && window.syncManager.adapter && typeof window.syncManager.adapter.attachAuthListener === 'function'){
            window.syncManager.adapter.attachAuthListener();
          }
          if(window.syncManager && window.syncManager.adapter && typeof window.syncManager.adapter.checkRedirectResult === 'function'){
            window.syncManager.adapter.checkRedirectResult().then(user=>{
              if(user && window.syncManager) window.syncManager._handleAuthChanged(user);
            }).catch(e=>{
              if(window.syncManager){
                window.syncManager.state = window.SYNC_STATES ? window.SYNC_STATES.ERROR : 'ERROR';
                window.syncManager.lastError = e.message || 'فشل استرجاع نتيجة تسجيل الدخول';
                window.syncManager._notify();
              }
            });
          }
        }).catch((e)=>{
          if(window.syncManager && redirectPending){
            window.syncManager.state = window.SYNC_STATES ? window.SYNC_STATES.ERROR : 'ERROR';
            window.syncManager.lastError = e.message || 'فشل تحميل حزمة المزامنة بعد إعادة التوجيه';
            window.syncManager._notify();
          }
        });
      }
    }
  }
  window.progress = progress;
  window.stats = stats;
  window.starredSet = starredSet;
  window.srsStore = srsStore;

  requestPersistentStorageOnce();

  if (typeof window !== 'undefined' && window.history && typeof window.history.replaceState === 'function') {
    const currentDepth = (window.history.state && typeof window.history.state.depth === 'number')
      ? window.history.state.depth
      : 0;
    historyDepth = currentDepth;
    if (window.history.state && window.history.state.view) {
      view = Object.assign({}, view, window.history.state.view);
    } else {
      window.history.replaceState({ view: cloneView(view), depth: 0 }, '');
    }
  }

  if (typeof window !== 'undefined') {
    window.addEventListener('popstate', (e) => {
      const state = e.state;
      if (state && state.view) {
        historyDepth = typeof state.depth === 'number' ? state.depth : 0;
        go(state.view, { fromPopState: true });
      } else {
        historyDepth = 0;
        go({ screen:'home', catId:null, mode:null, highlightIdx:null, fromSearch:false }, { fromPopState: true });
      }
    });
  }

  render();
}
init();
</script>
